<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>툴킷 (시범) · 의인화</title>
<!--
  툴킷을 Preact + htm 으로 다시 쓰는 시범판. prompt.html 은 그대로 두고 여기서만 시험한다.
  지금은 의인화 탭 하나만 옮겼다 — 단일 컷·콜라주·작업 기록은 아직 prompt.html 몫이다.

  글을 만드는 일은 화면 밖에 있다. lib/prompt-anthro.js 가 값만 받아
  prompt.html 과 똑같은 글을 뽑는다. 이 파일은 값을 모아 넘기고 결과를 보여 줄 뿐이다.
  자료 표는 lib/toolkit-spec.js, 저장한 설정 읽기는 lib/toolkit.js.

  아직 저장하지 않는다. prompt.html 이 쓰는 기록을 읽어 와 처음 값으로 쓰되,
  여기서 바꾼 것은 이 화면에만 남는다 — 두 화면이 같은 자리에 쓰다 엉키는 일을 막는다.
-->
<script>
(function(){var v='compact';try{if(localStorage.getItem('atelier_density_v1')==='relaxed')v='relaxed'}catch(e){}
document.documentElement.dataset.density=v})();
</script>
<script src="lib/toolkit.js"></script>
<script src="lib/toolkit-spec.js"></script>
<script src="lib/prompt-anthro.js"></script>
<script src="lib/fresh.js"></script>
<style>
:root{
  --void:#0f1115; --deck:#141821; --panel:#1b2130; --rule:#2a3242;
  --ink:#E4E9EF; --dim:#8794A3; --plate:#C9D2DC; --gold:#C9A227;
  --ui-font:12px; --ui-small:11px; --ui-height:34px;
}
:root[data-density="relaxed"]{--ui-font:14px;--ui-small:12px;--ui-height:44px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--deck);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 12px 24px;
  overscroll-behavior:contain}
.chrome{padding-top:env(safe-area-inset-top)}
.workspace-nav{display:flex;gap:6px;margin:8px 0;align-items:center;flex-wrap:wrap}
.workspace-nav a{flex:1;min-height:var(--ui-height);display:flex;align-items:center;justify-content:center;
  border:1px solid currentColor;border-radius:10px;text-decoration:none;color:inherit;
  font:600 var(--ui-small)/1.3 system-ui;opacity:.7}
.workspace-nav a[aria-current="page"]{opacity:1;background:rgba(125,160,205,.15)}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.14em}
.brand span{font-size:11px;color:var(--dim)}
header{position:sticky;top:0;z-index:30;background:var(--deck);
  border-bottom:1px solid var(--rule);margin:0 -12px;padding:8px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row + .row{margin-top:6px}
select,input[type=text],textarea{background:var(--panel);border:1px solid var(--rule);color:var(--ink);
  font:inherit;font-size:var(--ui-font);border-radius:7px;padding:7px 9px;min-width:0;width:100%;
  min-height:var(--ui-height)}
textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5}
.sw{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex:0 0 auto}
.sw button{background:var(--panel);border:0;color:var(--dim);font:inherit;font-size:var(--ui-font);
  font-weight:700;padding:0 12px;min-height:var(--ui-height);cursor:pointer}
.sw button.on{background:var(--plate);color:var(--void)}
.grow{flex:1 1 auto}
.sec{font-size:11px;color:var(--dim);letter-spacing:.08em;margin:16px 0 6px}
.grp{border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.grp > summary{cursor:pointer;padding:10px 12px;font-size:13px;font-weight:700;list-style:none}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary b{color:var(--dim);font-weight:500;font-size:11px;margin-left:6px}
.grp .body{padding:0 12px 12px}
.pdef{margin-bottom:9px}
.pdef.sub{padding-left:10px;border-left:2px solid var(--rule)}
.pdef label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.pdef label b{color:var(--ink);font-weight:600}
.out{margin-top:8px}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0}
.btn{background:var(--panel);border:1px solid var(--rule);color:var(--ink);font:inherit;
  font-size:var(--ui-font);border-radius:7px;padding:8px 12px;min-height:var(--ui-height);cursor:pointer}
.btn.go{background:var(--gold);border-color:var(--gold);color:#17130F;font-weight:700}
.note{font-size:11px;color:var(--dim);line-height:1.6}
.warn{border:1px solid var(--gold);border-radius:8px;padding:9px 11px;font-size:11.5px;
  color:var(--plate);background:rgba(201,162,39,.08);margin:8px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;
  background:var(--plate);color:var(--void);font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:999px;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);
const S = window.AtelierSpec;
const AP = window.AtelierPrompt;
const ATK = window.AtelierToolkit;

const GROUPS = [
  ['base',  '기본',      '기체 해석의 큰 방향을 정한다'],
  ['build', '체형',      'Body Type 이 전체 실루엣을 정하고, 아래 항목이 그 안에서 조정한다'],
  ['face',  '얼굴',      'Facial Character 가 전체 인상을 정하고, 아래 항목이 세부를 잡는다'],
  ['hair',  '머리',      'Hairstyle 이 형태를 정하고, 길이와 앞머리가 그 안에서 조정한다'],
  ['armor', '장갑 · 의장', '원기체 구조를 어디까지 인간 형태로 옮길지'],
  ['shot',  '연출',      '포즈 · 시점 · 장비 강조처럼 그림의 찍는 방식'],
];
const MORPHS = [
  ['standard_humanoid', '표준 인간형'],
  ['silhouette_equipment_emphasis', '실루엣 · 장비 강조'],
  ['aggressive_restructure', '적극 재구성'],
];

function getJSON(p) {
  return fetch(p, { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(p + ' — ' + r.status);
    return r.json();
  });
}

/* human-mechanical balance 값이 번역 프로필을 정한다 (prompt.html 과 같은 규칙) */
function translationOf(sel) {
  const v = sel['human-mechanical balance'] || '';
  if (v === 'more human') return 'more_human';
  if (v === 'more mechanical' || v === 'very mechanical') return 'more_mechanical';
  return 'balanced';
}

function useToast() {
  const [msg, setMsg] = useState('');
  const t = useRef(0);
  return [msg ? html`<div class="toast">${msg}</div>` : null,
    text => { setMsg(text); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 1500); }];
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fail(e); }
    ta.remove();
  });
}

/* ── 설정 항목 한 줄 ── */
function Param({ def, value, custom, onValue, onCustom }) {
  return html`
    <div class=${'pdef' + (def.sub ? ' sub' : '')}>
      <label><b>${def.ko}</b> · ${def.label}</label>
      <select value=${value} onchange=${e => onValue(e.target.value)}>
        ${def.options.map(([v, t]) => html`<option value=${v}>${t}</option>`)}
      </select>
      ${value === '__custom__' && html`
        <input type="text" style="margin-top:5px" placeholder=${def.ph || '직접 입력'}
               value=${custom} oninput=${e => onCustom(e.target.value)} />`}
    </div>`;
}

/* ── 화면 ── */
function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [series, setSeries] = useState('');
  const [mech, setMech] = useState('');
  const [gender, setGender] = useState('female');
  const [style, setStyle] = useState(S.DEFAULT_STYLE);
  const [morph, setMorph] = useState('standard_humanoid');
  const [sel, setSel] = useState({});        /* 열쇠 → 고른 값 */
  const [cus, setCus] = useState({});        /* 열쇠 → 직접 입력 */
  const [special, setSpecial] = useState('');
  const [underboob, setUnderboob] = useState(false);
  const [toast, showToast] = useToast();
  const [stamp, setStamp] = useState('');

  useEffect(() => {
    Promise.all([getJSON('data/mech.json'), getJSON('data/series.json'), ATK.load()])
      .then(([m, s]) => setData({ cards: m.cards, series: s }))
      .catch(setErr);
    setStamp(window.AtelierFresh.watch().stamp());
  }, []);

  /* prompt.html 이 남긴 설정을 처음 값으로 가져온다 (읽기만 한다) */
  useEffect(() => {
    if (!mech) return;
    const rec = ATK.recordOf(mech);
    const g = rec && rec[gender];
    setSel((g && g.sel) ? { ...g.sel } : {});
    setCus((g && g.cus) ? { ...g.cus } : {});
    setUnderboob(!!(g && g.ub));
    setSpecial((g && g.sp) || '');
  }, [mech, gender]);

  const seriesList = useMemo(() => {
    if (!data) return [];
    const keys = new Set();
    data.cards.forEach(c => (c.series || []).forEach(k => keys.add(k)));
    return [...keys];
  }, [data]);

  const mechList = useMemo(() => {
    if (!data) return [];
    return data.cards.filter(c => !series || (c.series || []).indexOf(series) >= 0);
  }, [data, series]);

  const card = useMemo(() => (data ? data.cards.find(c => c.name === mech) : null), [data, mech]);

  /* 값이 바뀔 때마다 다시 만든다. 만드는 일은 전부 lib/prompt-anthro.js 몫 */
  const prompt = useMemo(() => {
    if (!card) return '';
    const raw = [];
    S.PARAM_DEFS.forEach(def => {
      if (def.sex && def.sex !== (gender === 'female' ? 'female' : 'male')) return;
      let v = sel[def.key] || '';
      if (v === '__custom__') v = (cus[def.key] || '').trim();
      if (v) raw.push([def.key, v]);
    });
    const params = AP.paramValues(raw, { special: special.trim(), underboob, gender });
    const serName = (card.series || []).map(k => (data.series.name || {})[k] || k).join(' · ');
    return AP.buildAnthro({
      mech: card.name, series: serName, gender,
      style, morph, translation: translationOf(sel), params,
    });
  }, [card, gender, style, morph, sel, cus, special, underboob, data]);

  if (err) return html`<main><p class="warn">자료를 못 읽었다 — ${String(err.message || err)}</p></main>`;
  if (!data) return html`<main><p class="note" style="padding:40px 0;text-align:center">읽는 중…</p></main>`;

  const setOne = (k, v) => setSel(o => ({ ...o, [k]: v }));
  const setCustom = (k, v) => setCus(o => ({ ...o, [k]: v }));
  const filled = S.PARAM_DEFS.filter(d => sel[d.key]).length;

  return html`
    <main>
      <div class="chrome">
        <nav class="workspace-nav" aria-label="Atelier 화면 이동">
          <a href="prompt.html">툴킷</a>
          <a href="play.html">드래프트</a>
          <a href="dex.html">도감</a>
          <a href="prompt-next.html" aria-current="page">툴킷(시범)</a>
        </nav>
        <div class="brand">
          <h1>의인화 프롬프트</h1><span class="mono">${stamp || 'PREACT 시범'}</span>
        </div>
      </div>

      <header>
        <div class="row">
          <select value=${series} onchange=${e => { setSeries(e.target.value); setMech(''); }}>
            <option value="">시리즈 전체</option>
            ${seriesList.map(k => html`
              <option value=${k}>${(data.series.name || {})[k] || k}</option>`)}
          </select>
        </div>
        <div class="row">
          <select value=${mech} onchange=${e => setMech(e.target.value)}>
            <option value="">기체를 고르세요 (${mechList.length})</option>
            ${mechList.map(c => html`<option value=${c.name}>${c.name}</option>`)}
          </select>
        </div>
        <div class="row">
          <div class="sw">
            ${[['female', '여'], ['male', '남']].map(([g, t]) => html`
              <button class=${gender === g ? 'on' : ''} onclick=${() => setGender(g)}>${t}</button>`)}
          </div>
          <select class="grow" value=${style} onchange=${e => setStyle(e.target.value)}
                  style="flex:1 1 auto;width:auto">
            ${S.ART_STYLES.map(r => html`<option value=${r[0]}>${r[1]}</option>`)}
          </select>
        </div>
      </header>

      ${!card
        ? html`<p class="note" style="padding:32px 0;text-align:center">기체를 고르면 설정과 프롬프트가 나온다</p>`
        : html`
          <p class="sec">결과 · ${prompt.length.toLocaleString()}자 · 채운 항목 ${filled}</p>
          <textarea class="out" readonly value=${prompt}></textarea>
          <div class="bar">
            <button class="btn go" onclick=${() => copyText(prompt).then(
              () => showToast('복사했다 · ' + card.name), () => showToast('복사 실패'))}>프롬프트 복사</button>
          </div>
          <p class="warn">
            시범판이라 <b>저장하지 않는다.</b> 처음 값은 툴킷에 저장된 설정에서 가져오고,
            여기서 바꾼 것은 이 화면에만 남는다. 기록에 남기려면 툴킷에서 하세요.
          </p>

          <div class="row" style="margin-top:12px">
            <select value=${morph} onchange=${e => setMorph(e.target.value)}>
              ${MORPHS.map(([k, t]) => html`<option value=${k}>형태 · ${t}</option>`)}
            </select>
          </div>

          ${GROUPS.map(([g, title, hint]) => {
            const defs = S.PARAM_DEFS.filter(d => d.group === g)
              .filter(d => !d.sex || d.sex === (gender === 'female' ? 'female' : 'male'));
            if (!defs.length) return null;
            const n = defs.filter(d => sel[d.key]).length;
            return html`
              <details class="grp" open=${g === 'base'}>
                <summary>${title}<b>${n ? n + ' / ' + defs.length : defs.length}</b></summary>
                <div class="body">
                  <p class="note" style="margin:0 0 8px">${hint}</p>
                  ${defs.map(def => html`
                    <${Param} key=${def.key} def=${def}
                              value=${sel[def.key] || ''} custom=${cus[def.key] || ''}
                              onValue=${v => setOne(def.key, v)}
                              onCustom=${v => setCustom(def.key, v)} />`)}
                </div>
              </details>`;
          })}

          <p class="sec">그 밖에</p>
          <div class="pdef">
            <label><b>특이사항</b> · Special Characteristics</label>
            <input type="text" placeholder="흉터, 문신, 의안 같은 것"
                   value=${special} oninput=${e => setSpecial(e.target.value)} />
          </div>
          ${gender === 'female' && html`
            <label class="note" style="display:flex;gap:7px;align-items:center;margin-top:6px">
              <input type="checkbox" checked=${underboob}
                     onchange=${e => setUnderboob(e.target.checked)} style="width:auto;min-height:0" />
              언더부스트 장갑 문구 넣기
            </label>`}
        `}
    </main>
    ${toast}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
