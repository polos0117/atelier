            </div>
            <details class="grp" style="margin-top:8px">
              <summary><span>랜덤으로 정할 것<em class=${tgtOn ? 'on' : ''}>  ${tgtOn}/${CLG_TARGETS.length}개 켬</em></span>
                <i>끈 칸은 굴려도 그대로 둔다</i></summary>
              <div class="grp-in"><div class="rnd-tgt">
                ${CLG_TARGETS.map(([k, ko]) => html`
                  <label key=${k}><input type="checkbox" checked=${!!st.tgt[k]}
                    onchange=${e => setTgt(k, e.target.checked)} /><span>${ko}</span></label>`)}
              </div></div>
            </details>
            <label style="display:flex;align-items:center;gap:6px;margin:8px 0 0;cursor:pointer;font-size:11.5px;color:var(--muted)">
              <input type="checkbox" checked=${st.avoid} style="width:auto;margin:0;flex:none"
                     onchange=${e => set('avoid', e.target.checked)} />
              <span>이미 쓴 카테고리는 빼고 뽑기</span>
            </label>
            <div class="field" style="margin-top:10px">
              <label>Overall Custom Instructions <small>전체 추가 지시</small></label>
              <input type="text" placeholder="예: moonlit pool preferred, avoid black mini dresses"
                     value=${st.custom} oninput=${e => set('custom', e.target.value)} />
            </div>
          </div>
        </aside>

        <div class="studio-editor">
          <div class="section-caption"><b>02</b> 여섯 칸을 어떻게 나눌까</div>
          <div class="param-note" style="margin:10px 0 0">
            <b>Pair 로 묶는다는 것</b> — 두 칸을 같은 주제의 <b>약한 컷 / 강한 컷</b> 한 쌍으로 만든다.
            묶기를 풀면 그 두 칸이 서로 무관해져서 각자 다른 카테고리를 고를 수 있다.
          </div>
          <div class="gender-tabs" style="margin-top:9px">
            ${[['pair', 'Pair 구성'], ['panel', 'Panel 개별']].map(([k, ko]) => html`
              <button type="button" key=${k} class=${'gt' + (st.build === k ? ' on' : '')}
                      onclick=${() => set('build', k)}>${ko}</button>`)}
          </div>

          ${st.build === 'pair' ? html`
            <div style="margin-top:10px">
              ${[1, 2, 3].map(n => {
                const q = st.pairs[n];
                return html`
                <details class="grp" key=${'p' + n} open=${true}>
                  <summary><span>PAIR ${n}<em class=${q.use ? 'on' : ''}>  Panel ${n * 2 - 1} ‹ Panel ${n * 2}</em></span>
                    <i>${q.use ? '묶음 — 약한 컷 / 강한 컷' : '풀림 — 두 칸이 따로 논다'}</i></summary>
                  <div class="grp-in">
                    <label style="display:flex;align-items:center;gap:7px;margin:0 0 8px;cursor:pointer;font-size:11.5px">
                      <input type="checkbox" checked=${q.use} style="width:auto;margin:0;flex:none"
                             onchange=${e => setPair(n, 'use', e.target.checked)} /><span>이 Pair 로 묶기</span></label>
                    <div class="field">
                      <label>Category <small>카테고리</small></label>
                      <select aria-label=${'Pair ' + n + ' 카테고리'} value=${q.key}
                              onchange=${e => setPairKey(n, e.target.value)}>
                        ${catRows(gender).map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]} — ${r[2]}</option>`)}
                      </select>
                      ${q.key === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="카테고리 직접 입력"
                        value=${q.custom} oninput=${e => setPair(n, 'custom', e.target.value)} />` : null}
                      ${S.CAT_KO[q.key] ? html`<div class="param-note" style="margin-top:4px">${S.CAT_KO[q.key]}</div>` : null}
                    </div>
                    <div class="field" style="margin-top:9px">
                      <label>Example Menu <small>예시 메뉴</small></label>
                      <select aria-label=${'Pair ' + n + ' 예시'} value=${q.exampleKey}
                              onchange=${e => setPair(n, 'exampleKey', e.target.value)}>
                        ${exGroups(q.key, false)}
                      </select>
                      ${q.exampleKey === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="예시 직접 입력"
                        value=${q.exampleCustom} oninput=${e => setPair(n, 'exampleCustom', e.target.value)} />` : null}
                      ${q.exampleKey && S.EX_NOTE[q.exampleKey]
                        ? html`<div class="param-note" style="margin-top:4px">${S.EX_NOTE[q.exampleKey]}</div>` : null}
                    </div>
                    <div class="param-grid" style="margin-top:9px">
                      <div class="field"><label>Expression <small>표정 · 이 Pair 공통</small></label>
                        <select value=${q.expr} onchange=${e => setPair(n, 'expr', e.target.value)}>
                          ${optRows(S.EXPRESSION_OPTIONS)}</select></div>
                      <div class="field"><label>Body Orientation <small>앞/옆/뒷태</small></label>
                        <select value=${q.orient} onchange=${e => setPair(n, 'orient', e.target.value)}>
                          ${optRows(S.ORIENTATION_OPTIONS)}</select></div>
                      <div class="field"><label>Pose <small>포즈</small></label>
                        <select value=${q.pose} onchange=${e => setPair(n, 'pose', e.target.value)}>
                          ${optRows(S.POSE_OPTIONS)}</select></div>
                    </div>
                    <details class="grp" style="margin-top:9px">
                      <summary><span>세부 강도<em class=${S.PAIR_ONLY.concat(S.LOCAL_AXES).filter(k => q.adv[k]).length ? 'on' : ''}>
                        ${S.PAIR_ONLY.concat(S.LOCAL_AXES).filter(k => q.adv[k]).length
                          ? '  ' + S.PAIR_ONLY.concat(S.LOCAL_AXES).filter(k => q.adv[k]).length + ' 지정' : ''}</em></span>
                        <i>비워두면 전역 설정을 따른다 — 값이 있으면 이 Pair 에서만 덮는다</i></summary>
                      <div class="grp-in">
                        ${S.PAIR_ONLY.concat(S.LOCAL_AXES).map(k => axisField(k, q.adv[k], v => setPairAdv(n, k, v)))}
                      </div>
                    </details>
                  </div>
                </details>`;
              })}
            </div>`
          : html`
            <div style="margin-top:10px">
              <div class="gender-tabs" style="flex-wrap:wrap">
                ${[1, 2, 3, 4, 5, 6].map(n => html`
                  <button type="button" key=${'t' + n} class=${'gt' + (st.panelTab === n ? ' on' : '')}
                          onclick=${() => set('panelTab', n)}>${n}</button>`)}
              </div>
              ${(() => {
                const n = st.panelTab, p = st.panels[n];
                return html`
                <div class="grp-in" style="margin-top:9px">
                  <div class="param-note">Panel ${n} — ${n % 2 ? '약한 컷' : '강한 컷'} · Pair ${pairOf(n)}
                    ${st.pairs[pairOf(n)].use ? ' (묶여 있다 — 비워두면 Pair 를 따른다)' : ' (풀려 있다 — 이 칸이 혼자 정한다)'}</div>
                  <div class="field" style="margin-top:9px">
                    <label>Category <small>개별 카테고리</small></label>
                    <select aria-label=${'Panel ' + n + ' 카테고리'} value=${p.cat}
                            onchange=${e => { setPanel(n, 'cat', e.target.value); setPanel(n, 'exampleKey', ''); }}>
                      ${catRows(gender).map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]} — ${r[2]}</option>`)}
                    </select>
                    ${p.cat === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="카테고리 직접 입력"
                      value=${p.catCustom} oninput=${e => setPanel(n, 'catCustom', e.target.value)} />` : null}
                  </div>
                  <div class="field" style="margin-top:9px">
                    <label>Panel Example <small>개별 예시</small></label>
                    <select aria-label=${'Panel ' + n + ' 예시'} value=${p.exampleKey}
                            onchange=${e => setPanel(n, 'exampleKey', e.target.value)}>
                      <option value="">AUTO — Pair 예시 따름</option>
                      ${exGroups(p.cat || st.pairs[pairOf(n)].key, true)}
                    </select>
                    ${p.exampleKey === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="개별 예시 직접 입력"
                      value=${p.exampleCustom} oninput=${e => setPanel(n, 'exampleCustom', e.target.value)} />` : null}
                  </div>
                  <div class="param-grid" style="margin-top:9px">
                    <div class="field"><label>Expression <small>표정</small></label>
                      <select value=${p.ov.expression || ''} onchange=${e => setOv(n, 'expression', e.target.value)}>
                        ${optRows(S.EXPRESSION_OPTIONS)}</select></div>
                    <div class="field"><label>Body Orientation <small>앞/옆/뒷태 방향</small></label>
                      <select value=${p.ov.orientation || ''} onchange=${e => setOv(n, 'orientation', e.target.value)}>
                        ${optRows(S.ORIENTATION_OPTIONS)}</select></div>
                    <div class="field"><label>Pose <small>포즈</small></label>
                      <select value=${p.ov.pose || ''} onchange=${e => setOv(n, 'pose', e.target.value)}>
                        ${optRows(S.POSE_OPTIONS)}</select></div>
                  </div>
                  ${OV_TEXTS.map(([k, en, ko]) => html`
                    <div class="field" key=${k} style="margin-top:7px">
                      <label>${en} <small>${ko}</small></label>
                      <input type="text" placeholder="AUTO" value=${p.ov[k] || ''}
                             oninput=${e => setOv(n, k, e.target.value)} /></div>`)}
                  <details class="grp" style="margin-top:9px">
                    <summary><span>세부 강도<em class=${S.LOCAL_AXES.filter(k => p.ov['adv_' + k]).length ? 'on' : ''}>
                      ${S.LOCAL_AXES.filter(k => p.ov['adv_' + k]).length
                        ? '  ' + S.LOCAL_AXES.filter(k => p.ov['adv_' + k]).length + ' 지정' : ''}</em></span>
                      <i>비워두면 전역 설정을 따른다 — 값이 있으면 이 패널에서만 덮는다</i></summary>
                    <div class="grp-in">
                      ${S.LOCAL_AXES.map(k => axisField(k, p.ov['adv_' + k], v => setOv(n, 'adv_' + k, v)))}
                    </div>
                  </details>
                </div>`;
              })()}
            </div>`}

          <details class="grp" style="margin-top:10px">
            <summary><span>콜라주 고급 설정<em class=${advOn ? 'on' : ''}>${advOn ? '  ' + advOn + ' 지정' : ''}</em></span>
              <i>여섯 칸 전체에 걸리는 값</i></summary>
            <div class="grp-in">
              ${Object.keys(S.ADVANCED_OPTIONS).map(k => axisField(k, st.adv[k], v => setAdv(k, v)))}
              <div class="field" style="margin-top:9px"><label>Expression Mode <small>표정 모드</small></label>
                <select value=${st.globals.expressionMode}
                        onchange=${e => setGlobal('expressionMode', e.target.value)}>${optRows(CLG_EXPR_MODES)}</select></div>
              <div class="field" style="margin-top:7px"><label>Body Orientation Mix <small>앞/옆/뒷태 비율</small></label>
                <select value=${st.globals.orientationMix}
                        onchange=${e => setGlobal('orientationMix', e.target.value)}>${optRows(CLG_ORIENT_MIX)}</select></div>
              <div class="field" style="margin-top:7px"><label>Framing <small>화각 · 전체 기준</small></label>
                <select aria-label="전체 화각" value=${st.globals.frame}
                        onchange=${e => setGlobal('frame', e.target.value)}>${optRows(CLG_FRAMES)}</select></div>
            </div>
          </details>

          <div class="save-bar" style="align-items:flex-start;flex-direction:column;gap:6px;margin-top:10px">
            ${[['carryFace', '이 기체의 얼굴 설정을 정체성에 넘기기'],
               ['carryBody', '이 기체의 체형 설정을 정체성에 넘기기']].map(([k, ko]) => html`
              <label key=${k} style="display:flex;align-items:center;gap:7px;margin:0;cursor:pointer;font-size:11.5px">
                <input type="checkbox" checked=${!!st[k]} style="width:auto;margin:0;flex:none"
                       onchange=${e => set(k, e.target.checked)} /><span>${ko}</span></label>`)}
            <span class="uz">
              ${st.carryFace ? '얼굴 ' + AL.carryValues(S.CARRY_FACE, record, gender).length + '개' : ''}
              ${st.carryBody ? ' · 체형 ' + AL.carryValues(S.CARRY_BODY, record, gender).length + '개' : ''}
            </span>
          </div>

          <details class="grp" style="margin-top:9px" open=${usedOpen}
                   ontoggle=${e => setUsedOpen(e.target.open)}>
            <summary><span>쓴 컷 기록<em class=${used.length ? 'on' : ''}>${used.length ? '  ' + used.length + '조합' : ''}</em></span>
              <i>채택이 아니라 복사 기록이다</i></summary>
            <div class="grp-in">
              ${used.length ? html`
                <div class="used-box">${used.map(r => {
                  const cr = catRows(gender).find(x => x[0] === r.cat);
                  const er = exRows(r.cat, gender).find(x => x[0] === r.ex);
                  return html`<span class="uchip" key=${r.cat + '|' + r.ex}>
                    <b>${cr ? cr[2] : r.cat}</b>${er ? html`<i>${er[2]}</i>` : null}
                    <u>${r.n > 1 ? r.n + '회 · ' : ''}${new Date(r.t).getMonth() + 1}/${new Date(r.t).getDate()}</u></span>`;
                })}</div>
                <button type="button" class="sb-drop" style="margin-top:7px" onclick=${clearUse}>기록 삭제</button>`
              : html`<span class="uz">아직 없다. 프롬프트를 복사하면 여기에 쌓인다.</span>`}
            </div>
          </details>

          <div class="param-actions">
            <button type="button" onclick=${() => setStatus('콜라주 설정 적용 완료')}>설정 반영</button>
            <button type="button" onclick=${reset}>콜라주 리셋</button>
          </div>
        </div>
      </div>

      <div class="ko-sum">
        <div class="ks-t">지금 설정 요약</div>
        ${summary.rows.map(r => html`<div class="ks-r" key=${r.n}>
          <b>${r.use ? 'PAIR ' + r.n : '패널 ' + (r.n * 2 - 1) + '·' + (r.n * 2)}</b>${r.ko}${r.ex ? ' — ' + r.ex : ''}
          ${r.use ? null : html`<u>묶기 풀림</u>`}</div>`)}
        <div class="ks-f">${summary.flags.join(' · ')}</div>
      </div>

      <div class="controls">
        <button class="primary" type="button" disabled=${!prompt}
                onclick=${() => copyText(prompt).then(
                  () => { noteUse(); setStatus('클립보드에 복사했다 — 쓴 컷 기록에 쌓았다'); },
                  () => setStatus('복사에 실패했다'))}>클립보드 복사</button>
        <button type="button" aria-expanded=${String(showText)}
                onclick=${() => setShowText(v => !v)}>${showText ? '텍스트 닫기' : '텍스트 보기'}</button>
      </div>
      <div class="status" role="status">${status}</div>
      ${showText && html`
        <div class="prompt-view">
          <textarea aria-label="생성 프롬프트" readonly spellcheck="false" value=${prompt}></textarea>
        </div>`}
    </section>`;
}


function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [series, setSeries] = useState('');
  const [mech, setMech] = useState('');
  const [gender, setGender] = useState('female');
  const [style, setStyle] = useState(S.DEFAULT_STYLE);
  const [tab, setTab] = useState('anthro');
  const [zoom, setZoom] = useState(null);
  const [toast, showToast] = useToast();
  const [stamp, setStamp] = useState('');
  const [prevFrom, setPrevFrom] = useState('');
  const prevRef = useRef(null);
  const box = useRef(null);
  if (!box.current) {
    box.current = ATK.open(ATK.STORE_KEY,
      { last: {}, anthro: {}, collage: null, used: {}, style: {}, locks: {} });
  }

  useEffect(() => {
    Promise.all([getJSON('data/mech.json'), getJSON('data/series.json'), ATK.load(), AIMG.load()])
      .then(([m, s, , img]) => setData({ cards: m.cards, series: s, img }))
      .catch(setErr);
    setStamp(window.AtelierFresh.watch().stamp());
    const st = box.current.data;
    if (st.last && st.last.mech) { setSeries(st.last.series || ''); setMech(st.last.mech); }
  }, []);

  const seriesList = useMemo(() => {
    if (!data) return [];
    const keys = new Set();
    data.cards.forEach(c => (c.series || []).forEach(k => keys.add(k)));
    return [...keys];
  }, [data]);
  const mechList = useMemo(() => !data ? []
    : data.cards.filter(c => !series || (c.series || []).indexOf(series) >= 0), [data, series]);
  const card = useMemo(() => data ? data.cards.find(c => c.name === mech) : null, [data, mech]);

  if (err) return html`<p class="status warn">자료를 못 읽었다 — ${String(err.message || err)}</p>`;
  if (!data) return html`<p class="status">읽는 중…</p>`;

  return html`
    <nav class="workspace-nav" aria-label="Atelier 화면 이동">
      <a href="prompt.html">툴킷</a>
      <a href="play.html">드래프트</a>
      <a href="dex.html">도감</a>
      <a href="prompt-next.html" aria-current="page">툴킷(시범)</a>
    </nav>

    <${AppearanceControls} />
    <${WorkspaceHeading} title="캐릭터 스튜디오" code="PROMPT TOOLKIT"
      subtitle="기체의 개성을 고르고, 나만의 캐릭터로." />
    <div class="gender-tabs" role="tablist" aria-label="프롬프트 갈래" style="margin-bottom:10px">
      ${[['anthro', '의인화'], ['single', '단일 컷'], ['collage', '콜라주']].map(([k, ko]) => html`
        <button type="button" key=${k} role="tab" aria-selected=${String(tab === k)}
                class=${'gt' + (tab === k ? ' on' : '')} onclick=${() => setTab(k)}>${ko}</button>`)}
    </div>
    ${tab === 'anthro'
      ? html`<${AnthroPanel} data=${data} series=${series} setSeries=${setSeries}
          mech=${mech} setMech=${setMech} gender=${gender} setGender=${setGender}
          style=${style} setStyle=${setStyle} box=${box}
          seriesList=${seriesList} mechList=${mechList} card=${card}
          prevRef=${prevRef} prevFrom=${prevFrom} setPrevFrom=${setPrevFrom}
          onZoom=${z => setZoom(z)} />`
      : tab === 'single'
      ? html`<${SinglePanel} data=${data} series=${series} setSeries=${setSeries}
          mech=${mech} setMech=${setMech} gender=${gender} setGender=${setGender}
          style=${style} setStyle=${setStyle} box=${box}
          seriesList=${seriesList} mechList=${mechList} card=${card} />`
      : html`<${CollagePanel} data=${data} series=${series} setSeries=${setSeries}
          mech=${mech} setMech=${setMech} gender=${gender} setGender=${setGender}
          style=${style} setStyle=${setStyle} box=${box}
          seriesList=${seriesList} mechList=${mechList} card=${card} />`}
    <span class="build-stamp">${stamp}</span>

    ${zoom && html`<${Zoom} list=${zoom.list} start=${zoom.i} onClose=${() => setZoom(null)} />`}
    ${toast}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
