<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

<meta name="theme-color" content="#0f1115">
<title>툴킷 (시범) · 의인화</title>
<!--
  툴킷 의인화 탭을 Preact + htm 으로 옮긴 시범판. prompt.html 은 그대로 둔다.

  Preact 상태와 필드 컴포넌트는 유지하고, 공통 workspace 스타일로 화면을 구성한다.
  테마·밀도는 외형 생성 설정과 별개이며 도감과 공유한다.

  글을 만드는 일은 화면 밖에 있다 — lib/prompt-anthro.js 가 값만 받아
  prompt.html 과 똑같은 글을 뽑는다. 자료 표는 lib/toolkit-spec.js,
  저장은 lib/toolkit.js 가 맡는다.
  ?v= 는 캐시 우회용이다. lib 를 고치면 이 값을 올린다.
-->
<script src="lib/img.js?v=4"></script>
<script src="lib/toolkit.js?v=4"></script>
<script src="lib/toolkit-spec.js?v=4"></script>
<script src="lib/figures.js?v=4"></script>

<style>
:root{
  color-scheme:light dark;
  --bg:#0f1115;--card:#171a21;--card2:#1e222b;--text:#f4f6f8;
  --muted:#aeb6c2;--line:#303744;--accent:#6ea8fe;--ok:#75d69c;--warn:#f0c36b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--text)}
a{color:var(--accent)}
select,input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;min-height:40px}
textarea{min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5}
button{font:inherit}
.workspace-nav{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.workspace-nav a{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--muted);
  font:600 12px/1.3 system-ui}
.workspace-nav a[aria-current="page"]{color:var(--text);background:var(--card2)}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.form-section{padding:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;
  background:var(--text);color:var(--bg);font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:999px;pointer-events:none}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(8,10,13,.95);display:flex;
  align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:4px}
.zpg{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;
  background:rgba(15,19,24,.6);color:#fff;font-size:11px;font-weight:700;
  padding:5px 9px;border-radius:999px;pointer-events:none}
.figrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:6px}
.figcell{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:8px;
  padding:4px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px}
.figcell.on{border-color:var(--accent);color:var(--text)}
.figcell svg{width:52px;height:auto;display:block}
.figcell b{font-size:9.5px;font-weight:600;max-width:60px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.srcbox>summary .sb-txt{flex:none;font-size:10.5px;color:var(--muted);white-space:nowrap}
.field,.pair-card,.override-card,.param-card,.rec-card{border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:9px}
.field label,.param-card label,.override-card label,.pair-card label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--text)}
.field label small,.param-card label small,.override-card label small,.pair-card label small{color:var(--muted);font-weight:500;margin-left:5px}
.gender-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.gender-tabs .gt{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:9px 6px;border-radius:7px;cursor:pointer}
.gender-tabs .gt.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.save-bar{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.4}
.save-bar .sb-drop{flex:none;font-size:11px;padding:5px 9px}
.save-bar .sb-drop.hidden{display:none}
.pair-card.off .param-preview{display:none}
.sw-hidden{display:none}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-top:2px}
.sw{padding:4px 2px 3px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:0}
.sw i{width:22px;height:22px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);font-style:normal;font-size:12px;line-height:22px;text-align:center;color:var(--muted)}
.sw u{text-decoration:none;font-size:9px;line-height:1.15;color:var(--muted);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sw.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.sw.on u{color:var(--text);font-weight:700}
.sw-auto i{background:repeating-linear-gradient(45deg,var(--card2) 0 4px,var(--line) 4px 8px)}
.sw-cus i{background:var(--card2)}
.sw-big{flex:none;display:flex;gap:4px}
.sw-big i{width:44px;height:44px;border-radius:10px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.sw-big.two i{width:30px;height:44px}
.param-preview{margin-top:8px;display:block;padding:8px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.param-preview .pp-main{display:flex;gap:10px;align-items:center}
.pp-gal{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.pp-gal-t{font-size:11px;color:var(--muted);margin-bottom:5px}
.pp-gal-r{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pp-gal-r a{flex:none;width:52px;text-decoration:none;color:var(--muted)}
.pp-gal-r img{width:52px;height:70px;object-fit:cover;object-position:50% 18%;border-radius:5px;display:block;background:var(--card2)}
.pp-gal-r span{display:block;font-size:9.5px;line-height:1.25;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.param-preview.hidden{display:none}
.param-preview svg{flex:none;display:block}
.param-preview .pp-txt{font-size:11.5px;line-height:1.5;color:var(--muted)}
.param-preview .pp-txt b{display:block;color:var(--text);font-size:12px;margin-bottom:2px}
.help,.param-note{margin-top:8px;padding:9px 10px;border-radius:9px;background:var(--card2);color:var(--muted);font-size:12px;line-height:1.45}
.custom-input{margin-top:7px}
.rnd-tgt{margin-top:8px;padding:8px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.rnd-tgt>span{width:100%;font-size:10.5px;color:var(--muted)}
.rnd-tgt label{display:flex;align-items:center;gap:5px;margin:0;cursor:pointer;font-size:11.5px;color:var(--text)}
.rnd-tgt input{width:auto;margin:0;flex:none}
.lockwrap{display:flex;align-items:stretch;gap:6px}
.lockwrap>select,.lockwrap>input{flex:1 1 auto;min-width:0}
.lockbtn{flex:0 0 auto;width:44px;min-height:0;padding:0;font-size:15px;line-height:1;
  background:var(--card);border:1px solid var(--line);color:var(--muted);opacity:.7}
.lab-lock .lockbtn{position:absolute;right:0;top:0}
.lockbtn.mini{width:28px;height:28px;min-height:28px;font-size:12px;border-radius:7px}
.rnd-top{width:100%;margin-top:8px;font-size:12.5px}
.lock-note{width:100%;font-size:11px;color:var(--accent);font-weight:700}
.lock-clear{width:100%;margin-top:4px;min-height:34px;padding:6px;font-size:11px;font-weight:600}
.lockbtn.on{background:color-mix(in srgb,var(--accent) 16%,var(--card));
  border-color:var(--accent);color:var(--accent);opacity:1}
.card-rnd{width:100%;margin-top:8px;font-size:11.5px}
.card-rnd.sub{margin-top:5px;font-size:11px;opacity:.85}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.status{min-height:24px;padding:0 12px 12px;color:var(--muted);font-size:12px}
.status.ok{color:var(--ok)}
.prompt-view{border-top:1px solid var(--line)}
.prompt-view textarea{display:block;height:62vh;min-height:420px;border:0;outline:0;padding:14px;background:#11141a;color:#e8edf3;font:12.5px/1.52 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre;overflow:auto;resize:vertical}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.param-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .pair-card,.field,.override-card,.param-card,.rec-card{padding:10px}
  .top-grid,.grid2,.grid3,.override-grid,.param-grid,.controls,.param-actions,.preset-row,.rec-grid{grid-template-columns:1fr}
  .prompt-view textarea{height:66vh;min-height:390px;font-size:12px}
  .prompt-view textarea{background:#fbfcfe;color:#14171c}
.field,.pair-card,.param-card,.override-card,.rec-card{min-width:0}
.prompt-view textarea{white-space:pre-wrap;overflow-wrap:anywhere;min-height:280px;height:55dvh;font-size:14px}
.panel,.form-section,.prompt-view{scroll-margin-top:125px}
 .mini-check,.rnd-tgt label{min-height:36px}
 .grid2,.param-grid,.param-actions,.controls,.rec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.field,.pair-card,.override-card,.param-card,.rec-card{padding:7px}
.field label,.param-card label,.override-card label,.pair-card label{font-size:11px;margin-bottom:4px}
.grid2,.grid3,.param-grid,.rec-grid{gap:6px}
.help,.param-note{padding:7px 8px;font-size:11px;line-height:1.4}
.mini-check,.rnd-tgt label{min-height:26px}
.controls,.param-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px}
.prompt-view textarea{font-size:12px;padding:10px}
.panel-head,.form-section,.controls,.param-actions{padding:calc(var(--ui-pad) + 2px)}
.field,.pair-card,.override-card,.param-card,.rec-card{padding:calc(var(--ui-pad) + 1px)}
.field label,.param-card label,.override-card label,.pair-card label{font-size:var(--ui-small)}
.panel-head span,.help,.param-note{font-size:var(--ui-small)}
.grid2,.grid3,.param-grid,.rec-grid,.controls,.param-actions{gap:var(--ui-gap)}
.prompt-view textarea{font-size:var(--ui-font)}
.lockbtn.mini{width:28px;height:28px;min-height:28px;padding:0;font-size:12px}
:root[data-density="relaxed"] .lockbtn.mini{width:34px;height:34px;min-height:34px}
</style>

<body class="prompt-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

import { AppearanceControls, WorkspaceHeading } from './lib/workspace-ui.js?v=1';

const html = htm.bind(h);
const S = window.AtelierSpec;
const AP = window.AtelierPrompt;
const ATK = window.AtelierToolkit;
const AIMG = window.AtelierImg;
const FIG = window.AtelierFigures;

const MORPHS = [
  ['standard_humanoid', '표준형 — 일반적인 사람형 MS'],
  ['silhouette_equipment_emphasis', '실루엣/장비 강조형 — 어깨·팔다리·바인더 등 외곽 인상이 중요할 때'],
  ['aggressive_restructure', '강변형형 — 일반 의인화로는 원본 느낌이 죽는 난형 기체용'],
];

function getJSON(p) {
  return fetch(p, { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(p + ' — ' + r.status);
    return r.json();
  });
}

/* 성별 전용 값 거르기 — 남성에서 여성 전용 값이 뜨면 안 되고,
   성별을 바꿀 때 그 성별에 없는 값은 AUTO 로 되돌려야 한다 (원본과 같은 규칙) */
function allowed(key, val, gender) {
  const o = S.ONLY[key];
  return !o || !o[val] || o[val] === gender;
}
function optionsFor(def, gender) {
  return def.options.filter(o => allowed(def.key, o[0], gender));
}
function fitsGender(def, gender) { return !def.sex || def.sex === gender; }

function translationOf(sel) {
  const v = sel['human-mechanical balance'] || '';
  if (v === 'more human') return 'more_human';
  if (v === 'more mechanical' || v === 'very mechanical') return 'more_mechanical';
  return 'balanced';
}

function useToast() {
  const [msg, setMsg] = useState('');
  const t = useRef(0);
  return [msg ? html`<div class="toast">${msg}</div>` : null,
    text => { setMsg(text); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 1600); }];
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fail(e); }
    ta.remove();
  });
}

/* ── 자물쇠 ── */
function LockIcon({ open }) {
  return html`
    <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"
            fill-opacity=${open ? '.15' : '.35'} />
      ${open ? html`<path d="M8 9V6.5a3.5 3.5 0 0 1 6.6-1.6" />`
             : html`<path d="M7 9V6.5a3 3 0 0 1 6 0V9" />`}
    </svg>`;
}

/* ── 미리보기 ──
   원본과 같은 세 가지를 보여 준다.
     색   눈·머리색은 큰 색 조각. 두 눈 색이 다르면 좌우를 나눠 보여 준다
     도식 체형·머리는 선으로 그린 실루엣
     초상 그 값으로 실제 뽑아둔 기체 (최대 8기) */
function Preview({ def, value, sel, gender, img, style, exclude, onZoom }) {
  const v = gender === 'female' ? 'f' : 'm';
  const isColor = !!S.COLOR_KEYS[def.key];
  const hex = S.COLOR_HEX[value];

  const hits = useMemo(() => {
    if (!value) return [];
    const out = [];
    ATK.listCards().forEach(name => {
      if (name === exclude) return;
      const rec = ATK.recordOf(name), g = rec && rec[gender];
      if (!g || !g.sel || g.sel[def.key] !== value) return;
      const file = AIMG.portraitOf(img[name], v, style);
      if (file) out.push({ card: name, file });
    });
    return out.slice(0, 8);
  }, [def.key, value, gender, style, exclude, img]);

  const figs = useMemo(() => {
    if (def.key !== 'body type' && def.key !== 'hairstyle') return [];
    return optionsFor(def, gender)
      .filter(([k]) => k && k !== '__custom__')
      .map(([k, t]) => ({ k, t: t.split(' — ')[0], svg: FIG.forKey(def.key, k, gender) }))
      .filter(x => x.svg);
  }, [def.key, gender]);

  if (!value || value === '__custom__') return null;

  /* 두 눈 색 — 서로 다르면 좌우로 나눠 보여 준다 (원본과 같은 안내) */
  let colorHead = null;
  if (isColor && hex) {
    const pairKey = def.key === 'eye color' ? 'second eye color'
                  : def.key === 'second eye color' ? 'eye color' : null;
    const otherHex = pairKey ? S.COLOR_HEX[sel[pairKey]] : null;
    if (pairKey && otherHex) {
      const L = def.key === 'eye color' ? hex : otherHex;
      const R = def.key === 'eye color' ? otherHex : hex;
      colorHead = L === R
        ? html`<span class="sw-big"><i style=${{ background: L }}></i></span>
               <div class="pp-txt"><b>양쪽 동일 색상</b>두 눈이 같은 색이다</div>`
        : html`<span class="sw-big"><i style=${{ background: R }}></i></span>
               <span class="sw-big"><i style=${{ background: L }}></i></span>
               <div class="pp-txt"><b>오드아이</b>오른쪽 · 왼쪽 순서로 지킨다</div>`;
    } else {
      colorHead = html`<span class="sw-big"><i style=${{ background: hex }}></i></span>`;
    }
  }

  if (!colorHead && !figs.length && !hits.length) return null;

  return html`
    <div class="param-preview">
      ${colorHead && html`<div class="pp-main">${colorHead}</div>`}
      ${figs.length ? html`
        <div class="figrow">
          ${figs.map(f => html`
            <div class=${'figcell' + (f.k === value ? ' on' : '')} key=${f.k}
                 dangerouslySetInnerHTML=${{ __html: f.svg + '<b>' + f.t + '</b>' }}></div>`)}
        </div>` : null}
      ${hits.length ? html`
        <div class="pp-gal">
          <div class="pp-gal-t">이 값으로 뽑은 기체 ${hits.length}기 · 눌러서 크게 보기</div>
          <div class="pp-gal-r">
            ${hits.map((x, i) => html`
              <a key=${x.file} onclick=${e => { e.preventDefault(); onZoom(hits.map(y => y.file), i); }}
                 href="#" title=${x.card}>
                <img loading="lazy" src=${AIMG.thumbURL(x.file)} alt=""
                     onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(x.file); }} />
                <span>${x.card}</span>
              </a>`)}
          </div>
        </div>` : null}
    </div>`;
}

/* ── 설정 항목 한 칸 ── */
function ParamCard({ def, value, custom, locked, sel, gender, img, style, exclude,
                     onValue, onCustom, onLock, onZoom }) {
  const isColor = !!S.COLOR_KEYS[def.key];
  const opts = optionsFor(def, gender);
  return html`
    <div class="param-card">
      <div class="lab-lock">
        <label>${def.label} <small>${def.ko}</small></label>
        <button type="button" class=${'lockbtn mini' + (locked ? ' on' : '')} onclick=${onLock}
                aria-pressed=${String(!!locked)}
                title=${locked ? '이 칸은 랜덤에서 뺀다 — 눌러서 풀기' : '이 칸을 랜덤에서 뺀다'}>
          <${LockIcon} open=${!locked} />
        </button>
      </div>
      ${isColor
        ? html`
          <div class="sw-grid">
            ${opts.map(([v, t]) => {
              const ko = (t || '').split(' — ')[1] || t;
              if (!v) return html`<button type="button" key=${v} class=${'sw sw-auto' + (value === '' ? ' on' : '')}
                     onclick=${() => onValue('')} title=${t}><i></i><u>${ko}</u></button>`;
              if (v === '__custom__') return html`<button type="button" key=${v}
                     class=${'sw sw-cus' + (value === '__custom__' ? ' on' : '')}
                     onclick=${() => onValue('__custom__')} title="직접 입력"><i>✎</i><u>직접</u></button>`;
              return html`<button type="button" key=${v} class=${'sw' + (value === v ? ' on' : '')}
                     onclick=${() => onValue(v)} title=${t}>
                       <i style=${{ background: S.COLOR_HEX[v] || 'transparent' }}></i><u>${ko}</u>
                     </button>`;
            })}
          </div>`
        : html`
          <select aria-label=${def.ko || def.label} value=${value} onchange=${e => onValue(e.target.value)}>
            ${opts.map(([v, t]) => html`<option key=${v} value=${v}>${t}</option>`)}
          </select>`}
      ${value === '__custom__' && html`
        <input class="custom-input" type="text" placeholder=${def.ph || '직접 입력'}
               value=${custom} oninput=${e => onCustom(e.target.value)} />`}
      <${Preview} def=${def} value=${value} sel=${sel} gender=${gender} img=${img}
                  style=${style} exclude=${exclude} onZoom=${onZoom} />
    </div>`;
}

/* ── 확대 ── */
function Zoom({ list, start, onClose }) {
  const [i, setI] = useState(start);
  const step = d2 => setI(p => ((p + d2) % list.length + list.length) % list.length);
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, [list.length]);
  const t = useRef({ x: 0, swiped: false });
  return html`
    <div class="zoom"
         ontouchstart=${e => { t.current = { x: e.touches[0].clientX, swiped: false }; }}
         ontouchend=${e => {
           const dx = e.changedTouches[0].clientX - t.current.x;
           if (list.length > 1 && Math.abs(dx) > 28) { step(dx < 0 ? 1 : -1); t.current.swiped = true; }
         }}
         onclick=${() => { if (t.current.swiped) { t.current.swiped = false; return; } onClose(); }}>
      <img src=${AIMG.imgURL(list[i])} alt="" />
      ${list.length > 1 && html`<div class="zpg">${i + 1}/${list.length}</div>`}
    </div>`;
}

/* ── 화면 ── */
/* 탭마다 몸통을 컴포넌트로 갈아 끼운다. 조건부 템플릿(${tab === 'x' && html`…`})으로
   큰 덩어리를 넣으면 preact 가 갈아끼울 때 insertBefore 로 터진다 — 실제로 그랬다.
   의인화 본문이 그 덩어리였으므로 여기로 뺀다. 상태도 함께 옮겨서, App 은
   기체·성별·화풍처럼 탭끼리 나눠 쓰는 것만 들고 있는다. */
function AnthroPanel({ data, series, setSeries, mech, setMech, gender, setGender,
                       style, setStyle, box, seriesList, mechList, card,
                       prevRef, prevFrom, setPrevFrom, onZoom }) {
  const [morph, setMorph] = useState('standard_humanoid');
  const [sel, setSel] = useState({});
  const [cus, setCus] = useState({});
  const [special, setSpecial] = useState('');
  const [underboob, setUnderboob] = useState(false);
  const [locks, setLocks] = useState({});
  /* 자물쇠는 보관함에 있다. 탭을 오가며 이 칸이 떴다 사라져도 되살아나야 한다 */
  useEffect(() => { const l = box.current.data.locks; if (l) setLocks({ ...l }); }, []);
  const [rndGroups, setRndGroups] = useState(
    () => Object.fromEntries(S.GROUP_META.map(([g]) => [g, g === 'face'])));
  const [onlyEmpty, setOnlyEmpty] = useState(false);
  const [status, setStatus] = useState('준비됨');
  const [showText, setShowText] = useState(false);
  const [exportText, setExportText] = useState('');
  const openRef = useRef(null);



  /* 저장한 값은 보관함에서 직접 본다 (모듈이 캐시된 옛 판이어도 맞게 돌도록) */
  const recordFor = name => {
    const mine = (box.current.data.anthro || {})[name] || null;
    const theirs = ATK.recordOf(name);
    if (!mine) return theirs;
    if (!theirs) return mine;
    return (mine.t || 0) >= (theirs.t || 0) ? mine : theirs;
  };

  const partNow = () => ({ sel: { ...sel }, cus: { ...cus }, ub: underboob, sp: special.trim() });

  function applyPart(part) {
    setSel(part && part.sel ? { ...part.sel } : {});
    setCus(part && part.cus ? { ...part.cus } : {});
    setUnderboob(!!(part && part.ub));
    setSpecial((part && part.sp) || '');
  }

  /* 기체를 열면 그 기록을 불러오고, 되돌리기 기준점으로 붙잡아 둔다 */
  useEffect(() => {
    if (!mech) return;
    const rec = recordFor(mech);
    if (!openRef.current || openRef.current.__card !== mech) {
      const snap = rec ? JSON.parse(JSON.stringify(rec)) : {};
      delete snap.prev; snap.__card = mech;
      openRef.current = snap;
    }
    if (rec && rec.mm) setMorph(rec.mm);
    applyPart(rec && rec[gender]);
  }, [mech, gender]);

  /* 성별을 바꾸면 그 성별에 없는 값은 AUTO 로 되돌린다 (원본과 같은 규칙) */
  useEffect(() => {
    setSel(o => {
      let hit = false; const n = {};
      Object.keys(o).forEach(k => {
        if (o[k] && !allowed(k, o[k], gender)) { hit = true; return; }
        n[k] = o[k];
      });
      return hit ? n : o;
    });
  }, [gender]);

  const ready = useRef(false);
  useEffect(() => { ready.current = false; }, [mech]);
  useEffect(() => {
    if (!mech || !data) return;
    if (!ready.current) { ready.current = true; return; }
    const rec = ATK.mergeRecord(mech, gender, partNow(), { morph });
    const st = box.current.data;
    if (!st.anthro) st.anthro = {};
    if (rec) st.anthro[mech] = rec; else delete st.anthro[mech];
    st.last = { series, mech };
    box.current.save();
  }, [mech, gender, sel, cus, underboob, special, morph, data]);


  const prompt = useMemo(() => {
    if (!card) return '';
    const raw = [];
    S.PARAM_DEFS.forEach(def => {
      if (!fitsGender(def, gender)) return;
      let v = sel[def.key] || '';
      if (v === '__custom__') v = (cus[def.key] || '').trim();
      if (v) raw.push([def.key, v]);
    });
    const params = AP.paramValues(raw, { special: special.trim(), underboob, gender });
    const serName = (card.series || []).map(k => (data.series.name || {})[k] || k).join(' · ');
    return AP.buildAnthro({ mech: card.name, series: serName, gender, style, morph,
      translation: translationOf(sel), params });
  }, [card, gender, style, morph, sel, cus, special, underboob, data]);


  const setOne = (k, v) => setSel(o => ({ ...o, [k]: v }));
  const setCustom = (k, v) => setCus(o => ({ ...o, [k]: v }));
  const toggleLock = k => setLocks(o => {
    const n = { ...o };
    if (n['p:' + k]) delete n['p:' + k]; else n['p:' + k] = 1;
    box.current.data.locks = n; box.current.save();
    return n;
  });
  const lockCount = Object.keys(locks).length;

  const filledOf = g => S.PARAM_DEFS.filter(d => d.group === g && fitsGender(d, gender))
    .filter(d => sel[d.key] && (sel[d.key] !== '__custom__' || (cus[d.key] || '').trim())).length;
  const filled = S.GROUP_META.reduce((n, [g]) => n + filledOf(g), 0);

  function rollAnthro() {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    let set = 0, skipLock = 0, skipFull = 0, on = 0;
    const next = { ...sel };
    S.GROUP_META.forEach(([g]) => { if (rndGroups[g]) on++; });
    if (!on) { setStatus('굴릴 갈래를 하나도 안 골랐다 — 얼굴·체형 같은 것을 켜야 굴러간다'); return; }
    S.PARAM_DEFS.forEach(def => {
      if (!rndGroups[def.group] || !fitsGender(def, gender)) return;
      if (locks['p:' + def.key]) { skipLock++; return; }
      if (onlyEmpty && next[def.key]) { skipFull++; return; }
      const cand = optionsFor(def, gender).map(o => o[0]).filter(v => v && v !== '__custom__');
      if (!cand.length) return;
      next[def.key] = pick(cand); set++;
    });
    if (!set) {
      setStatus(skipFull ? '한 칸도 안 바뀌었다 — "빈 칸(AUTO)만 채우기" 가 켜져 있어 이미 값이 있는 '
          + skipFull + '칸을 건너뛰었다'
        : skipLock ? '한 칸도 안 바뀌었다 — 고른 갈래가 전부 자물쇠(' + skipLock + '칸)로 잠겨 있다'
        : '한 칸도 안 바뀌었다 — 고른 갈래에 굴릴 칸이 없다');
      return;
    }
    setSel(next);
    setStatus(set + '칸을 새로 굴렸다' + (skipLock ? ' · 자물쇠 ' + skipLock + '칸은 건너뜀' : ''));
  }

  function copyToOther() {
    const other = gender === 'female' ? 'male' : 'female';
    const nm = gender === 'female' ? '여성' : '남성', onm = other === 'female' ? '여성' : '남성';
    if (!confirm(onm + ' 쪽 설정을 지금 보고 있는 ' + nm + ' 설정으로 덮어쓴다. '
      + onm + ' 쪽에 만들어 둔 설정이 있다면 사라진다. 계속할까?')) return;
    const part = { sel: { ...sel }, cus: { ...cus },
      ub: other === 'female' ? underboob : false, sp: special.trim() };
    const rec = ATK.mergeRecord(mech, other, part, { morph });
    const st = box.current.data;
    if (!st.anthro) st.anthro = {};
    if (rec) {
      const now = recordFor(mech);
      if (now && now[gender] && !rec[gender]) rec[gender] = now[gender];
      st.anthro[mech] = rec;
    } else delete st.anthro[mech];
    box.current.flush();
    setStatus(nm + ' 설정을 ' + onm + ' 쪽에 복사했다 — 그 탭으로 넘어가면 적용된다');
  }

  function takePrev() {
    if (!prevRef.current) return;
    applyPart(prevRef.current.part);
    setStatus('직전 기체 "' + prevRef.current.name + '" 의 설정을 가져왔다');
  }
  function undo() {
    const back = openRef.current;
    if (!back) return;
    const now = { [gender]: partNow(), __card: mech };
    applyPart(back[gender] || null);
    openRef.current = now;
    setStatus('직전 값으로 되돌렸다. 한 번 더 누르면 원래대로 돌아온다.');
  }
  function resetAnthro() {
    applyPart(null);
    setStatus((gender === 'female' ? '여성' : '남성') + ' 설정만 AUTO로 초기화했다');
  }
  function dropLocal() {
    const st = box.current.data;
    if (st.anthro && st.anthro[mech]) delete st.anthro[mech];
    box.current.flush();
    applyPart((ATK.recordOf(mech) || {})[gender]);
    setStatus('이 브라우저에서 고친 것을 버리고 저장소 기록으로 되돌렸다');
  }
  function exportOne() {
    const rec = recordFor(mech) || {};
    const clean = { ...rec }; delete clean.prev; delete clean.__card;
    const out = { version: 1, card: mech, updated: new Date().toISOString(),
      record: clean, used: ATK.usedOf(mech), selectedStyle: style };
    const text = JSON.stringify(out, null, 2);
    setExportText(text);
    copyText(text).then(() => setStatus(mech + ' 한 기체의 settings.json 기록을 내보냈다 — 복사도 했다'),
      () => setStatus('복사는 실패했다. 아래 칸에서 직접 가져가라'));
  }

  const localCount = Object.keys(box.current.data.anthro || {}).length;
  const hasLocal = !!(box.current.data.anthro || {})[mech];
  const hasRec = !!recordFor(mech);

  function pickMech(name) {
    if (mech && mech !== name) { prevRef.current = { name: mech, part: partNow() }; setPrevFrom(mech); }
    setMech(name);
  }

  return html`
    <section class="panel">
      <div class="panel-head">
        <strong>의인화 프롬프트</strong>
        <span>기체 선택 → 외형 편집 → 프롬프트 복사</span>
      </div>

      <div class="form-section">
        <aside class="studio-setup" aria-label="기체 기본 설정">
        <div class="section-caption"><b>01</b> 기체 & 콘셉트</div>
        <div class="studio-selection"><div><small>SELECTED UNIT</small><strong>${mech || '기체를 선택하세요'}</strong></div>
          <span class="selection-count">${filled} 지정</span></div>
        <div class="setup-identity">
        <div class="field" style="margin-bottom:9px">
          <label>기체 <small>시리즈로 좁혀 고른다</small></label>
          <select aria-label="시리즈" value=${series} onchange=${e => { setSeries(e.target.value); }}>
            <option value="">시리즈 전체</option>
            ${seriesList.map(k => html`<option key=${k} value=${k}>${(data.series.name || {})[k] || k}</option>`)}
          </select>
          <select aria-label="기체" style="margin-top:6px" value=${mech} onchange=${e => pickMech(e.target.value)}>
            <option value="">기체를 고르세요 (${mechList.length})</option>
            ${mechList.map(c => html`<option key=${c.name} value=${c.name}>${c.name}</option>`)}
          </select>
          <select aria-label="화풍" style="margin-top:6px" value=${style} onchange=${e => setStyle(e.target.value)}>
            ${S.ART_STYLES.map(r => html`<option key=${r[0]} value=${r[0]}>화풍 · ${r[1]}</option>`)}
          </select>
        </div>

        </div>
        <div class="setup-options">
        <div class="gender-tabs">
          ${[['female', '여성 / Female'], ['male', '남성 / Male']].map(([g, t]) => html`
            <button type="button" key=${g} class=${'gt' + (gender === g ? ' on' : '')}
                    onclick=${() => setGender(g)}>${t}</button>`)}
        </div>
        <div class="param-note" style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span>탭마다 설정을 따로 기억한다. 여성 쪽에서 잡은 값이 남성 쪽으로 자동으로 넘어가지 않는다.</span>
          <button type="button" class="card-rnd sub" style="flex:none" onclick=${copyToOther}>
            지금 보는 설정 → 반대 성별에 복사</button>
        </div>

        <div class="field" style="margin-top:10px">
          <label>Morphology Mode <small>형태 번역 전략 · 인간형과 거리가 있는 기체에 사용</small></label>
          <select aria-label="형태 번역 전략" value=${morph} onchange=${e => setMorph(e.target.value)}>
            ${MORPHS.map(([k, t]) => html`<option key=${k} value=${k}>${t}</option>`)}
          </select>
          <div class="param-note" style="margin-top:4px">정답은 하나가 아니다 — 결과가 미묘하면 다른 모드로 다시 생성해본다.</div>
        </div>

        </div>
        </aside>
        <div class="studio-editor">
        <div class="section-caption"><b>02</b> 외형 디테일</div>
        <div class="param-note" style="margin:10px 0 0">
          ${filled ? '전체 ' + filled + '개 지정됨 — 비워둔 항목은 기체 원본에서 자동으로 채워진다'
                   : '전부 AUTO — 기체 원본에서 모두 자동으로 결정된다'}
        </div>
        <button type="button" class="rnd-top" onclick=${rollAnthro}>🎲 외형 랜덤</button>
        <div class="status" style="margin-top:4px">${status}</div>

        <div style="margin-top:8px">
          ${S.GROUP_META.map(([g, ko, desc, open]) => {
            const rows = S.PARAM_DEFS.filter(d => d.group === g && fitsGender(d, gender));
            if (!rows.length) return null;
            const n = filledOf(g);
            const tops = rows.filter(d => !d.sub);
            const subs = rows.filter(d => d.sub);
            const cardOf = def => html`
              <${ParamCard} key=${def.key} def=${def} value=${sel[def.key] || ''}
                            custom=${cus[def.key] || ''} locked=${!!locks['p:' + def.key]}
                            sel=${sel} gender=${gender} img=${data.img} style=${style} exclude=${mech}
                            onValue=${v => setOne(def.key, v)} onCustom=${v => setCustom(def.key, v)}
                            onLock=${() => toggleLock(def.key)}
                            onZoom=${(list, i) => onZoom({ list, i })} />`;
            /* 하위 항목은 어느 상위 값 안에서 조정되는지 머리에 적는다 (원본과 같다) */
            const subGroups = {};
            subs.forEach(d => { (subGroups[d.sub] = subGroups[d.sub] || []).push(d); });
            return html`
              <details class="grp" key=${g} open=${!!open}>
                <summary>
                  <span>${ko}<em class=${n ? 'on' : ''}>${n ? '  ' + n + ' 지정' : ''}</em></span>
                  <i>${desc}</i>
                </summary>
                <div class="grp-in">
                  ${tops.map(cardOf)}
                  ${Object.keys(subGroups).map(parent => {
                    const pd = S.PARAM_DEFS.find(d => d.key === parent);
                    const pv = sel[parent];
                    const txt = pv && pv !== '__custom__'
                      ? (pd.options.find(o => o[0] === pv) || ['', pv])[1].split(' — ')[0] : '';
                    return html`
                      <div class=${'sub-wrap' + (txt ? ' on' : '')} key=${parent}>
                        <div class="sub-head">
                          ${txt ? html`위 <b>${pd.label} · ${txt}</b> 안에서 조정`
                                : html`위 <b>${pd ? pd.label : parent}</b> 가 AUTO — 아래 값이 단독으로 적용된다`}
                        </div>
                        ${subGroups[parent].map(cardOf)}
                      </div>`;
                  })}
                </div>
              </details>`;
          })}
        </div>

        ${gender === 'female' && html`
          <div class="field" style="margin-top:10px">
            <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer">
              <input type="checkbox" checked=${underboob} style="width:auto;margin:0;flex:none"
                     onchange=${e => setUnderboob(e.target.checked)} />
              <span>Underboob Armor <small>흉갑 하단 노출</small></span>
            </label>
          </div>`}

        <div class="field" style="margin-top:10px">
          <label>Special Characteristics <small>특수 외형 / 추가 지시</small></label>
          <input type="text" placeholder="예: pale mint highlights, narrow waist armor"
                 value=${special} oninput=${e => setSpecial(e.target.value)} />
        </div>

        <div class="param-note">
          AUTO 항목은 최종 PARAMETERS에서 생략돼. 직접 입력을 고르면 원하는 값을 자유롭게 넣을 수 있어.
        </div>

        <div class="save-bar">
          <span class="sb-txt">
            ${!box.current.ok ? '이 브라우저에서는 저장이 막혀 있다'
              : (hasRec ? '"' + mech + '" 설정 있음' + (hasLocal ? ' (이 브라우저)' : ' (저장소 기록)')
                        : '"' + mech + '" 는 아직 설정이 없다')
                + ' · 이 브라우저 기록 ' + localCount + '기'}
          </span>
          <span style="display:flex;gap:6px;flex:none">
            <button type="button" class="sb-drop" onclick=${undo}>직전 값으로</button>
            ${hasLocal ? html`<button type="button" class="sb-drop" onclick=${dropLocal}>이 브라우저 수정 되돌리기</button>` : null}
          </span>
        </div>
        <div class="save-bar">
          <span class="sb-txt">저장소에 커밋할 기록을 내보낸다. 기체 폴더의 <code>settings.json</code>에 저장하면 다른 기기에서도 보인다.</span>
          <button type="button" class="sb-drop" onclick=${exportOne}>기록 내보내기</button>
        </div>
        ${exportText && html`<textarea readonly style="margin-top:8px;min-height:120px;font-size:11px" value=${exportText}></textarea>`}

        <div class="rnd-tgt" style="margin-bottom:9px">
          <span>🎲 랜덤으로 정할 것 — 자물쇠 걸린 칸은 건너뛴다</span>
          ${S.GROUP_META.map(([g, ko]) => html`
            <label key=${g}><input type="checkbox" checked=${!!rndGroups[g]}
                    onchange=${e => setRndGroups(o => ({ ...o, [g]: e.target.checked }))} /><span>${ko}</span></label>`)}
          <label style="width:100%;margin-top:2px">
            <input type="checkbox" checked=${onlyEmpty} onchange=${e => setOnlyEmpty(e.target.checked)} />
            <span>빈 칸(AUTO)만 채우기 — 켜면 이미 값이 있는 칸은 건너뛴다</span>
          </label>
          ${lockCount ? html`<span class="lock-note">자물쇠 ${lockCount}칸 — 랜덤이 건너뛴다</span>` : null}
          ${lockCount ? html`<button type="button" class="lock-clear"
            onclick=${() => { setLocks({}); box.current.data.locks = {}; box.current.save(); }}>자물쇠 모두 풀기</button>` : null}
        </div>

        <div class="param-actions">
          <button type="button" onclick=${rollAnthro}>🎲 외형 랜덤</button>
          <button type="button" onclick=${resetAnthro}>외형 리셋</button>
          ${prevRef.current && prevRef.current.name !== mech
            ? html`<button type="button" onclick=${takePrev}>직전 기체 설정 가져오기 (${prevFrom})</button>` : null}
        </div>
      </div>
      </div>

      <div class="controls">
        <button class="primary" type="button" disabled=${!prompt}
                onclick=${() => copyText(prompt).then(() => setStatus('클립보드에 복사했다'),
                                                      () => setStatus('복사에 실패했다'))}>클립보드 복사</button>
        <button type="button" aria-expanded=${String(showText)} onclick=${() => setShowText(v => !v)}>${showText ? '텍스트 닫기' : '텍스트 보기'}</button>
      </div>
      <div class="status" role="status">${status}</div>
      ${showText && html`
        <div class="prompt-view">
          <textarea aria-label="생성 프롬프트" readonly spellcheck="false" value=${prompt}></textarea>
        </div>`}
    </section>
`;
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [series, setSeries] = useState('');
  const [mech, setMech] = useState('');
  const [gender, setGender] = useState('female');
  const [style, setStyle] = useState(S.DEFAULT_STYLE);
  const [zoom, setZoom] = useState(null);
  const [toast, showToast] = useToast();
  const [stamp, setStamp] = useState('');
  const [prevFrom, setPrevFrom] = useState('');
  const prevRef = useRef(null);
  const box = useRef(null);
  if (!box.current) {
    box.current = ATK.open(ATK.STORE_KEY,
      { last: {}, anthro: {}, collage: null, used: {}, style: {}, locks: {} });
  }

  useEffect(() => {
    Promise.all([getJSON('data/mech.json'), getJSON('data/series.json'), ATK.load(), AIMG.load()])
      .then(([m, s, , img]) => setData({ cards: m.cards, series: s, img }))
      .catch(setErr);
    setStamp(window.AtelierFresh.watch().stamp());
    const st = box.current.data;
    if (st.last && st.last.mech) { setSeries(st.last.series || ''); setMech(st.last.mech); }
  }, []);

  const seriesList = useMemo(() => {
    if (!data) return [];
    const keys = new Set();
    data.cards.forEach(c => (c.series || []).forEach(k => keys.add(k)));
    return [...keys];
  }, [data]);
  const mechList = useMemo(() => !data ? []
    : data.cards.filter(c => !series || (c.series || []).indexOf(series) >= 0), [data, series]);
  const card = useMemo(() => data ? data.cards.find(c => c.name === mech) : null, [data, mech]);

  if (err) return html`<p class="status warn">자료를 못 읽었다 — ${String(err.message || err)}</p>`;
  if (!data) return html`<p class="status">읽는 중…</p>`;

  return html`
    <nav class="workspace-nav" aria-label="Atelier 화면 이동">
      <a href="prompt.html">툴킷</a>
      <a href="play.html">드래프트</a>
      <a href="dex.html">도감</a>
      <a href="prompt-next.html" aria-current="page">툴킷(시범)</a>
    </nav>

    <${AppearanceControls} />
    <${WorkspaceHeading} title="캐릭터 스튜디오" code="PROMPT TOOLKIT"
      subtitle="기체의 개성을 고르고, 나만의 캐릭터로." />
    <${AnthroPanel} data=${data} series=${series} setSeries=${setSeries}
      mech=${mech} setMech=${setMech} gender=${gender} setGender=${setGender}
      style=${style} setStyle=${setStyle} box=${box}
      seriesList=${seriesList} mechList=${mechList} card=${card}
      prevRef=${prevRef} prevFrom=${prevFrom} setPrevFrom=${setPrevFrom}
      onZoom=${z => setZoom(z)} />
    <span class="build-stamp">${stamp}</span>

    ${zoom && html`<${Zoom} list=${zoom.list} start=${zoom.i} onClose=${() => setZoom(null)} />`}
    ${toast}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
