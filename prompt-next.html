  지금은 의인화 탭 하나만 옮겼다 — 단일 컷·콜라주·작업 기록은 아직 prompt.html 몫이다.

  글을 만드는 일은 화면 밖에 있다. lib/prompt-anthro.js 가 값만 받아
  prompt.html 과 똑같은 글을 뽑는다. 이 파일은 값을 모아 넘기고 결과를 보여 줄 뿐이다.
  자료 표는 lib/toolkit-spec.js, 저장한 설정 읽기는 lib/toolkit.js.

  아직 저장하지 않는다. prompt.html 이 쓰는 기록을 읽어 와 처음 값으로 쓰되,
  여기서 바꾼 것은 이 화면에만 남는다 — 두 화면이 같은 자리에 쓰다 엉키는 일을 막는다.
-->

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);
const S = window.AtelierSpec;
const AP = window.AtelierPrompt;
const ATK = window.AtelierToolkit;
const AIMG = window.AtelierImg;
const FIG = window.AtelierFigures;

const GROUPS = [
  ['base',  '기본',      '기체 해석의 큰 방향을 정한다'],
  ['build', '체형',      'Body Type 이 전체 실루엣을 정하고, 아래 항목이 그 안에서 조정한다'],
  ['face',  '얼굴',      'Facial Character 가 전체 인상을 정하고, 아래 항목이 세부를 잡는다'],
  ['hair',  '머리',      'Hairstyle 이 형태를 정하고, 길이와 앞머리가 그 안에서 조정한다'],
  ['armor', '장갑 · 의장', '원기체 구조를 어디까지 인간 형태로 옮길지'],
  ['shot',  '연출',      '포즈 · 시점 · 장비 강조처럼 그림의 찍는 방식'],
];
const MORPHS = [
  ['standard_humanoid', '표준 인간형'],
  ['silhouette_equipment_emphasis', '실루엣 · 장비 강조'],
  ['aggressive_restructure', '적극 재구성'],
];

function getJSON(p) {
  return fetch(p, { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(p + ' — ' + r.status);
    return r.json();
  });
}

/* human-mechanical balance 값이 번역 프로필을 정한다 (prompt.html 과 같은 규칙) */
function translationOf(sel) {
  const v = sel['human-mechanical balance'] || '';
  if (v === 'more human') return 'more_human';
  if (v === 'more mechanical' || v === 'very mechanical') return 'more_mechanical';
  return 'balanced';
}

function useToast() {
  const [msg, setMsg] = useState('');
  const t = useRef(0);
  return [msg ? html`<div class="toast">${msg}</div>` : null,
    text => { setMsg(text); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 1500); }];
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fail(e); }
    ta.remove();
  });
}

/* 자물쇠 그림 — 이모지(🔓/🔒)는 폰에서 둘 다 비슷하게 보여 구분이 안 된다.
   잠김은 고리가 몸통 위에 얹히고, 풀림은 고리가 옆으로 젖혀져 한눈에 갈린다 */
function LockIcon({ open }) {
  return html`
    <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"
            fill-opacity=${open ? '.15' : '.3'} />
      ${open
        ? html`<path d="M8 9V6.5a3.5 3.5 0 0 1 6.6-1.6" />`
        : html`<path d="M7 9V6.5a3 3 0 0 1 6 0V9" />`}
    </svg>`;
}

/* ── 예시 ──
   고른 값이 실제로 어떤 모습인지 보여 준다. 두 가지를 쓴다.
     도식  체형·머리처럼 윤곽으로 갈리는 항목 (lib/figures.js)
     초상  그 값으로 실제 뽑아둔 기체의 그림. 인상·색처럼 선으로 못 그리는 것에 정확하다
   사진을 끌어오거나 삽화를 250장 그려 두는 길은 접었다 — 값에 맞는 사진을
   자동으로 고를 방법이 없고, 삽화는 유지가 버겁다.

   항목마다 펼쳐 두면 42개가 세로로 길어져 접어 둔다. */
function Examples({ def, value, gender, img, style, exclude, onZoom, onPick }) {
  const v = gender === 'female' ? 'f' : 'm';
  /* 도식이 있는 항목(체형·머리)은 값을 안 골랐어도 후보를 늘어놓는다.
     원래 이 도식은 손으로 그리지 않아 옵션끼리 폭 차이가 그대로 보이는 게 값어치라,
     나란히 놓고 고르는 편이 하나만 보는 것보다 쓸모 있다 */
  const figs = useMemo(() => {
    if (def.key !== 'body type' && def.key !== 'hairstyle') return [];
    return def.options
      .filter(([k]) => k && k !== '__custom__')
      .map(([k, t]) => ({ k, t: t.split(' — ')[0], svg: FIG.forKey(def.key, k, gender) }))
      .filter(x => x.svg);
  }, [def.key, gender]);

  /* 지금 편집 중인 기체는 뺀다 — 고르는 즉시 제 그림이 예시로 뜨는데,
     그 그림은 지금 값으로 뽑은 게 아니다 (툴킷과 같은 규칙) */
  const hits = useMemo(() => {
    if (!value) return [];
    const out = [];
    ATK.listCards().forEach(name => {
      if (name === exclude) return;
      const rec = ATK.recordOf(name), g = rec && rec[gender];
      if (!g || !g.sel || g.sel[def.key] !== value) return;
      const file = AIMG.portraitOf(img[name], v, style);
      if (file) out.push({ card: name, file });
    });
    return out.slice(0, 8);
  }, [def.key, value, gender, style, exclude, img]);

  if (!figs.length && !hits.length) {
    return html`<p class="note ex">${value
      ? '이 값으로 뽑아둔 기체가 아직 없다'
      : '값을 고르면 그 값으로 뽑은 기체가 여기 뜬다'}</p>`;
  }
  return html`
    <div class="ex">
      ${figs.length ? html`
        <div class="figrow">
          ${figs.map(f => html`
            <button type="button" key=${f.k} class=${'figcell' + (f.k === value ? ' on' : '')}
                    onclick=${() => onPick(f.k)} title=${f.t}>
              <span dangerouslySetInnerHTML=${{ __html: f.svg }}></span>
              <b>${f.t}</b>
            </button>`)}
        </div>` : null}
      ${hits.length ? html`
        <div class="exgal">
          ${hits.map(h => html`
            <img key=${h.file} loading="lazy" src=${AIMG.thumbURL(h.file)} alt="" title=${h.card}
                 onclick=${() => onZoom(hits.map(x => x.file), hits.indexOf(h))}
                 onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(h.file); }} />`)}
        </div>
        <p class="note">이 값을 쓴 기체 ${hits.length}기 · 눌러서 크게 보기</p>` : null}
      ${!hits.length && value ? html`<p class="note">이 값으로 뽑아둔 기체는 아직 없다</p>` : null}
    </div>`;
}

/* ── 확대 ── */
function Zoom({ list, start, onClose }) {
  const [i, setI] = useState(start);
  const step = d2 => setI(p => ((p + d2) % list.length + list.length) % list.length);
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, [list.length]);
  const t = useRef({ x: 0, swiped: false });
  return html`
    <div class="zoom"
         ontouchstart=${e => { t.current = { x: e.touches[0].clientX, swiped: false }; }}
         ontouchend=${e => {
           const dx = e.changedTouches[0].clientX - t.current.x;
           if (list.length > 1 && Math.abs(dx) > 28) { step(dx < 0 ? 1 : -1); t.current.swiped = true; }
         }}
         onclick=${() => { if (t.current.swiped) { t.current.swiped = false; return; } onClose(); }}>
      <img src=${AIMG.imgURL(list[i])} alt="" />
      ${list.length > 1 && html`<div class="zpg mono">${i + 1}/${list.length}</div>`}
    </div>`;
}

/* ── 설정 항목 한 줄 ── */
function Param({ def, value, custom, locked, gender, img, style, exclude,
                onValue, onCustom, onLock, onZoom }) {
  const [open, setOpen] = useState(false);
  return html`
    <div class=${'pdef' + (def.sub ? ' sub' : '')}>
      ${/* 자물쇠 단추를 label 안에 두면 안 된다 — button 은 label 의 대상이 될 수 있어
           누를 때 라벨이 한 번 더 클릭을 보낸다. 두 번 토글돼 제자리로 돌아온다 */''}
      <div class="plabel">
        <label>
          <b>${def.ko}</b> · ${def.label}
        </label>
        ${/* 손가락으로 누르는 자리다. 글자만 두면 16px 짜리 과녁이 되어 자꾸 빗나간다 */''}
        <button type="button" class=${'lockbtn' + (locked ? ' on' : '')}
                onclick=${onLock}
                aria-pressed=${String(!!locked)}
                title=${locked ? '이 칸은 랜덤에서 뺀다 — 눌러서 풀기' : '이 칸을 랜덤에서 뺀다'}>
          <${LockIcon} open=${!locked} />${locked ? '잠김' : '잠금'}
        </button>
      </div>
      <select value=${value} onchange=${e => onValue(e.target.value)}>
        ${def.options.map(([v, t]) => html`<option value=${v}>${t}</option>`)}
      </select>
      ${value === '__custom__' && html`
        <input type="text" style="margin-top:5px" placeholder=${def.ph || '직접 입력'}
               value=${custom} oninput=${e => onCustom(e.target.value)} />`}
      <button type="button" class="exbtn" aria-expanded=${String(open)}
              onclick=${() => setOpen(o => !o)}>
        ${open ? '예시 접기' : '예시 보기'}
      </button>
      ${open && html`
        <${Examples} def=${def} value=${value} gender=${gender} img=${img}
                     style=${style} exclude=${exclude}
                     onZoom=${onZoom} onPick=${onValue} />`}
    </div>`;
}

/* ── 화면 ── */
function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [series, setSeries] = useState('');
  const [mech, setMech] = useState('');
  const [gender, setGender] = useState('female');
  const [style, setStyle] = useState(S.DEFAULT_STYLE);
  const [morph, setMorph] = useState('standard_humanoid');
  const [sel, setSel] = useState({});        /* 열쇠 → 고른 값 */
  const [cus, setCus] = useState({});        /* 열쇠 → 직접 입력 */
  const [special, setSpecial] = useState('');
  const [underboob, setUnderboob] = useState(false);
  const [toast, showToast] = useToast();
  const [stamp, setStamp] = useState('');
  /* 자물쇠는 칸 하나를 랜덤에서 빼둔다. 툴킷과 같은 자리(STORE.locks)를 읽고 쓰되
     열쇠 이름도 같은 'p:<항목>' 꼴이라 두 화면이 서로의 자물쇠를 알아본다 */
  const [locks, setLocks] = useState({});
  const [rndGroups, setRndGroups] = useState(
    () => Object.fromEntries(GROUPS.map(([g]) => [g, g !== 'shot'])));
  const [onlyEmpty, setOnlyEmpty] = useState(false);
  const [zoom, setZoom] = useState(null);
  /* 툴킷과 같은 자리에 쓴다. 열쇠 이름·모아 적기·화면 숨길 때 즉시 적기까지
     lib/toolkit.js 가 맡으므로 여기서는 값을 넣고 save() 만 부른다 */
  const box = useRef(null);
  if (!box.current) {
    box.current = ATK.open(ATK.STORE_KEY,
      { last: {}, anthro: {}, collage: null, used: {}, style: {}, locks: {} });
  }

  useEffect(() => {
    Promise.all([getJSON('data/mech.json'), getJSON('data/series.json'), ATK.load(), AIMG.load()])
      .then(([m, s, , img]) => setData({ cards: m.cards, series: s, img }))
      .catch(setErr);
    setStamp(window.AtelierFresh.watch().stamp());
    try {
      const raw = box.current.data;
      if (raw && raw.locks) setLocks({ ...raw.locks });
    } catch (e) {}
  }, []);

  /* prompt.html 이 남긴 설정을 처음 값으로 가져온다 (읽기만 한다) */
  useEffect(() => {
    if (!mech) return;
    const rec = ATK.recordOf(mech);
    const g = rec && rec[gender];
    setSel((g && g.sel) ? { ...g.sel } : {});
    setCus((g && g.cus) ? { ...g.cus } : {});
    setUnderboob(!!(g && g.ub));
    setSpecial((g && g.sp) || '');
  }, [mech, gender]);

  const seriesList = useMemo(() => {
    if (!data) return [];
    const keys = new Set();
    data.cards.forEach(c => (c.series || []).forEach(k => keys.add(k)));
    return [...keys];
  }, [data]);

  const mechList = useMemo(() => {
    if (!data) return [];
    return data.cards.filter(c => !series || (c.series || []).indexOf(series) >= 0);
  }, [data, series]);

  const card = useMemo(() => (data ? data.cards.find(c => c.name === mech) : null), [data, mech]);

  /* 값이 바뀔 때마다 다시 만든다. 만드는 일은 전부 lib/prompt-anthro.js 몫 */
  const prompt = useMemo(() => {
    if (!card) return '';
    const raw = [];
    S.PARAM_DEFS.forEach(def => {
      if (def.sex && def.sex !== (gender === 'female' ? 'female' : 'male')) return;
      let v = sel[def.key] || '';
      if (v === '__custom__') v = (cus[def.key] || '').trim();
      if (v) raw.push([def.key, v]);
    });
    const params = AP.paramValues(raw, { special: special.trim(), underboob, gender });
    const serName = (card.series || []).map(k => (data.series.name || {})[k] || k).join(' · ');
    return AP.buildAnthro({
      mech: card.name, series: serName, gender,
      style, morph, translation: translationOf(sel), params,
    });
  }, [card, gender, style, morph, sel, cus, special, underboob, data]);

  /* 값이 바뀌면 저장한다. 처음 불러오는 중(READY 전)에는 쓰지 않는다 —
     빈 값이 기존 기록을 덮어쓰는 사고를 막는다 */
  const ready = useRef(false);
  useEffect(() => { ready.current = false; }, [mech]);
  useEffect(() => {
    if (!mech || !data) return;
    if (!ready.current) { ready.current = true; return; }
    const part = { sel: { ...sel }, cus: { ...cus }, ub: underboob, sp: special.trim() };
    const rec = ATK.mergeRecord(mech, gender, part, { morph });
    const st = box.current.data;
    if (!st.anthro) st.anthro = {};
    if (rec) st.anthro[mech] = rec; else delete st.anthro[mech];
    st.last = { series: series, mech: mech };
    box.current.save();
  }, [mech, gender, sel, cus, underboob, special, morph, data]);

  if (err) return html`<main><p class="warn">자료를 못 읽었다 — ${String(err.message || err)}</p></main>`;
  if (!data) return html`<main><p class="note" style="padding:40px 0;text-align:center">읽는 중…</p></main>`;

  const setOne = (k, v) => setSel(o => ({ ...o, [k]: v }));
  const toggleLock = k => setLocks(o => {
    const n = { ...o };
    if (n['p:' + k]) delete n['p:' + k]; else n['p:' + k] = 1;
    box.current.data.locks = n;
    box.current.save();
    return n;
  });

  /* 굴릴 갈래만, 잠기지 않은 칸만 바꾼다. 직접 입력 값은 굴리지 않는다
     (툴킷과 같은 규칙 — 자물쇠는 랜덤에만 걸고 사람이 고르는 것은 막지 않는다) */
  function rollAnthro() {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    let set = 0, skipLock = 0, skipFull = 0;
    const next = { ...sel };
    S.PARAM_DEFS.forEach(def => {
      if (!rndGroups[def.group]) return;
      if (def.sex && def.sex !== gender) return;
      if (locks['p:' + def.key]) { skipLock++; return; }
      if (onlyEmpty && next[def.key]) { skipFull++; return; }
      const cand = def.options.map(o => o[0]).filter(v => v && v !== '__custom__');
      if (!cand.length) return;
      next[def.key] = pick(cand);
      set++;
    });
    if (!set) {
      showToast(skipFull ? '빈 칸만 채우기가 켜져 있다' :
                skipLock ? '고른 갈래가 전부 잠겨 있다' : '굴릴 갈래를 고르세요');
      return;
    }
    setSel(next);
    showToast(set + '칸 굴렸다' + (skipLock ? ' · 자물쇠 ' + skipLock : ''));
  }
  const setCustom = (k, v) => setCus(o => ({ ...o, [k]: v }));
  const filled = S.PARAM_DEFS.filter(d => sel[d.key]).length;
  const lockCount = Object.keys(locks).length;

  return html`
    <main>
      <div class="chrome">
        <nav class="workspace-nav" aria-label="Atelier 화면 이동">
          <a href="prompt.html">툴킷</a>
          <a href="play.html">드래프트</a>
          <a href="dex.html">도감</a>
          <a href="prompt-next.html" aria-current="page">툴킷(시범)</a>
        </nav>
        <div class="brand">
          <h1>의인화 프롬프트</h1><span class="mono">${stamp || 'PREACT 시범'}</span>
        </div>
      </div>

      <header>
        <div class="row">
          <select value=${series} onchange=${e => { setSeries(e.target.value); setMech(''); }}>
            <option value="">시리즈 전체</option>
            ${seriesList.map(k => html`
              <option value=${k}>${(data.series.name || {})[k] || k}</option>`)}
          </select>
        </div>
        <div class="row">
          <select value=${mech} onchange=${e => setMech(e.target.value)}>
            <option value="">기체를 고르세요 (${mechList.length})</option>
            ${mechList.map(c => html`<option value=${c.name}>${c.name}</option>`)}
          </select>
        </div>
        <div class="row">
          <div class="sw">
            ${[['female', '여'], ['male', '남']].map(([g, t]) => html`
              <button class=${gender === g ? 'on' : ''} onclick=${() => setGender(g)}>${t}</button>`)}
          </div>
          <select class="grow" value=${style} onchange=${e => setStyle(e.target.value)}
                  style="flex:1 1 auto;width:auto">
            ${S.ART_STYLES.map(r => html`<option value=${r[0]}>${r[1]}</option>`)}
          </select>
        </div>
      </header>

      ${!card
        ? html`<p class="note" style="padding:32px 0;text-align:center">기체를 고르면 설정과 프롬프트가 나온다</p>`
        : html`
          <p class="note" style="margin:8px 0">
            바꾸는 대로 툴킷과 같은 자리에 저장된다. 두 화면을 같이 열어 두면
            나중에 저장한 쪽이 이긴다 — 한쪽에서만 만지는 편이 안전하다.
          </p>

          <p class="sec">랜덤 · 채운 항목 ${filled}${lockCount ? ' · 자물쇠 ' + lockCount : ''}</p>
          <div class="bar">
            <button class="btn go" onclick=${rollAnthro}>🎲 외형 랜덤</button>
            ${lockCount ? html`
              <button class="btn" onclick=${() => setLocks({})}>자물쇠 모두 풀기</button>` : null}
          </div>
          <div class="row">
            ${GROUPS.map(([g, t]) => html`
              <label class=${'chip' + (rndGroups[g] ? ' on' : '')}>
                <input type="checkbox" checked=${!!rndGroups[g]}
                       onchange=${e => setRndGroups(o => ({ ...o, [g]: e.target.checked }))} />
                ${t}
              </label>`)}
            <label class=${'chip' + (onlyEmpty ? ' on' : '')}>
              <input type="checkbox" checked=${onlyEmpty}
                     onchange=${e => setOnlyEmpty(e.target.checked)} />
              빈 칸만
            </label>
          </div>

          <div class="row" style="margin-top:12px">
            <select value=${morph} onchange=${e => setMorph(e.target.value)}>
              ${MORPHS.map(([k, t]) => html`<option value=${k}>형태 · ${t}</option>`)}
            </select>
          </div>

          ${GROUPS.map(([g, title, hint]) => {
            const defs = S.PARAM_DEFS.filter(d => d.group === g)
              .filter(d => !d.sex || d.sex === (gender === 'female' ? 'female' : 'male'));
            if (!defs.length) return null;
            const n = defs.filter(d => sel[d.key]).length;
            return html`
              <details class="grp" open=${g === 'base'}>
                <summary>${title}<b>${n ? n + ' / ' + defs.length : defs.length}</b></summary>
                <div class="body">
                  <p class="note" style="margin:0 0 8px">${hint}</p>
                  ${defs.map(def => html`
                    <${Param} key=${def.key} def=${def}
                              value=${sel[def.key] || ''} custom=${cus[def.key] || ''}
                              locked=${!!locks['p:' + def.key]}
                              gender=${gender} img=${data.img} style=${style} exclude=${mech}
                              onValue=${v => setOne(def.key, v)}
                              onCustom=${v => setCustom(def.key, v)}
                              onLock=${() => toggleLock(def.key)}
                              onZoom=${(list, i) => setZoom({ list, i })} />`)}
                </div>
              </details>`;
          })}

          <p class="sec">그 밖에</p>
          <div class="pdef">
            <label><b>특이사항</b> · Special Characteristics</label>
            <input type="text" placeholder="흉터, 문신, 의안 같은 것"
                   value=${special} oninput=${e => setSpecial(e.target.value)} />
          </div>
          ${gender === 'female' && html`
            <label class="note" style="display:flex;gap:7px;align-items:center;margin-top:6px">
              <input type="checkbox" checked=${underboob}
                     onchange=${e => setUnderboob(e.target.checked)} style="width:auto;min-height:0" />
              언더부스트 장갑 문구 넣기
            </label>`}

          <p class="sec">결과 · ${prompt.length.toLocaleString()}자</p>
          <textarea class="out" readonly value=${prompt}></textarea>
          <div class="bar">
            <button class="btn go" onclick=${() => copyText(prompt).then(
              () => showToast('복사했다 · ' + card.name), () => showToast('복사 실패'))}>프롬프트 복사</button>
          </div>
        `}
    </main>
    ${zoom && html`<${Zoom} list=${zoom.list} start=${zoom.i} onClose=${() => setZoom(null)} />`}
    ${toast}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
