name: 초상 등록

# webp 를 올리면 register-images.py 를 돌려 data/img.json 에 등록하고 되커밋한다.
# img.json 은 *.webp 가 아니므로 그 커밋이 이 워크플로를 다시 부르지는 않는다.
on:
  push:
    branches: [main]
    paths:
      - '**.webp'
      # 썸네일은 이 워크플로가 만들어 되커밋하는 것이라 트리거에서 뺀다
      - '!img/thumb/**'
  workflow_dispatch:
    inputs:
      prune:
        description: '적혀 있는데 파일이 없는 항목도 지운다'
        type: boolean
        default: false

# 연달아 올리면 뒤엣것만 돌린다. 두 실행이 같은 파일을 밀면 푸시가 깨진다
concurrency:
  group: register-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      # 되커밋이 밀렸을 때 아래에서 rebase 를 하므로 온전한 이력이 필요하다.
      # 기본값인 얕은 클론(fetch-depth 1)이면 그 rebase 가 간헐적으로 깨진다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 무엇이 달라지는지 먼저 찍어 둔다. 실패해도 여기서 로그가 남는다
      - name: 대조
        run: python3 register-images.py --check

      - name: Pillow 설치
        run: pip install --quiet Pillow

      - name: 썸네일
        # 목록과 갤러리가 원본 대신 쓰는 축소본. 새로 올라온 것만 만든다
        run: python3 make-thumbs.py

      - name: 등록
        run: |
          if [ "${{ inputs.prune }}" = "true" ]; then
            python3 register-images.py --prune
          else
            python3 register-images.py
          fi

      - name: 되커밋
        run: |
          if git diff --quiet -- data/img.json img/thumb && \
             [ -z "$(git status --porcelain -- img/thumb)" ]; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/img.json img/thumb
          git commit -m "초상 등록: data/img.json 갱신, 썸네일 생성 [skip actions]"
          # 사이에 다른 커밋이 들어왔으면 얹어서 다시 민다
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
