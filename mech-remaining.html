<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기체 잔여 목록 — 건담 드래프트</title>
<style>
:root{
  --paper:#E4E2DB; --ink:#14181E; --dim:#6C6A62; --rule:#BFBCB2;
  --hazard:#D8A200; --slab:#CFCCC3; --done:#8B9A6B;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --disp:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--mono); font-size:13px; line-height:1.5;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
/* ── 상단 슬레이트 ── */
header{
  position:sticky; top:0; z-index:5; background:var(--paper);
  border-bottom:2px solid var(--ink); padding:14px 16px 10px;
}
.eyebrow{
  font-size:10px; letter-spacing:.28em; color:var(--dim);
  text-transform:uppercase;
}
h1{
  font-family:var(--disp); font-weight:700; font-size:26px;
  letter-spacing:-.02em; margin:2px 0 10px;
}
h1 b{
  font-size:44px; font-variant-numeric:tabular-nums;
  border-bottom:6px solid var(--hazard); padding-bottom:1px;
}
.meta{display:flex; gap:14px; font-size:11px; color:var(--dim); flex-wrap:wrap}
.meta span b{color:var(--ink); font-variant-numeric:tabular-nums}
.tools{display:flex; gap:8px; margin-top:10px}
input[type=search]{
  flex:1; min-width:0; font:inherit; padding:7px 10px;
  background:#EFEEE9; border:1px solid var(--rule); border-radius:0; color:inherit;
}
input[type=search]:focus{outline:2px solid var(--hazard); outline-offset:-2px}
/* ── 시리즈 블록 ── */
section{border-bottom:1px solid var(--rule)}
.shd{
  display:flex; align-items:baseline; gap:10px; width:100%;
  padding:11px 16px; background:none; border:0; font:inherit;
  color:inherit; text-align:left; cursor:pointer;
}
.shd:focus-visible{outline:2px solid var(--hazard); outline-offset:-2px}
.sname{font-family:var(--disp); font-weight:700; font-size:15px; flex:1}
.scount{
  font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
/* 잔탄식 게이지 — 남은 칸이 위험색 */
.gauge{display:flex; gap:2px; padding:0 16px 11px}
.gauge i{height:6px; flex:1; background:var(--done)}
.gauge i.left{background:var(--hazard)}
.gauge i.none{background:var(--slab)}
ul{list-style:none; margin:0; padding:0 0 6px}
li{
  display:flex; align-items:flex-start; gap:10px;
  padding:8px 16px; border-top:1px dotted var(--rule);
}
li:first-child{border-top:1px solid var(--rule)}
.tick{
  flex:none; width:16px; height:16px; margin-top:2px;
  border:1.5px solid var(--ink); background:transparent; cursor:pointer; padding:0;
}
.tick[aria-pressed=true]{background:var(--done); border-color:var(--done)}
.tick[aria-pressed=true]::after{
  content:"✓"; display:block; color:var(--paper); font-size:12px;
  line-height:13px; text-align:center;
}
.body{flex:1; min-width:0}
.nm{font-family:var(--disp); font-weight:600; font-size:14px}
li.off .nm{text-decoration:line-through; color:var(--dim)}
.half{
  font-size:9px; letter-spacing:.14em; background:var(--hazard);
  color:var(--ink); padding:1px 5px; margin-left:6px; vertical-align:2px;
}
.copy{
  margin-top:4px; font:inherit; font-size:11px; color:var(--dim);
  background:none; border:0; padding:0; text-align:left; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px;
}
.copy:active{color:var(--ink)}
.copy.ok{color:var(--done); text-decoration:none}
.pr{
  display:none; margin-top:6px; font-size:11px; color:var(--dim);
  border-left:3px solid var(--rule); padding-left:9px; word-break:break-all;
}
li.open .pr{display:block}
.empty{padding:40px 16px; text-align:center; color:var(--dim)}
footer{padding:18px 16px 28px; font-size:10px; color:var(--dim); letter-spacing:.1em}
@media(prefers-reduced-motion:no-preference){
  .copy{transition:color .15s}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">기체 초상 잔여</div>
  <h1><b id="left">0</b> 장 남음</h1>
  <div class="meta">

  <div class="tools">
    <input type="search" id="q" placeholder="기체명 · 시리즈 검색" autocomplete="off">
  </div>
</header>
<main id="list"></main>
<footer>탭하면 프롬프트가 복사된다. 체크는 이 화면에서만 유지된다.</footer>

var TOTAL_MECH = 256;
var checked = {};

function gauge(remain, total){
  var n = Math.min(total, 24), out = "";
  var doneN = Math.round((total-remain)/total*n);
  for(var i=0;i<n;i++) out += '<i class="'+(i<doneN?"":"left")+'"></i>';
  return out;
}

function render(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var list = document.getElementById("list");
  list.innerHTML = "";
  var shown = 0, sers = 0;

  DATA.forEach(function(s){
    var rows = s.rows.filter(function(r){
      return !q || r.name.toLowerCase().indexOf(q)>=0 || s.series.toLowerCase().indexOf(q)>=0;
    });
    if(!rows.length) return;
    sers++;

    var sec = document.createElement("section");
    var remain = s.rows.length;
    sec.innerHTML =
      '<button class="shd"><span class="sname">'+s.series+'</span>'+
      '<span class="scount">'+remain+' / '+s.total+'</span></button>'+
      '<div class="gauge">'+gauge(remain, s.total)+'</div>';

    var ul = document.createElement("ul");
    rows.forEach(function(r){
      shown++;
      var li = document.createElement("li");
      var on = !!checked[r.name];
      if(on) li.className = "off";
      li.innerHTML =
        '<button class="tick" aria-pressed="'+on+'" aria-label="완료 표시"></button>'+
        '<div class="body">'+
          '<div class="nm">'+r.name+(r.half?'<span class="half">한쪽만</span>':'')+'</div>'+
          '<button class="copy">프롬프트 복사</button>'+
          '<div class="pr">'+r.prompt+'</div>'+
        '</div>';

      li.querySelector(".tick").onclick = function(){
        checked[r.name] = !checked[r.name];
        render();
      };
      li.querySelector(".copy").onclick = function(){
        var btn = this;
        var ta = document.createElement("textarea");
        ta.value = r.prompt; ta.style.position="fixed"; ta.style.opacity=0;
        document.body.appendChild(ta); ta.select();
        var ok=false; try{ ok = document.execCommand("copy"); }catch(e){}
        document.body.removeChild(ta);
        li.classList.add("open");
        btn.textContent = ok ? "복사됨" : "아래에서 길게 눌러 복사";
        btn.className = "copy ok";
        setTimeout(function(){ btn.textContent="프롬프트 복사"; btn.className="copy"; }, 1800);
      };
      ul.appendChild(li);
    });
    sec.appendChild(ul);

    sec.querySelector(".shd").onclick = function(){
      ul.style.display = ul.style.display === "none" ? "" : "none";
    };
    list.appendChild(sec);
  });

  if(!shown) list.innerHTML = '<div class="empty">일치하는 기체가 없다.</div>';

  var total = DATA.reduce(function(a,s){return a+s.rows.length},0);
  var off = Object.keys(checked).filter(function(k){return checked[k]}).length;
  document.getElementById("left").textContent = total - off;
  document.getElementById("done").textContent = (TOTAL_MECH - total) + off;
  document.getElementById("sers").textContent = sers;
}

document.getElementById("q").addEventListener("input", render);
render();
</script>
