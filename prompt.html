<!--
  툴킷 세 탭(의인화·단일컷·콜라주)을 Preact + htm 으로 옮긴 판.

  Preact 상태와 필드 컴포넌트를 쓰고, 공통 workspace 스타일로 화면을 구성한다.
  테마·밀도는 외형 생성 설정과 별개이며 도감과 공유한다.

  글을 만드는 일은 화면 밖에 있다 — lib/prompt-anthro.js 와
  lib/prompt-lifestyle.js 가 값만 받아 글을 뽑는다. 자료 표는
  lib/toolkit-spec.js, 저장은 lib/toolkit.js 가 맡는다.
  ?v= 는 캐시 우회용이다. lib 를 고치면 이 값을 올린다.

  예전 판은 prompt-legacy.html 에 남겨 두었다. 되돌릴 일이 생기면 그 파일을
  prompt.html 로 되돌리면 된다.
-->

<body class="prompt-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

import { AppearanceControls, WorkspaceHeading } from './lib/workspace-ui.js?v=ff126cd004';

const html = htm.bind(h);
const S = window.AtelierSpec;
const AP = window.AtelierPrompt;
const ATK = window.AtelierToolkit;
const AIMG = window.AtelierImg;
const AL = window.AtelierLifestyle;
const FIG = window.AtelierFigures;

const MORPHS = [
  ['standard_humanoid', '표준형 — 일반적인 사람형 MS'],
  ['silhouette_equipment_emphasis', '실루엣/장비 강조형 — 어깨·팔다리·바인더 등 외곽 인상이 중요할 때'],
  ['aggressive_restructure', '강변형형 — 일반 의인화로는 원본 느낌이 죽는 난형 기체용'],
];

function getJSON(p) {
  return fetch(p, { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(p + ' — ' + r.status);
    return r.json();
  });
}

/* 성별 전용 값 거르기 — 남성에서 여성 전용 값이 뜨면 안 되고,
   성별을 바꿀 때 그 성별에 없는 값은 AUTO 로 되돌려야 한다 (원본과 같은 규칙) */
function allowed(key, val, gender) {
  const o = S.ONLY[key];
  return !o || !o[val] || o[val] === gender;
}
function optionsFor(def, gender) {
  return def.options.filter(o => allowed(def.key, o[0], gender));
}
function fitsGender(def, gender) { return !def.sex || def.sex === gender; }

function translationOf(sel) {
  const v = sel['human-mechanical balance'] || '';
  if (v === 'more human') return 'more_human';
  if (v === 'more mechanical' || v === 'very mechanical') return 'more_mechanical';
  return 'balanced';
}

function useToast() {
  const [msg, setMsg] = useState('');
  const t = useRef(0);
  return [msg ? html`<div class="toast">${msg}</div>` : null,
    text => { setMsg(text); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 1600); }];
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fail(e); }
    ta.remove();
  });
}

/* ── 자물쇠 ── */
function LockIcon({ open }) {
  return html`
    <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"
            fill-opacity=${open ? '.15' : '.35'} />
      ${open ? html`<path d="M8 9V6.5a3.5 3.5 0 0 1 6.6-1.6" />`
             : html`<path d="M7 9V6.5a3 3 0 0 1 6 0V9" />`}
    </svg>`;
}

/* ── 미리보기 ──
   원본과 같은 세 가지를 보여 준다.
     색   눈·머리색은 큰 색 조각. 두 눈 색이 다르면 좌우를 나눠 보여 준다
     도식 체형·머리는 선으로 그린 실루엣
     초상 그 값으로 실제 뽑아둔 기체 (최대 8기) */
function Preview({ def, value, sel, gender, img, style, exclude, onZoom }) {
  const v = gender === 'female' ? 'f' : 'm';
  const isColor = !!S.COLOR_KEYS[def.key];
  const hex = S.COLOR_HEX[value];

  const hits = useMemo(() => {
    if (!value) return [];
    const out = [];
    ATK.listCards().forEach(name => {
      if (name === exclude) return;
      const rec = ATK.recordOf(name), g = rec && rec[gender];
      if (!g || !g.sel || g.sel[def.key] !== value) return;
      const file = AIMG.portraitOf(img[name], v, style);
      if (file) out.push({ card: name, file });
    });
    return out.slice(0, 8);
  }, [def.key, value, gender, style, exclude, img]);

  const figs = useMemo(() => {
    if (def.key !== 'body type' && def.key !== 'hairstyle') return [];
    return optionsFor(def, gender)
      .filter(([k]) => k && k !== '__custom__')
      .map(([k, t]) => ({ k, t: t.split(' — ')[0], svg: FIG.forKey(def.key, k, gender) }))
      .filter(x => x.svg);
  }, [def.key, gender]);

  if (!value || value === '__custom__') return null;

  /* 두 눈 색 — 서로 다르면 좌우로 나눠 보여 준다 (원본과 같은 안내) */
  let colorHead = null;
  if (isColor && hex) {
    const pairKey = def.key === 'eye color' ? 'second eye color'
                  : def.key === 'second eye color' ? 'eye color' : null;
    const otherHex = pairKey ? S.COLOR_HEX[sel[pairKey]] : null;
    if (pairKey && otherHex) {
      const L = def.key === 'eye color' ? hex : otherHex;
      const R = def.key === 'eye color' ? otherHex : hex;
      colorHead = L === R
        ? html`<span class="sw-big"><i style=${{ background: L }}></i></span>
               <div class="pp-txt"><b>양쪽 동일 색상</b>두 눈이 같은 색이다</div>`
        : html`<span class="sw-big"><i style=${{ background: R }}></i></span>
               <span class="sw-big"><i style=${{ background: L }}></i></span>
               <div class="pp-txt"><b>오드아이</b>오른쪽 · 왼쪽 순서로 지킨다</div>`;
    } else {
      colorHead = html`<span class="sw-big"><i style=${{ background: hex }}></i></span>`;
    }
  }

  if (!colorHead && !figs.length && !hits.length) return null;

  return html`
    <div class="param-preview">
      ${colorHead && html`<div class="pp-main">${colorHead}</div>`}
      ${figs.length ? html`
        <div class="figrow">
          ${figs.map(f => html`
            <div class=${'figcell' + (f.k === value ? ' on' : '')} key=${f.k}
                 dangerouslySetInnerHTML=${{ __html: f.svg + '<b>' + f.t + '</b>' }}></div>`)}
        </div>` : null}
      ${hits.length ? html`
        <div class="pp-gal">
          <div class="pp-gal-t">이 값으로 뽑은 기체 ${hits.length}기 · 눌러서 크게 보기</div>
          <div class="pp-gal-r">
            ${hits.map((x, i) => html`
              <a key=${x.file} onclick=${e => { e.preventDefault(); onZoom(hits.map(y => y.file), i); }}
                 href="#" title=${x.card}>
                <img loading="lazy" src=${AIMG.thumbURL(x.file)} alt=""
                     onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(x.file); }} />
                <span>${x.card}</span>
              </a>`)}
          </div>
        </div>` : null}
    </div>`;
}

/* ── 설정 항목 한 칸 ── */
function ParamCard({ def, value, custom, locked, sel, gender, img, style, exclude,
                     onValue, onCustom, onLock, onZoom }) {
  const isColor = !!S.COLOR_KEYS[def.key];
  const opts = optionsFor(def, gender);
  return html`
    <div class="param-card">
      <div class="lab-lock">
        <label>${def.label} <small>${def.ko}</small></label>
        <button type="button" class=${'lockbtn mini' + (locked ? ' on' : '')} onclick=${onLock}
                aria-pressed=${String(!!locked)}
                title=${locked ? '이 칸은 랜덤에서 뺀다 — 눌러서 풀기' : '이 칸을 랜덤에서 뺀다'}>
          <${LockIcon} open=${!locked} />
        </button>
      </div>
      ${isColor
        ? html`
          <div class="sw-grid">
            ${opts.map(([v, t]) => {
              const ko = (t || '').split(' — ')[1] || t;
              if (!v) return html`<button type="button" key=${v} class=${'sw sw-auto' + (value === '' ? ' on' : '')}
                     onclick=${() => onValue('')} title=${t}><i></i><u>${ko}</u></button>`;
              if (v === '__custom__') return html`<button type="button" key=${v}
                     class=${'sw sw-cus' + (value === '__custom__' ? ' on' : '')}
                     onclick=${() => onValue('__custom__')} title="직접 입력"><i>✎</i><u>직접</u></button>`;
              return html`<button type="button" key=${v} class=${'sw' + (value === v ? ' on' : '')}
                     onclick=${() => onValue(v)} title=${t}>
                       <i style=${{ background: S.COLOR_HEX[v] || 'transparent' }}></i><u>${ko}</u>
                     </button>`;
            })}
          </div>`
        : html`
          <select aria-label=${def.ko || def.label} value=${value} onchange=${e => onValue(e.target.value)}>
            ${opts.map(([v, t]) => html`<option key=${v} value=${v}>${t}</option>`)}
          </select>`}
      ${value === '__custom__' && html`
        <input class="custom-input" type="text" placeholder=${def.ph || '직접 입력'}
               value=${custom} oninput=${e => onCustom(e.target.value)} />`}
      <${Preview} def=${def} value=${value} sel=${sel} gender=${gender} img=${img}
                  style=${style} exclude=${exclude} onZoom=${onZoom} />
    </div>`;
}

/* ── 확대 ── */
function Zoom({ list, start, onClose }) {
  const [i, setI] = useState(start);
  const step = d2 => setI(p => ((p + d2) % list.length + list.length) % list.length);
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, [list.length]);
  const t = useRef({ x: 0, swiped: false });
  return html`
    <div class="zoom"
         ontouchstart=${e => { t.current = { x: e.touches[0].clientX, swiped: false }; }}
         ontouchend=${e => {
           const dx = e.changedTouches[0].clientX - t.current.x;
           if (list.length > 1 && Math.abs(dx) > 28) { step(dx < 0 ? 1 : -1); t.current.swiped = true; }
         }}
         onclick=${() => { if (t.current.swiped) { t.current.swiped = false; return; } onClose(); }}>
      <img src=${AIMG.imgURL(list[i])} alt="" />
      ${list.length > 1 && html`<div class="zpg">${i + 1}/${list.length}</div>`}
    </div>`;
}

        <li>LIFESTYLE REFERENCE LOCK 신설. 수영장 · 홈웨어 같은 일상컷에서 기준 이미지에 없던 갑옷 · 방패 · 메카 파츠가 새로 생기던 문제를 막는다</li>
        <li>기체명(SOURCE MOBILE SUIT)은 이제 직업 · 로어 맥락용 메타데이터로만 쓰이고, 장비 복원 근거로 쓰지 말라고 못 박았다</li>
        <li>세미리얼 페인팅에 MECHANICAL PAINTERLY LOCK 추가. 장갑이 정교해도 CGI/PBR 렌더로 안 튀게 잠근다</li>
        <li>게임 키아트 2.5D를 다시 정의했다. 평면 애니로 처지던 문제를 고쳐 "평면 애니와 풀 3D CGI 사이" 볼륨감 있는 키아트로 좁혔다</li>
        <li>REFERENCE IMAGE AUTHORITY 추가. 업로드 레퍼런스가 실루엣 · 비율 · 장비 배치의 1차 권위를 갖고, 화풍은 렌더링 언어만 정하며 캐논 기억은 레퍼런스에 안 보일 때만 보조로 쓰인다</li>
        <li>로브형 · 망토형 · 드레스형 하체 장갑을 원기체 레퍼런스나 PARAMETERS가 뒷받침할 때만 허용하도록 제한했다</li>
      </ul>
      <b>v8.3 &middot; 화풍 프리셋 재정비</b>
      <ul>
        <li>11개 화풍을 전면 재작성. 화풍마다 얼굴 · 피부 · 머리 · 장갑 · 조명 · 배경 · 금지사항을 따로 정의한다</li>
        <li>STYLE LOCK 추가. 선택한 화풍이 이미지 전체의 렌더링 언어를 지배하고, 다른 지시와 충돌하면 화풍이 이긴다</li>
        <li>의인화 공통 조명을 화풍 중립으로 교체. 어두운 스튜디오 배경 · 림라이트 · PBR 재질 강제가 사라져 셀화 · 레트로 · 수묵이 제 결로 나온다</li>
        <li>얼굴은 회화적인데 메카만 CG로 튀던 문제 수정. PBR은 게임 시네마틱 CGI 화풍에서만 허용한다</li>
        <li>한국형 글로시에서 마른 체형 · 바로크 장식 강제를 제거. 캐릭터 디자인은 PARAMETERS와 원기체를 따른다</li>
        <li>게임 키아트에서 single-character 문구 제거. 콜라주 6패널 구조와 충돌하던 표현이다</li>
        <li>양쪽 눈 색이 같으면 오드아이로 처리하지 않는다. 프롬프트와 미리보기를 모두 고쳤다</li>
      </ul>
      <b>v8.2</b>
      <ul>
        <li>화풍 11종 예시 이미지 완비, 화풍별 참고 갤러리</li>
        <li>기체별 화풍 저장</li>
      </ul>
    </div>
  `;
function VersionBox() {
  const [stamp, setStamp] = useState('');
  useEffect(() => { try { setStamp(window.AtelierFresh.watch().stamp()); } catch (e) {} }, []);
  return html`
    <div class="ver-badge">Gundam Prompt Toolkit <b>v9.19</b> <span>단일컷·콜라주가 오드아이를 흘리던 것</span>
      <span class="bstamp" title="지금 화면에 뜬 판이 서버를 떠난 때">${stamp}</span></div>
    <details class="srcbox verbox">
      <div dangerouslySetInnerHTML=${{ __html: VERSION_NOTES }}></div>
    </details>`;
}

/* 아래에 붙어 다니는 띠. 긴 화면을 스크롤하다 복사하려고 맨 아래까지
   내려갈 필요가 없게 한다. 지금 열려 있는 탭이 제 프롬프트와 단추를 여기 등록한다 */
function PromptDock({ dock }) {
  if (!dock) return null;
  const goTop = () => {
    const scroller = document.querySelector('.prompt-page .wrap');
    if (scroller) scroller.scrollTo({ top: 0, behavior: 'smooth' });
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  return html`
    <div class="prompt-dock" role="region" aria-label="프롬프트 빠른 작업">
      <div class="prompt-dock-inner">
        <div class="prompt-dock-status" role="status" aria-live="polite">${dock.status || '현재 설정으로 복사할 수 있습니다.'}</div>
        <div class="prompt-dock-actions">
          <button type="button" onclick=${goTop}>설정 ↑</button>
          <button type="button" onclick=${dock.preview}>미리보기</button>
          <button type="button" class="primary" disabled=${!dock.text} onclick=${dock.copy}>복사</button>
        </div>
      </div>
    </div>`;
}

/* ── 기체 고르개 ────────────────────────────────────────────────────────
   원본은 이것을 탭 위에 한 번만 둔다. 탭마다 두면 화풍 안내 · 뽑아둔 그림 ·
   파일명 안내를 세 번 그려야 하고, 셋이 어긋날 자리도 생긴다. */
const CARD_SHOT_N = 12;

function SourceBox({ data, series, setSeries, mech, setMech, style, setStyle,
                     gender, seriesList, mechList }) {
  const [all, setAll] = useState(false);
  useEffect(() => { setAll(false); }, [mech, style, gender]);

  const serName = k => (data.series.name || {})[k] || k;
  const entry = data.img ? data.img[mech] : null;
  const v = gender === 'male' ? 'm' : 'f';
  const cur = entry ? AIMG.shotsOf(entry.byStyle ? entry.byStyle[style] : entry, v) : [];
  const every = entry ? AIMG.allShotsOf(entry) : [];
  const show = all ? every : cur.slice(0, CARD_SHOT_N);
  const styleRow = S.ART_STYLES.find(r => r[0] === style) || ['', style, ''];
  const samples = S.STYLE_SAMPLE[style] || [];

  /* 초상 완료 = 그 카드에 남녀 초상이 둘 다 있다 (원본 doneOf 와 같다) */
  const done = useMemo(() => {
    if (!data.img) return null;
    let n = 0;
    data.cards.forEach(c => {
      const e = data.img[c.name];
      if (e && AIMG.portraitOf(e, 'f') && AIMG.portraitOf(e, 'm')) n++;
    });
    return n;
  }, [data]);

  const stem = (mech || '카드명').replace(/ /g, '_') + '_' + style;

  return html`
    <details class="srcbox" open=${!mech}>
      <summary>
        <span class="sel-line">${mech ? mech + '  ·  ' + (data.cards.find(c => c.name === mech) || {}).series?.map(serName).join(' · ') : '기체를 선택하세요'}</span>
        <span class="sb-txt">${done === null ? '이미지 현황을 아직 못 읽었다'
          : '초상 완료 ' + done + ' / ' + data.cards.length + '기 · 잔여 ' + (data.cards.length - done)}</span>
      </summary>
      <div class="srcbox-in">
        <div class="top-grid">
          <select aria-label="시리즈" value=${series} onchange=${e => setSeries(e.target.value)}>
            <option value="">시리즈 전체</option>
            ${seriesList.map(k => html`<option key=${k} value=${k}>${serName(k)}</option>`)}
          </select>
          <select aria-label="기체" value=${mech} onchange=${e => setMech(e.target.value)}>
            <option value="">기체를 고르세요 (${mechList.length})</option>
            ${mechList.map(c => {
              const e = data.img ? data.img[c.name] : null;
              const mark = !data.img ? '' : (e && AIMG.portraitOf(e, 'm') && AIMG.portraitOf(e, 'f') ? '✓ '
                : (e && (AIMG.portraitOf(e, 'm') || AIMG.portraitOf(e, 'f')) ? '◐ ' : '· '));
              return html`<option key=${c.name} value=${c.name}>${mark + c.name}</option>`;
            })}
          </select>
        </div>

        <div class="field" style="margin-top:10px">
          <label>Art Style <small>화풍 · 지금 생성할 프롬프트에 적용</small></label>
          <select aria-label="화풍" value=${style} onchange=${e => setStyle(e.target.value)}>
            ${S.ART_STYLES.map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]}</option>`)}
          </select>

          <div class="param-preview" id="artNote">
            <div class="pp-txt"><b>${styleRow[1]}</b>${styleRow[2] || ''}
              <span class="st-cap">${samples.length
                ? '이 화풍으로 뽑은 실제 결과 ' + samples.length + '장 · 눌러서 크게 보기'
                : '아직 샘플이 없다. 뽑아보고 마음에 들면 샘플로 넣어줄 수 있다.'}</span></div>
            ${samples.length ? html`<div class="st-shots">
              ${samples.map(f => html`<a class="st-shot" key=${f} href=${AIMG.imgURL(f)} target="_blank" rel="noopener">
                <img loading="lazy" src=${AIMG.imgURL(f)} alt="" /></a>`)}
            </div>` : null}
          </div>

          ${mech ? html`
            <div class="param-preview" id="cardShots">
              ${!every.length ? html`<div class="pp-txt"><b>이 카드로 뽑아둔 그림</b>아직 등록된 그림이 없다.</div>`
              : html`
                <div class="pp-txt">${all
                  ? html`<b>${mech} · 전체</b>${'모든 화풍 · 남녀 ' + every.length + '장'}`
                  : html`<b>${mech}</b>${styleRow[1] + ' · ' + (gender === 'male' ? '남성' : '여성') + ' ' + cur.length + '장'
                      + (cur.length > show.length ? ' 중 ' + show.length + '장' : '') + ' · 눌러서 크게 보기'}`}</div>
                <div class="cs-grid">
                  ${show.map(f => html`<a key=${f} href=${AIMG.imgURL(f)} target="_blank" rel="noopener" title=${f}>
                    <img loading="lazy" src=${AIMG.thumbURL(f)} alt="" /></a>`)}
                </div>
                ${(all || every.length > show.length) ? html`
                  <button type="button" class="cs-more" onclick=${() => setAll(x => !x)}>
                    ${all ? '접기' : '전체 ' + every.length + '장'}</button>` : null}`}
            </div>` : null}

          <div class="quick-note">신규 파일명: ${stem}_f.webp / ${stem}_f_casual1.webp / ${stem}_f_extra1.webp ·
            남성은 f→m, 추가 컷은 번호 증가. 기존 파일명과 겹치지 않게 저장.</div>
        </div>
        <div class="quick-note">기본은 AUTO로 두고, 마음에 안 드는 요소만 고르면 된다. 표정·앞뒷태는 패널마다 따로 잡을 수 있다.</div>
      </div>
    </details>`;
}


/* 탭마다 몸통을 컴포넌트로 갈아 끼운다. 조건부 템플릿(${tab === 'x' && html`…`})으로
   큰 덩어리를 넣으면 preact 가 갈아끼울 때 insertBefore 로 터진다 — 실제로 그랬다.
   의인화 본문이 그 덩어리였으므로 여기로 뺀다. 상태도 함께 옮겨서, App 은
   기체·성별·화풍처럼 탭끼리 나눠 쓰는 것만 들고 있는다. */
function AnthroPanel({ data, series, setSeries, mech, setMech, gender, setGender,
                       style, setStyle, box, seriesList, mechList, card,
                       prevRef, prevFrom, setPrevFrom, onZoom, onDock }) {
  const [morph, setMorph] = useState('standard_humanoid');
  const [sel, setSel] = useState({});
  const [cus, setCus] = useState({});
  const [special, setSpecial] = useState('');
  const [underboob, setUnderboob] = useState(false);
  const [locks, setLocks] = useState({});
  /* 자물쇠는 보관함에 있다. 탭을 오가며 이 칸이 떴다 사라져도 되살아나야 한다 */
  useEffect(() => { const l = box.current.data.locks; if (l) setLocks({ ...l }); }, []);
  const [rndGroups, setRndGroups] = useState(
    () => Object.fromEntries(S.GROUP_META.map(([g]) => [g, g === 'face'])));
  const [onlyEmpty, setOnlyEmpty] = useState(false);
  const [status, setStatus] = useState('준비됨');
  const [showText, setShowText] = useState(false);
  const [exportText, setExportText] = useState('');
  const openRef = useRef(null);



  /* 저장한 값은 보관함에서 직접 본다 (모듈이 캐시된 옛 판이어도 맞게 돌도록) */
  const recordFor = name => {
    const mine = (box.current.data.anthro || {})[name] || null;
    const theirs = ATK.recordOf(name);
    if (!mine) return theirs;
    if (!theirs) return mine;
    return (mine.t || 0) >= (theirs.t || 0) ? mine : theirs;
  };

  const partNow = () => ({ sel: { ...sel }, cus: { ...cus }, ub: underboob, sp: special.trim() });

  function applyPart(part) {
    setSel(part && part.sel ? { ...part.sel } : {});
    setCus(part && part.cus ? { ...part.cus } : {});
    setUnderboob(!!(part && part.ub));
    setSpecial((part && part.sp) || '');
  }

  /* 기체가 바뀌기 직전의 값을 들고 있는다. 고르개가 위(App)로 올라가서
     예전처럼 고르는 순간에 잡을 수 없으므로, 늘 최신 것을 적어 두고 넘길 때 옮긴다 */
  const lastRef = useRef({ name: '', part: null });
  useEffect(() => {
    const p = lastRef.current;
    if (p.name && p.name !== mech && p.part) { prevRef.current = { name: p.name, part: p.part }; setPrevFrom(p.name); }
  }, [mech]);
  useEffect(() => { lastRef.current = { name: mech, part: partNow() }; });

  /* 기체를 열면 그 기록을 불러오고, 되돌리기 기준점으로 붙잡아 둔다 */
  useEffect(() => {
    if (!mech) return;
    const rec = recordFor(mech);
    if (!openRef.current || openRef.current.__card !== mech) {
      const snap = rec ? JSON.parse(JSON.stringify(rec)) : {};
      delete snap.prev; snap.__card = mech;
      openRef.current = snap;
    }
    if (rec && rec.mm) setMorph(rec.mm);
    applyPart(rec && rec[gender]);
  }, [mech, gender]);

  /* 성별을 바꾸면 그 성별에 없는 값은 AUTO 로 되돌린다 (원본과 같은 규칙) */
  useEffect(() => {
    setSel(o => {
      let hit = false; const n = {};
      Object.keys(o).forEach(k => {
        if (o[k] && !allowed(k, o[k], gender)) { hit = true; return; }
        n[k] = o[k];
      });
      return hit ? n : o;
    });
  }, [gender]);

  const ready = useRef(false);
  useEffect(() => { ready.current = false; }, [mech]);
  useEffect(() => {
    if (!mech || !data) return;
    if (!ready.current) { ready.current = true; return; }
    const rec = ATK.mergeRecord(mech, gender, partNow(), { morph });
    const st = box.current.data;
    if (!st.anthro) st.anthro = {};
    if (rec) st.anthro[mech] = rec; else delete st.anthro[mech];
    st.last = { series, mech };
    box.current.save();
  }, [mech, gender, sel, cus, underboob, special, morph, data]);


  const prompt = useMemo(() => {
    if (!card) return '';
    const raw = [];
    S.PARAM_DEFS.forEach(def => {
      if (!fitsGender(def, gender)) return;
      let v = sel[def.key] || '';
      if (v === '__custom__') v = (cus[def.key] || '').trim();
      if (v) raw.push([def.key, v]);
    });
    const params = AP.paramValues(raw, { special: special.trim(), underboob, gender });
    const serName = (card.series || []).map(k => (data.series.name || {})[k] || k).join(' · ');
    return AP.buildAnthro({ mech: card.name, series: serName, gender, style, morph,
      translation: translationOf(sel), params });
  }, [card, gender, style, morph, sel, cus, special, underboob, data]);

  /* 아래 띠에 지금 프롬프트와 단추를 등록한다 */
  useEffect(() => {
    onDock && onDock({
      text: prompt, status: status,
      preview: () => setShowText(v => !v),
      copy: () => copyText(prompt).then(() => setStatus('클립보드에 복사했다'), () => setStatus('복사에 실패했다')),
    });
  }, [prompt, status]);


  const setOne = (k, v) => setSel(o => ({ ...o, [k]: v }));
  const setCustom = (k, v) => setCus(o => ({ ...o, [k]: v }));
  const toggleLock = k => setLocks(o => {
    const n = { ...o };
    if (n['p:' + k]) delete n['p:' + k]; else n['p:' + k] = 1;
    box.current.data.locks = n; box.current.save();
    return n;
  });
  const lockCount = Object.keys(locks).length;

  const filledOf = g => S.PARAM_DEFS.filter(d => d.group === g && fitsGender(d, gender))
    .filter(d => sel[d.key] && (sel[d.key] !== '__custom__' || (cus[d.key] || '').trim())).length;
  const filled = S.GROUP_META.reduce((n, [g]) => n + filledOf(g), 0);

  function rollAnthro() {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    let set = 0, skipLock = 0, skipFull = 0, on = 0;
    const next = { ...sel };
    S.GROUP_META.forEach(([g]) => { if (rndGroups[g]) on++; });
    if (!on) { setStatus('굴릴 갈래를 하나도 안 골랐다 — 얼굴·체형 같은 것을 켜야 굴러간다'); return; }
    S.PARAM_DEFS.forEach(def => {
      if (!rndGroups[def.group] || !fitsGender(def, gender)) return;
      if (locks['p:' + def.key]) { skipLock++; return; }
      if (onlyEmpty && next[def.key]) { skipFull++; return; }
      const cand = optionsFor(def, gender).map(o => o[0]).filter(v => v && v !== '__custom__');
      if (!cand.length) return;
      next[def.key] = pick(cand); set++;
    });
    if (!set) {
      setStatus(skipFull ? '한 칸도 안 바뀌었다 — "빈 칸(AUTO)만 채우기" 가 켜져 있어 이미 값이 있는 '
          + skipFull + '칸을 건너뛰었다'
        : skipLock ? '한 칸도 안 바뀌었다 — 고른 갈래가 전부 자물쇠(' + skipLock + '칸)로 잠겨 있다'
        : '한 칸도 안 바뀌었다 — 고른 갈래에 굴릴 칸이 없다');
      return;
    }
    setSel(next);
    setStatus(set + '칸을 새로 굴렸다' + (skipLock ? ' · 자물쇠 ' + skipLock + '칸은 건너뜀' : ''));
  }

  function copyToOther() {
    const other = gender === 'female' ? 'male' : 'female';
    const nm = gender === 'female' ? '여성' : '남성', onm = other === 'female' ? '여성' : '남성';
    if (!confirm(onm + ' 쪽 설정을 지금 보고 있는 ' + nm + ' 설정으로 덮어쓴다. '
      + onm + ' 쪽에 만들어 둔 설정이 있다면 사라진다. 계속할까?')) return;
    const part = { sel: { ...sel }, cus: { ...cus },
      ub: other === 'female' ? underboob : false, sp: special.trim() };
    const rec = ATK.mergeRecord(mech, other, part, { morph });
    const st = box.current.data;
    if (!st.anthro) st.anthro = {};
    if (rec) {
      const now = recordFor(mech);
      if (now && now[gender] && !rec[gender]) rec[gender] = now[gender];
      st.anthro[mech] = rec;
    } else delete st.anthro[mech];
    box.current.flush();
    setStatus(nm + ' 설정을 ' + onm + ' 쪽에 복사했다 — 그 탭으로 넘어가면 적용된다');
  }

  function takePrev() {
    if (!prevRef.current) return;
    applyPart(prevRef.current.part);
    setStatus('직전 기체 "' + prevRef.current.name + '" 의 설정을 가져왔다');
  }
  function undo() {
    const back = openRef.current;
    if (!back) return;
    const now = { [gender]: partNow(), __card: mech };
    applyPart(back[gender] || null);
    openRef.current = now;
    setStatus('직전 값으로 되돌렸다. 한 번 더 누르면 원래대로 돌아온다.');
  }
  function resetAnthro() {
    applyPart(null);
    setStatus((gender === 'female' ? '여성' : '남성') + ' 설정만 AUTO로 초기화했다');
  }
  function dropLocal() {
    const st = box.current.data;
    if (st.anthro && st.anthro[mech]) delete st.anthro[mech];
    box.current.flush();
    applyPart((ATK.recordOf(mech) || {})[gender]);
    setStatus('이 브라우저에서 고친 것을 버리고 저장소 기록으로 되돌렸다');
  }
  function exportOne() {
    const rec = recordFor(mech) || {};
    const clean = { ...rec }; delete clean.prev; delete clean.__card;
    const out = { version: 1, card: mech, updated: new Date().toISOString(),
      record: clean, used: ATK.usedOf(mech), selectedStyle: style };
    const text = JSON.stringify(out, null, 2);
    setExportText(text);
    copyText(text).then(() => setStatus(mech + ' 한 기체의 settings.json 기록을 내보냈다 — 복사도 했다'),
      () => setStatus('복사는 실패했다. 아래 칸에서 직접 가져가라'));
  }

  const localCount = Object.keys(box.current.data.anthro || {}).length;
  const hasLocal = !!(box.current.data.anthro || {})[mech];
  const hasRec = !!recordFor(mech);

  return html`
    <section class="panel">
      <div class="panel-head">
        <strong>의인화 프롬프트</strong>
        <span>기체 선택 → 외형 편집 → 프롬프트 복사</span>
      </div>

      <div class="form-section">
        <aside class="studio-setup" aria-label="기체 기본 설정">
        <div class="section-caption"><b>01</b> 기체 & 콘셉트</div>
        <div class="studio-selection"><div><small>SELECTED UNIT</small><strong>${mech || '기체를 선택하세요'}</strong></div>
          <span class="selection-count">${filled} 지정</span></div>
        <div class="setup-options">
        <div class="gender-tabs">
          ${[['female', '여성 / Female'], ['male', '남성 / Male']].map(([g, t]) => html`
            <button type="button" key=${g} class=${'gt' + (gender === g ? ' on' : '')}
                    onclick=${() => setGender(g)}>${t}</button>`)}
        </div>
        <div class="param-note" style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span>탭마다 설정을 따로 기억한다. 여성 쪽에서 잡은 값이 남성 쪽으로 자동으로 넘어가지 않는다.</span>
          <button type="button" class="card-rnd sub" style="flex:none" onclick=${copyToOther}>
            지금 보는 설정 → 반대 성별에 복사</button>
        </div>

        <div class="field" style="margin-top:10px">
          <label>Morphology Mode <small>형태 번역 전략 · 인간형과 거리가 있는 기체에 사용</small></label>
          <select aria-label="형태 번역 전략" value=${morph} onchange=${e => setMorph(e.target.value)}>
            ${MORPHS.map(([k, t]) => html`<option key=${k} value=${k}>${t}</option>`)}
          </select>
          <div class="param-note" style="margin-top:4px">정답은 하나가 아니다 — 결과가 미묘하면 다른 모드로 다시 생성해본다.</div>
        </div>

        </div>
        </aside>
        <div class="studio-editor">
        <div class="section-caption"><b>02</b> 외형 디테일</div>
        <div class="param-note" style="margin:10px 0 0">
          ${filled ? '전체 ' + filled + '개 지정됨 — 비워둔 항목은 기체 원본에서 자동으로 채워진다'
                   : '전부 AUTO — 기체 원본에서 모두 자동으로 결정된다'}
        </div>
        <button type="button" class="rnd-top" onclick=${rollAnthro}>🎲 외형 랜덤</button>
        <div class="status" style="margin-top:4px">${status}</div>

        <div style="margin-top:8px">
          ${S.GROUP_META.map(([g, ko, desc, open]) => {
            const rows = S.PARAM_DEFS.filter(d => d.group === g && fitsGender(d, gender));
            if (!rows.length) return null;
            const n = filledOf(g);
            const tops = rows.filter(d => !d.sub);
            const subs = rows.filter(d => d.sub);
            const cardOf = def => html`
              <${ParamCard} key=${def.key} def=${def} value=${sel[def.key] || ''}
                            custom=${cus[def.key] || ''} locked=${!!locks['p:' + def.key]}
                            sel=${sel} gender=${gender} img=${data.img} style=${style} exclude=${mech}
                            onValue=${v => setOne(def.key, v)} onCustom=${v => setCustom(def.key, v)}
                            onLock=${() => toggleLock(def.key)}
                            onZoom=${(list, i) => onZoom({ list, i })} />`;
            /* 하위 항목은 어느 상위 값 안에서 조정되는지 머리에 적는다 (원본과 같다) */
            const subGroups = {};
            subs.forEach(d => { (subGroups[d.sub] = subGroups[d.sub] || []).push(d); });
            return html`
              <details class="grp" key=${g} open=${!!open}>
                <summary>
                  <span>${ko}<em class=${n ? 'on' : ''}>${n ? '  ' + n + ' 지정' : ''}</em></span>
                  <i>${desc}</i>
                </summary>
                <div class="grp-in">
                  ${tops.map(cardOf)}
                  ${Object.keys(subGroups).map(parent => {
                    const pd = S.PARAM_DEFS.find(d => d.key === parent);
                    const pv = sel[parent];
                    const txt = pv && pv !== '__custom__'
                      ? (pd.options.find(o => o[0] === pv) || ['', pv])[1].split(' — ')[0] : '';
                    return html`
                      <div class=${'sub-wrap' + (txt ? ' on' : '')} key=${parent}>
                        <div class="sub-head">
                          ${txt ? html`위 <b>${pd.label} · ${txt}</b> 안에서 조정`
                                : html`위 <b>${pd ? pd.label : parent}</b> 가 AUTO — 아래 값이 단독으로 적용된다`}
                        </div>
                        ${subGroups[parent].map(cardOf)}
                      </div>`;
                  })}
                </div>
              </details>`;
          })}
        </div>

        ${gender === 'female' && html`
          <div class="field" style="margin-top:10px">
            <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer">
              <input type="checkbox" checked=${underboob} style="width:auto;margin:0;flex:none"
                     onchange=${e => setUnderboob(e.target.checked)} />
              <span>Underboob Armor <small>흉갑 하단 노출</small></span>
            </label>
          </div>`}

        <div class="field" style="margin-top:10px">
          <label>Special Characteristics <small>특수 외형 / 추가 지시</small></label>
          <input type="text" placeholder="예: pale mint highlights, narrow waist armor"
                 value=${special} oninput=${e => setSpecial(e.target.value)} />
        </div>

        <div class="param-note">
          AUTO 항목은 최종 PARAMETERS에서 생략돼. 직접 입력을 고르면 원하는 값을 자유롭게 넣을 수 있어.
        </div>

        <div class="save-bar">
          <span class="sb-txt">
            ${!box.current.ok ? '이 브라우저에서는 저장이 막혀 있다'
              : (hasRec ? '"' + mech + '" 설정 있음' + (hasLocal ? ' (이 브라우저)' : ' (저장소 기록)')
                        : '"' + mech + '" 는 아직 설정이 없다')
                + ' · 이 브라우저 기록 ' + localCount + '기'}
          </span>
          <span style="display:flex;gap:6px;flex:none">
            <button type="button" class="sb-drop" onclick=${undo}>직전 값으로</button>
            ${hasLocal ? html`<button type="button" class="sb-drop" onclick=${dropLocal}>이 브라우저 수정 되돌리기</button>` : null}
          </span>
        </div>
        <div class="save-bar">
          <span class="sb-txt">저장소에 커밋할 기록을 내보낸다. 기체 폴더의 <code>settings.json</code>에 저장하면 다른 기기에서도 보인다.</span>
          <button type="button" class="sb-drop" onclick=${exportOne}>기록 내보내기</button>
        </div>
        ${exportText && html`<textarea readonly style="margin-top:8px;min-height:120px;font-size:11px" value=${exportText}></textarea>`}

        <div class="rnd-tgt" style="margin-bottom:9px">
          <span>🎲 랜덤으로 정할 것 — 자물쇠 걸린 칸은 건너뛴다</span>
          ${S.GROUP_META.map(([g, ko]) => html`
            <label key=${g}><input type="checkbox" checked=${!!rndGroups[g]}
                    onchange=${e => setRndGroups(o => ({ ...o, [g]: e.target.checked }))} /><span>${ko}</span></label>`)}
          <label style="width:100%;margin-top:2px">
            <input type="checkbox" checked=${onlyEmpty} onchange=${e => setOnlyEmpty(e.target.checked)} />
            <span>빈 칸(AUTO)만 채우기 — 켜면 이미 값이 있는 칸은 건너뛴다</span>
          </label>
          ${lockCount ? html`<span class="lock-note">자물쇠 ${lockCount}칸 — 랜덤이 건너뛴다</span>` : null}
          ${lockCount ? html`<button type="button" class="lock-clear"
            onclick=${() => { setLocks({}); box.current.data.locks = {}; box.current.save(); }}>자물쇠 모두 풀기</button>` : null}
        </div>

        <div class="param-actions">
          <button type="button" onclick=${rollAnthro}>🎲 외형 랜덤</button>
          <button type="button" onclick=${resetAnthro}>외형 리셋</button>
          ${prevRef.current && prevRef.current.name !== mech
            ? html`<button type="button" onclick=${takePrev}>직전 기체 설정 가져오기 (${prevFrom})</button>` : null}
        </div>
      </div>
      </div>

      <div class="controls">
        <button class="primary" type="button" disabled=${!prompt}
                onclick=${() => copyText(prompt).then(() => setStatus('클립보드에 복사했다'),
                                                      () => setStatus('복사에 실패했다'))}>클립보드 복사</button>
        <button type="button" aria-expanded=${String(showText)} onclick=${() => setShowText(v => !v)}>${showText ? '텍스트 닫기' : '텍스트 보기'}</button>
      </div>
      <div class="status" role="status">${status}</div>
      ${showText && html`
        <div class="prompt-view">
          <textarea aria-label="생성 프롬프트" readonly spellcheck="false" value=${prompt}></textarea>
        </div>`}
    </section>
`;
}

/* ── 단일 컷 ─────────────────────────────────────────────────────────────
   콜라주 없이 한 장만 뽑는다. 원본(prompt.html #panelSingle)의 기능을 그대로
   옮겼다 — 랜덤 성격 · 세 가지 랜덤 · 직전 설정으로 · 랜덤 대상 고르기 ·
   카테고리/예시(직접 입력·설명줄) · 비율 · 화각 · 표정 · 시점 · 포즈 ·
   직접 입력 넷 · 세부 강도 다섯 축 · 정체성 이어받기 둘 · 이미 쓴 카테고리 회피 ·
   한글 요약 · 설정 반영 · 리셋.
   프롬프트를 만드는 일은 lib/prompt-lifestyle.js 의 buildSingle 이 한다. */
const SG_ASPECTS = [
  ['2:3 vertical', '2:3 세로 — 전신·인물 중심'],
  ['3:2 horizontal', '3:2 가로 — 배경·상황 중심'],
  ['1:1 square', '1:1 정사각'],
  ['4:5 vertical', '4:5 세로 — 살짝 넓은 세로'],
];
const SG_FRAMES = [
  ['', 'AUTO — 자동'], ['full body', 'full body — 전신'],
  ['three-quarter body', 'three-quarter — 무릎 위'],
  ['waist up', 'waist up — 상반신'],
  ['close-up portrait', 'close-up — 얼굴 근접'],
];
const SG_TARGETS = [
  ['cat', '카테고리', true], ['ex', '예시', true], ['adv', '고급 설정', true],
  ['aspect', '화면 비율', true], ['frame', '화각', true],
  ['expr', '표정', false], ['orient', '시점', false], ['pose', '포즈', false],
];
const sgFresh = () => ({
  mode: 'variety',
  tgt: Object.fromEntries(SG_TARGETS.map(([k, , on]) => [k, on])),
  cat: (S.CATS[0] || [''])[0], catCustom: '', ex: '', exCustom: '',
  aspect: SG_ASPECTS[0][0], frame: '', expr: '', orient: '', pose: '',
  scene: '', outfit: '', camera: '', custom: '',
  axes: Object.fromEntries(S.LOCAL_AXES.map(k => [k, ''])),
  carryFace: false, carryBody: false, avoid: false,
});

/* 성별 전용 값 거르기 — 원본의 SEX_OK 와 같은 규칙이다 */
const sexOK = (x, g) => !x || x === (g === 'male' ? 'm' : 'f');
const catRows = g => S.CATS.filter(r => sexOK(r[4], g));
const exRows = (cat, g) => (S.EXAMPLE_MAP[cat] || S.EXAMPLE_MAP['__custom__'] || []).filter(r => sexOK(r[4], g));

function SinglePanel({ data, series, setSeries, mech, setMech, gender, setGender,
                       style, setStyle, box, seriesList, mechList, card, onDock }) {
  const [st, setSt] = useState(sgFresh);
  const [status, setStatus] = useState('준비됨');
  const [showText, setShowText] = useState(false);
  const prev = useRef(null);
  const [hasPrev, setHasPrev] = useState(false);

  /* 보관함에서 되살리고, 바뀔 때마다 담아 둔다. 탭을 오가도 남아야 한다 */
  useEffect(() => {
    const saved = box.current.data.single;
    if (saved) setSt(o => ({ ...o, ...saved, tgt: { ...o.tgt, ...(saved.tgt || {}) },
                                      axes: { ...o.axes, ...(saved.axes || {}) } }));
  }, []);
  useEffect(() => { box.current.data.single = st; box.current.save(); }, [st]);

  const set = (k, v) => setSt(o => ({ ...o, [k]: v }));
  const setAxis = (k, v) => setSt(o => ({ ...o, axes: { ...o.axes, [k]: v } }));
  const setTgt = (k, v) => setSt(o => ({ ...o, tgt: { ...o.tgt, [k]: v } }));

  const record = useMemo(() => {
    const mine = (box.current.data.anthro || {})[mech] || null;
    const theirs = ATK.recordOf(mech);
    if (!mine) return theirs; if (!theirs) return mine;
    return (mine.t || 0) >= (theirs.t || 0) ? mine : theirs;
  }, [mech, data]);

  /* 카테고리를 바꾸면 예시 목록이 바뀐다. 남아 있던 값이 새 목록에 없으면 비운다 */
  const exList = useMemo(() => exRows(st.cat, gender), [st.cat, gender]);
  useEffect(() => {
    if (st.ex && st.ex !== '__custom__' && !exList.some(r => r[0] === st.ex)) set('ex', '');
  }, [exList]);
  /* 성별을 바꾸면 그 성별에 없는 카테고리는 첫 값으로 되돌린다 */
  useEffect(() => {
    const rows = catRows(gender);
    if (!rows.some(r => r[0] === st.cat)) set('cat', (rows[0] || [''])[0]);
  }, [gender]);

  const prompt = useMemo(() => {
    if (!card) return '';
    return AL.buildSingle({
      source: { mech: card.name }, gender, style, record,
      cat: st.cat, catCustom: st.catCustom.trim(), ex: st.ex, exCustom: st.exCustom.trim(),
      aspect: st.aspect, frame: st.frame, expr: st.expr, orient: st.orient, pose: st.pose,
      scene: st.scene.trim(), outfit: st.outfit.trim(), camera: st.camera.trim(),
      custom: st.custom.trim(), axes: st.axes,
      carryFace: st.carryFace, carryBody: st.carryBody,
    });
  }, [card, gender, style, record, st]);

  /* 아래 띠에 지금 프롬프트와 단추를 등록한다 */
  useEffect(() => {
    onDock && onDock({
      text: prompt, status: status,
      preview: () => setShowText(v => !v),
      copy: () => copyText(prompt).then(() => { noteUse(); setStatus('클립보드에 복사했다 — 쓴 컷 기록에 쌓았다'); }, () => setStatus('복사에 실패했다')),
    });
  }, [prompt, status]);

  function push() { prev.current = JSON.parse(JSON.stringify(st)); setHasPrev(true); }
  function undo() {
    if (!prev.current) return;
    const now = JSON.parse(JSON.stringify(st));
    setSt(prev.current); prev.current = now;
    setStatus('직전 설정으로 되돌렸다. 한 번 더 누르면 원래대로.');
  }

  /* 뽑기 판 — 랜덤 성격이 정한 목록에서, 회피를 켜면 이미 쓴 것을 뺀다 */
  function pool() {
    const M = S.RANDOM_MODES[st.mode] || S.RANDOM_MODES.variety;
    const all = (M.pool || S.RANDOM_POOL).filter(c => catRows(gender).some(r => r[0] === c));
    if (!st.avoid) return { list: all, full: all.length, skipped: 0 };
    const used = {}; ATK.usedOf(mech).forEach(r => { if (r.cat) used[r.cat] = 1; });
    const left = all.filter(c => !used[c]);
    return { list: left.length ? left : all, full: all.length, skipped: Object.keys(used).length };
  }

  function roll(mode) {           /* 'all' | 'axesOnly' | 'skipAxes' */
    push();
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const T = st.tgt, next = { ...st };
    let note = '', narrow = false;
    if (mode !== 'axesOnly') {
      if (T.cat) {
        const p = pool();
        if (p.list.length) next.cat = pick(p.list);
        narrow = p.list.length <= 2 && p.full > 2;
        note = ' — 카테고리 후보 ' + p.list.length + '/' + p.full + '종'
             + (p.skipped && p.list.length < p.full
                ? ' (이미 쓴 ' + p.skipped + '종 제외 · 회피 끄면 전체)' : '');
        next.ex = '';
      }
      if (T.ex) {
        const cand = exRows(next.cat, gender).map(r => r[0]).filter(v => v && v !== '__custom__');
        next.ex = cand.length ? pick(cand) : '';
      }
      if (T.expr) next.expr = pick(S.EXPRESSION_OPTIONS.filter(x => x[0]))[0];
      if (T.orient) next.orient = pick(S.ORIENTATION_OPTIONS.filter(x => x[0]))[0];
      if (T.pose) next.pose = pick(S.POSE_OPTIONS.filter(x => x[0]))[0];
      if (T.aspect) next.aspect = pick(SG_ASPECTS)[0];
    }
    /* 화각은 세부 강도만 굴릴 때도 함께 굴러간다 — 원본과 같다 */
    if (T.frame) next.frame = pick(SG_FRAMES.filter(x => x[0]))[0];
    if (mode !== 'skipAxes' && T.adv) {
      const ax = { ...next.axes };
      S.LOCAL_AXES.forEach(k => {
        const vals = (S.ADVANCED_OPTIONS[k] || []).filter(v => v !== 'AUTO');
        ax[k] = (Math.random() < 0.25 || !vals.length) ? '' : vals[Math.floor(Math.random() * vals.length)];
      });
      next.axes = ax;
    }
    setSt(next);
    setStatus((mode === 'axesOnly' ? '세부 강도를 굴렸다'
      : mode === 'skipAxes' ? '세부 강도는 그대로 두고 나머지를 굴렸다'
      : '단일 컷 설정을 굴렸다') + note + (narrow ? ' ⚠' : ''));
  }

  function reset() {
    push();
    const f = sgFresh();
    setSt(o => ({ ...f, mode: o.mode, tgt: o.tgt, carryFace: o.carryFace,
                  carryBody: o.carryBody, avoid: o.avoid }));
    setStatus('단일 컷 설정을 초기화했다');
  }

  /* 복사하면 쓴 컷 기록에 한 조합이 쌓인다 — 콜라주와 같은 기록이다 */
  function noteUse() {
    if (!mech || !st.cat || st.cat === '__custom__') return;
    const d = box.current.data;
    if (!d.used) d.used = {};
    const arr = d.used[mech] || (d.used[mech] = []);
    const ex = st.ex || '';
    const hit = arr.find(r => r.cat === st.cat && (r.ex || '') === ex);
    if (hit) { hit.n = (hit.n || 1) + 1; hit.t = Date.now(); }
    else arr.push({ cat: st.cat, ex: ex, n: 1, t: Date.now() });
    box.current.save();
  }

  const catNote = S.CAT_KO[st.cat] || '';
  const exNote = st.ex ? (S.EX_NOTE[st.ex] || '') : '';
  const axOn = S.LOCAL_AXES.filter(k => st.axes[k]).length;
  const tgtOn = SG_TARGETS.filter(([k]) => st.tgt[k]).length;
  const usedN = ATK.usedOf(mech).length;

  /* 한글 요약 — 접어둔 칸의 상태까지 한 줄에 모은다 */
  const summary = (() => {
    const half = a => Object.fromEntries(a.map(o => [o[0], (o[1] || '').split(' — ')[1] || o[1]]));
    const EX = half(S.EXPRESSION_OPTIONS), OR = half(S.ORIENTATION_OPTIONS), PO = half(S.POSE_OPTIONS);
    const cr = catRows(gender).find(r => r[0] === st.cat);
    const er = exList.find(r => r[0] === st.ex);
    const mood = [EX[st.expr], OR[st.orient], PO[st.pose]].filter(Boolean).join(' · ');
    const flags = ['화풍 ' + ((S.ART_STYLES.find(r => r[0] === style) || ['', style])[1])];
    if (axOn) flags.push('세부 강도 ' + axOn + '개');
    const carried = (st.carryFace ? AL.carryValues(S.CARRY_FACE, record, gender).length : 0)
                  + (st.carryBody ? AL.carryValues(S.CARRY_BODY, record, gender).length : 0);
    if (carried) flags.push('의인화 설정 ' + carried + '개 전달');
    if (st.avoid && usedN) flags.push('이미 쓴 카테고리는 랜덤에서 뺀다');
    return { head: (cr ? cr[2] : st.cat) + (er ? ' — ' + er[2] : ''), aspect: st.aspect, mood, flags };
  })();

  const optRows = rows => rows.map(([v, t]) => html`<option key=${v} value=${v}>${t}</option>`);

  return html`
    <section class="panel">
      <div class="panel-head">
        <strong>단일 컷</strong>
        <span>콜라주 없이 한 장만 · 카테고리 · 예시 · 표정 · 시점 · 포즈 · 세부 강도</span>
      </div>

      <div class="form-section">
        <aside class="studio-setup" aria-label="기체 기본 설정">
          <div class="section-caption"><b>01</b> 기체 & 화풍</div>
          <div class="studio-selection"><div><small>SELECTED UNIT</small><strong>${mech || '기체를 선택하세요'}</strong></div>
            <span class="selection-count">${usedN ? usedN + '조합 씀' : '처음'}</span></div>
          <div class="setup-options">
            <div class="gender-tabs">
              ${[['female', '여성 / Female'], ['male', '남성 / Male']].map(([g, t]) => html`
                <button type="button" key=${g} class=${'gt' + (gender === g ? ' on' : '')}
                        onclick=${() => setGender(g)}>${t}</button>`)}
            </div>
            <div class="field" style="margin-top:10px">
              <label>랜덤 성격 <small>어떤 카테고리 판에서 고를지</small></label>
              <select aria-label="랜덤 성격" value=${st.mode} onchange=${e => set('mode', e.target.value)}>
                ${Object.entries(S.RANDOM_MODES).map(([k, m]) => html`
                  <option key=${k} value=${k}>${m.ko} — ${m.descOne || m.desc}</option>`)}
              </select>
            </div>
            <div class="param-actions" style="margin-top:8px">
              <button type="button" onclick=${() => roll('all')}>🎲 전체 랜덤</button>
              <button type="button" onclick=${() => roll('axesOnly')}>🎲 세부 강도만</button>
              <button type="button" onclick=${() => roll('skipAxes')}>🎲 세부 강도 빼고</button>
            </div>
            ${hasPrev ? html`<button type="button" class="card-rnd sub" style="margin-top:6px"
                                     onclick=${undo}>↩ 직전 설정으로</button>` : null}

            <details class="grp" style="margin-top:8px">
              <summary><span>랜덤으로 정할 것<em class=${tgtOn ? 'on' : ''}>  ${tgtOn}/${SG_TARGETS.length}개 켬</em></span>
                <i>끈 칸은 굴려도 그대로 둔다</i></summary>
              <div class="grp-in">
                <div class="rnd-tgt">
                  ${SG_TARGETS.map(([k, ko]) => html`
                    <label key=${k}><input type="checkbox" checked=${!!st.tgt[k]}
                      onchange=${e => setTgt(k, e.target.checked)} /><span>${ko}</span></label>`)}
                </div>
              </div>
            </details>
          </div>
        </aside>

        <div class="studio-editor">
          <div class="section-caption"><b>02</b> 이 컷은 무엇인가</div>

          <div class="field" style="margin-top:10px">
            <label>Category <small>카테고리</small></label>
            <select aria-label="카테고리" value=${st.cat} onchange=${e => { set('cat', e.target.value); set('ex', ''); }}>
              ${catRows(gender).map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]} — ${r[2]}</option>`)}
            </select>
            ${st.cat === '__custom__' ? html`
              <input type="text" style="margin-top:6px" placeholder="카테고리 직접 입력"
                     value=${st.catCustom} oninput=${e => set('catCustom', e.target.value)} />` : null}
            ${catNote ? html`<div class="param-note" style="margin-top:4px">${catNote}</div>` : null}
          </div>

          <div class="field" style="margin-top:9px">
            <label>Example Menu <small>예시 메뉴</small></label>
            <select aria-label="예시 메뉴" value=${st.ex} onchange=${e => set('ex', e.target.value)}>
              ${['basic', 'popular', 'special'].map(g => {
                const rows = exList.filter(r => r[3] === g);
                if (!rows.length) return null;
                return html`<optgroup key=${g} label=${S.GROUP_LABELS[g] || g}>
                  ${rows.map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]} — ${r[2]}</option>`)}
                </optgroup>`;
              })}
            </select>
            ${st.ex === '__custom__' ? html`
              <input type="text" style="margin-top:6px" placeholder="예시 직접 입력"
                     value=${st.exCustom} oninput=${e => set('exCustom', e.target.value)} />` : null}
            ${exNote ? html`<div class="param-note" style="margin-top:4px">${exNote}</div>` : null}
          </div>

          <div class="param-grid" style="margin-top:9px">
            <div class="field"><label>Aspect <small>화면 비율</small></label>
              <select aria-label="화면 비율" value=${st.aspect} onchange=${e => set('aspect', e.target.value)}>
                ${optRows(SG_ASPECTS)}</select></div>
            <div class="field"><label>Framing <small>화각</small></label>
              <select aria-label="화각" value=${st.frame} onchange=${e => set('frame', e.target.value)}>
                ${optRows(SG_FRAMES)}</select></div>
            <div class="field"><label>Expression <small>표정</small></label>
              <select aria-label="표정" value=${st.expr} onchange=${e => set('expr', e.target.value)}>
                ${optRows(S.EXPRESSION_OPTIONS)}</select></div>
            <div class="field"><label>Body Orientation <small>앞/옆/뒷태</small></label>
              <select aria-label="앞옆뒷태" value=${st.orient} onchange=${e => set('orient', e.target.value)}>
                ${optRows(S.ORIENTATION_OPTIONS)}</select></div>
            <div class="field"><label>Pose <small>포즈</small></label>
              <select aria-label="포즈" value=${st.pose} onchange=${e => set('pose', e.target.value)}>
                ${optRows(S.POSE_OPTIONS)}</select></div>
          </div>

          <details class="grp" style="margin-top:9px">
            <summary><span>직접 입력<em class=${[st.scene, st.outfit, st.camera, st.custom].filter(Boolean).length ? 'on' : ''}>
              ${[st.scene, st.outfit, st.camera, st.custom].filter(Boolean).length
                ? '  ' + [st.scene, st.outfit, st.camera, st.custom].filter(Boolean).length + '칸 적음' : ''}</em></span>
              <i>장면 · 의상 · 카메라 · 추가 지시</i></summary>
            <div class="grp-in">
              ${[['scene', 'Scene / Location', '장면·장소', 'AUTO'],
                 ['outfit', 'Outfit', '의상', 'AUTO'],
                 ['camera', 'Camera / Lighting', '카메라·조명', 'AUTO'],
                 ['custom', 'Custom Instruction', '추가 지시', '예: rain outside the window, warm lamp light']
                ].map(([k, en, ko, ph]) => html`
                <div class="field" key=${k} style="margin-top:9px">
                  <label>${en} <small>${ko}</small></label>
                  <input type="text" placeholder=${ph} value=${st[k]} oninput=${e => set(k, e.target.value)} />
                </div>`)}
            </div>
          </details>

          <details class="grp" style="margin-top:9px">
            <summary><span>세부 강도<em class=${axOn ? 'on' : ''}>${axOn ? '  ' + axOn + ' 지정' : ''}</em></span>
              <i>비워두면 지정하지 않는다 — 한 장이라 이 컷에만 걸린다</i></summary>
            <div class="grp-in">
              ${S.LOCAL_AXES.map(k => {
                const lab = S.ADVANCED_LABELS[k] || [k, ''], ko = S.ADV_VAL[k] || {};
                return html`<div class="field" key=${k} style="margin-top:7px">
                  <label>${lab[0]} <small>${lab[1]}</small></label>
                  <select aria-label=${'세부 ' + lab[0]} value=${st.axes[k] || ''} onchange=${e => setAxis(k, e.target.value)}>
                    ${(S.ADVANCED_OPTIONS[k] || []).map(v => html`
                      <option key=${v} value=${v === 'AUTO' ? '' : v}>
                        ${v === 'AUTO' ? '지정 안 함' : (ko[v] ? v + ' — ' + ko[v] : v)}</option>`)}
                  </select></div>`;
              })}
            </div>
          </details>

          <div class="save-bar" style="align-items:flex-start;flex-direction:column;gap:6px;margin-top:10px">
            ${[['carryFace', '이 기체의 얼굴 설정을 정체성에 넘기기'],
               ['carryBody', '이 기체의 체형 설정을 정체성에 넘기기'],
               ['avoid', '이미 쓴 카테고리는 랜덤에서 빼기']].map(([k, ko]) => html`
              <label key=${k} style="display:flex;align-items:center;gap:7px;margin:0;cursor:pointer;font-size:11.5px">
                <input type="checkbox" checked=${!!st[k]} style="width:auto;margin:0;flex:none"
                       onchange=${e => set(k, e.target.checked)} /><span>${ko}</span></label>`)}
            <span class="uz">복사하면 쓴 컷 기록에 쌓인다. 한 장이므로 조합 하나만 적립된다.</span>
          </div>

          <div class="param-actions">
            <button type="button" onclick=${() => { setStatus('단일 컷 설정 적용 완료'); }}>설정 반영</button>
            <button type="button" onclick=${reset}>단일 컷 리셋</button>
          </div>
        </div>
      </div>

      <div class="ko-sum">
        <div class="ks-t">지금 설정 요약</div>
        <div class="ks-r"><b>한 장</b>${summary.head} <i>${summary.aspect}</i>${summary.mood ? html`<u>${summary.mood}</u>` : null}</div>
        <div class="ks-f">${summary.flags.join(' · ')}</div>
      </div>

      <div class="controls">
        <button class="primary" type="button" disabled=${!prompt}
                onclick=${() => copyText(prompt).then(
                  () => { noteUse(); setStatus('클립보드에 복사했다 — 쓴 컷 기록에 쌓았다'); },
                  () => setStatus('복사에 실패했다'))}>클립보드 복사</button>
        <button type="button" aria-expanded=${String(showText)}
                onclick=${() => setShowText(v => !v)}>${showText ? '텍스트 닫기' : '텍스트 보기'}</button>
      </div>
      <div class="status" role="status">${status}</div>
      ${showText && html`
        <div class="prompt-view">
          <textarea aria-label="생성 프롬프트" readonly spellcheck="false" value=${prompt}></textarea>
        </div>`}
    </section>`;
}


/* ── 콜라주 ─────────────────────────────────────────────────────────────
   한 장에 여섯 칸. Pair 로 묶으면 두 칸이 같은 주제의 약한 컷 / 강한 컷이 되고,
   묶기를 풀면 두 칸이 서로 무관해진다. Panel 개별 모드에서 칸마다 덮어쓴다.
   프롬프트를 만드는 일은 lib/prompt-lifestyle.js 의 buildCollage 가 한다. */
const CLG_EXPR_MODES = [
  ['', 'AUTO — 자동'], ['balanced', 'balanced — 균형형'], ['lively', 'lively — 생기 있는 표정'],
  ['sensual', 'sensual — 자연스러운 섹시'], ['dramatic', 'dramatic — 드라마틱'],
  ['candid', 'candid — 생활감 있는 표정'], ['playful', 'playful — 장난기'],
];
const CLG_ORIENT_MIX = [
  ['', 'AUTO — 자동'], ['front_balanced', 'front_balanced — 앞태 중심 균형'],
  ['mixed_balanced', 'mixed_balanced — 앞뒤 균형 믹스'], ['rear_accent', 'rear_accent — 뒷태 포인트 포함'],
  ['dynamic_mix', 'dynamic_mix — 방향 다양화'], ['elegant_backline', 'elegant_backline — 등/허리 라인 강조'],
];
const CLG_FRAMES = [
  ['', 'AUTO — 자동'], ['full body', 'full body — 전신'],
  ['three-quarter body', 'three-quarter — 무릎 위'], ['waist up', 'waist up — 상반신'],
  ['close-up portrait', 'close-up — 얼굴 근접'],
];
const CLG_TARGETS = [
  ['cat', '카테고리', true], ['ex', '예시', true], ['adv', '고급 설정', true],
  ['frame', '화각', true], ['expr', '표정', false], ['orient', '시점', false], ['pose', '포즈', false],
];
const OV_TEXTS = [['scene', 'Scene / Location', '장면/장소'], ['outfit', 'Outfit', '의상'],
  ['action', 'Action / Pose', '행동/포즈'], ['camera', 'Camera / Lighting', '카메라/조명'],
  ['extra', 'Extra', '추가 지시']];
const pairOf = n => Math.ceil(n / 2);

function clgFresh() {
  /* 원본은 부팅할 때 프리셋 A 를 넣고 시작한다. 'free' 로 두면 전역 고급 설정이
     통째로 비어 [ADDITIONAL SETTINGS] 가 "Use balanced defaults." 한 줄이 된다 */
  const P = S.PRESETS.A || S.PRESETS.free;
  const pairs = {}, panels = {};
  [1, 2, 3].forEach(n => {
    pairs[n] = { use: true, key: (P.pairs[n - 1] || ''), custom: '',
      exampleKey: '', exampleCustom: '', expr: '', orient: '', pose: '',
      adv: Object.fromEntries(S.LOCAL_AXES.concat(S.PAIR_ONLY).map(k => [k, ''])) };
  });
  /* 패널 카테고리는 제 Pair 것을 기본으로 깔고 있는다 — 원본의 renderPanelCat 과 같다.
     비워 두면 Pair 를 풀었을 때 auto_random 으로 떨어져 카테고리가 통째로 바뀐다 */
  for (let n = 1; n <= 6; n++) panels[n] = { cat: (P.pairs[pairOf(n) - 1] || ''), catCustom: '',
    exampleKey: '', exampleCustom: '', ov: {} };
  return {
    preset: 'A', mode: 'variety',
    tgt: Object.fromEntries(CLG_TARGETS.map(([k, , on]) => [k, on])),
    avoid: true, custom: '', build: 'pair', panelTab: 1,
    pairs, panels, adv: { ...(P.advanced || {}) },
    globals: { expressionMode: '', orientationMix: '', frame: '' },
    carryFace: false, carryBody: false,
  };
}

function CollagePanel({ data, series, setSeries, mech, setMech, gender, setGender,
                        style, setStyle, box, seriesList, mechList, card, onDock }) {
  const [st, setSt] = useState(clgFresh);
  const [status, setStatus] = useState('준비됨');
  const [showText, setShowText] = useState(false);
  const [usedOpen, setUsedOpen] = useState(false);
  const prev = useRef(null);
  const [hasPrev, setHasPrev] = useState(false);
  const [usedTick, setUsedTick] = useState(0);

  useEffect(() => {
    const saved = box.current.data.collage;
    if (saved && saved.pairs) setSt(o => ({ ...o, ...saved }));
  }, []);
  useEffect(() => { box.current.data.collage = st; box.current.save(); }, [st]);

  const set = (k, v) => setSt(o => ({ ...o, [k]: v }));
  const setPair = (n, k, v) => setSt(o => ({ ...o, pairs: { ...o.pairs, [n]: { ...o.pairs[n], [k]: v } } }));
  const setPairAdv = (n, k, v) => setSt(o => ({ ...o, pairs: { ...o.pairs,
    [n]: { ...o.pairs[n], adv: { ...o.pairs[n].adv, [k]: v } } } }));
  const setPanel = (n, k, v) => setSt(o => ({ ...o, panels: { ...o.panels, [n]: { ...o.panels[n], [k]: v } } }));
  const setOv = (n, k, v) => setSt(o => ({ ...o, panels: { ...o.panels,
    [n]: { ...o.panels[n], ov: { ...o.panels[n].ov, [k]: v } } } }));
  /* Pair 카테고리를 바꾸면 그 두 패널의 기본값도 함께 옮긴다 — 원본과 같다 */
  const setPairKey = (n, v) => setSt(o => {
    const pairs = { ...o.pairs, [n]: { ...o.pairs[n], key: v, custom: '', exampleKey: '' } };
    const panels = { ...o.panels };
    [n * 2 - 1, n * 2].forEach(x => { panels[x] = { ...panels[x], cat: v, exampleKey: '' }; });
    return { ...o, pairs, panels };
  });
  const setAdv = (k, v) => setSt(o => ({ ...o, adv: { ...o.adv, [k]: v } }));
  const setGlobal = (k, v) => setSt(o => ({ ...o, globals: { ...o.globals, [k]: v } }));
  const setTgt = (k, v) => setSt(o => ({ ...o, tgt: { ...o.tgt, [k]: v } }));

  const record = useMemo(() => {
    const mine = (box.current.data.anthro || {})[mech] || null;
    const theirs = ATK.recordOf(mech);
    if (!mine) return theirs; if (!theirs) return mine;
    return (mine.t || 0) >= (theirs.t || 0) ? mine : theirs;
  }, [mech, data]);

  /* 성별을 바꾸면 그 성별에 없는 카테고리는 갈음한다 (원본과 같은 규칙) */
  useEffect(() => {
    const rows = catRows(gender);
    setSt(o => {
      const p = { ...o.pairs }; let hit = false; const moved = [];
      [1, 2, 3].forEach(n => {
        if (p[n].key && !rows.some(r => r[0] === p[n].key)) {
          const alt = rows.find(r => r[0] !== 'auto_random' && r[0] !== '__custom__');
          p[n] = { ...p[n], key: alt ? alt[0] : '', exampleKey: '' }; hit = true;
          moved.push([n, alt ? alt[0] : '']);
        }
      });
      if (!hit) return o;
      const pn = { ...o.panels };
      moved.forEach(([n, v]) => [n * 2 - 1, n * 2].forEach(x => { pn[x] = { ...pn[x], cat: v, exampleKey: '' }; }));
      return { ...o, pairs: p, panels: pn };
    });
  }, [gender]);

  const state = useMemo(() => {
    const pairs = {}, panels = {};
    [1, 2, 3].forEach(n => {
      const q = st.pairs[n];
      pairs[n] = { use: q.use, key: q.key, custom: (q.custom || '').trim(),
        exampleKey: q.exampleKey, exampleCustom: (q.exampleCustom || '').trim(),
        expr: q.expr, orient: q.orient, pose: q.pose, adv: q.adv };
    });
    for (let n = 1; n <= 6; n++) {
      const p = st.panels[n];
      panels[n] = { cat: p.cat, catCustom: (p.catCustom || '').trim(),
        exampleKey: p.exampleKey, exampleCustom: p.exampleCustom, ov: p.ov };
    }
    return { pairs, panels };
  }, [st]);

  const prompt = useMemo(() => {
    if (!card) return '';
    const adv = {}; Object.keys(S.ADVANCED_OPTIONS).forEach(k => { if (st.adv[k]) adv[k] = st.adv[k]; });
    return AL.buildCollage({
      source: { mech: card.name }, gender, style, record,
      adv, panels: state, custom: st.custom.trim(),
      carryFace: st.carryFace, carryBody: st.carryBody,
      suppressed: [], globals: st.globals,
    });
  }, [card, gender, style, record, st, state]);

  /* 아래 띠에 지금 프롬프트와 단추를 등록한다 */
  useEffect(() => {
    onDock && onDock({
      text: prompt, status: status,
      preview: () => setShowText(v => !v),
      copy: () => copyText(prompt).then(() => { noteUse(); setStatus('클립보드에 복사했다 — 쓴 컷 기록에 쌓았다'); }, () => setStatus('복사에 실패했다')),
    });
  }, [prompt, status]);

  function push() { prev.current = JSON.parse(JSON.stringify(st)); setHasPrev(true); }
  function undo() {
    if (!prev.current) return;
    const now = JSON.parse(JSON.stringify(st));
    setSt(prev.current); prev.current = now;
    setStatus('직전 조합으로 되돌렸다. 한 번 더 누르면 원래대로.');
  }

  function applyPreset(key) {
    const p = S.PRESETS[key]; if (!p) return;
    push();
    const rows = catRows(gender); let swapped = 0;
    setSt(o => {
      const pairs = { ...o.pairs };
      [1, 2, 3].forEach((n, i) => {
        let want = p.pairs[i];
        if (!rows.some(r => r[0] === want)) {
          const alt = rows.find(r => r[0] !== 'auto_random' && r[0] !== '__custom__');
          if (alt) { want = alt[0]; swapped++; }
        }
        pairs[n] = { ...pairs[n], key: want, custom: '', exampleKey: '', exampleCustom: '' };
      });
      const panels = { ...o.panels };
      for (let x = 1; x <= 6; x++) panels[x] = { ...panels[x], cat: pairs[pairOf(x)].key, exampleKey: '' };
      return { ...o, preset: key, pairs, panels, adv: { ...(p.advanced || {}) } };
    });
    setStatus('프리셋 적용 완료' + (swapped ? ' — 지금 성별에 없는 카테고리 ' + swapped + '개는 갈음했다' : ''));
  }

  /* 랜덤 조합 — 세 Pair 에 서로 다른 카테고리를 돌린다 */
  function roll() {
    push();
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const T = st.tgt, rows = catRows(gender);
    const okCat = list => list.filter(c => rows.some(r => r[0] === c));
    const M = S.RANDOM_MODES[st.mode] || S.RANDOM_MODES.variety;
    let pool = shuffle(okCat([...(M.pool || S.RANDOM_POOL)])), note = M.ko + ' — ';
    if (pool.length < 3) pool = shuffle(okCat([...S.RANDOM_POOL]));
    if (st.avoid) {
      const used = {}; ATK.usedOf(mech).forEach(r => { used[r.cat] = 1; });
      const fresh = pool.filter(c => !used[c]), rest = shuffle(pool.filter(c => used[c]));
      if (fresh.length >= 3) { pool = fresh; note += '안 써본 카테고리 ' + fresh.length + '개 중에서 뽑았다'; }
      else if (fresh.length) { pool = fresh.concat(rest);
        note += '안 써본 건 ' + fresh.length + '개뿐이라 나머지 ' + (3 - fresh.length) + '개는 이미 쓴 것에서 채웠다'; }
      else note += '모든 카테고리를 이미 써봤다. 회피를 끄는 게 낫다';
    }
    if (note.endsWith('— ')) note += M.desc;
    setSt(o => {
      const pairs = { ...o.pairs };
      [1, 2, 3].forEach((n, i) => {
        let q = { ...pairs[n] };
        if (T.cat && pool[i]) { q.key = pool[i]; q.custom = ''; q.exampleKey = ''; }
        if (T.ex) {
          const cand = exRows(q.key, gender).map(r => r[0]).filter(v => v && v !== '__custom__');
          q.exampleKey = (cand.length && Math.random() < 0.75) ? pick(cand) : '';
        }
        if (T.expr) q.expr = pick(S.EXPRESSION_OPTIONS.filter(x => x[0]))[0];
        if (T.orient) q.orient = pick(S.ORIENTATION_OPTIONS.filter(x => x[0]))[0];
        if (T.pose) q.pose = pick(S.POSE_OPTIONS.filter(x => x[0]))[0];
        pairs[n] = q;
      });
      const g = { ...o.globals };
      if (T.frame) g.frame = pick(CLG_FRAMES.filter(x => x[0]))[0];
      const adv = T.adv ? { ...(M.adv || {}) } : o.adv;
      return { ...o, preset: 'free', pairs, globals: g, adv };
    });
    setStatus('랜덤 조합 생성 완료 🎲 · ' + note);
  }

  function reset() {
    push();
    const f = clgFresh();
    setSt(o => ({ ...f, mode: o.mode, tgt: o.tgt, avoid: o.avoid,
                  carryFace: o.carryFace, carryBody: o.carryBody, build: o.build }));
    setStatus('콜라주 설정을 초기화했다');
  }

  /* 복사하면 쓴 컷 기록에 쌓는다 — Pair 로 묶으면 한 번, 풀면 두 칸을 각각 */
  function noteUse() {
    if (!mech) return;
    const d = box.current.data;
    if (!d.used) d.used = {};
    const arr = d.used[mech] || (d.used[mech] = []);
    const now = Date.now();
    const add = (cat, ex) => {
      if (!cat || cat === '__custom__') return;
      const hit = arr.find(r => r.cat === cat && (r.ex || '') === (ex || ''));
      if (hit) { hit.n = (hit.n || 1) + 1; hit.t = now; }
      else arr.push({ cat: cat, ex: ex || '', n: 1, t: now });
    };
    [1, 2, 3].forEach(n => {
      const q = st.pairs[n];
      if (q.use) add(q.key, q.exampleKey);
      else [n * 2 - 1, n * 2].forEach(x => add(st.panels[x].cat || q.key, st.panels[x].exampleKey));
    });
    box.current.save(); setUsedTick(t => t + 1);
  }
  function clearUse() {
    const d = box.current.data;
    if (d.used) delete d.used[mech];
    box.current.save(); setUsedTick(t => t + 1);
    setStatus('이 기체의 쓴 컷 기록을 지웠다');
  }

  const used = useMemo(() => ATK.usedOf(mech), [mech, usedTick, data]);
  const advOn = Object.keys(S.ADVANCED_OPTIONS).filter(k => st.adv[k]).length;
  const tgtOn = CLG_TARGETS.filter(([k]) => st.tgt[k]).length;

  /* 한글 요약 — 세 Pair 가 무엇인지, 그리고 켜둔 것들 */
  const summary = (() => {
    const rows = [1, 2, 3].map(n => {
      const q = st.pairs[n];
      const cr = catRows(gender).find(r => r[0] === q.key);
      const er = exRows(q.key, gender).find(r => r[0] === q.exampleKey);
      return { n, use: q.use, ko: (cr ? cr[2] : q.key || '—'), ex: er ? er[2] : '' };
    });
    const flags = ['화풍 ' + ((S.ART_STYLES.find(r => r[0] === style) || ['', style])[1])];
    if (advOn) flags.push('고급 설정 ' + advOn + '개');

    if (carried) flags.push('의인화 설정 ' + carried + '개 전달');
    if (st.avoid && used.length) flags.push('이미 쓴 카테고리는 빼고 뽑는다');
    if (st.build === 'panel') flags.push('Panel 개별 모드');
    return { rows, flags };
  })();

  const optRows = rows => rows.map(([v, t]) => html`<option key=${v} value=${v}>${t}</option>`);
  const exGroups = (cat, extra) => ['basic', 'popular', 'special'].map(g => {

              <button type="button" key=${k} class=${'gt' + (st.build === k ? ' on' : '')}
                      onclick=${() => set('build', k)}>${ko}</button>`)}
          </div>

          ${st.build === 'pair' ? html`
            <div style="margin-top:10px">
              ${[1, 2, 3].map(n => {
                const q = st.pairs[n];
                return html`
                <details class="grp" key=${'p' + n} open=${true}>
                  <summary><span>PAIR ${n}<em class=${q.use ? 'on' : ''}>  Panel ${n * 2 - 1} ‹ Panel ${n * 2}</em></span>
                    <i>${q.use ? '묶음 — 약한 컷 / 강한 컷' : '풀림 — 두 칸이 따로 논다'}</i></summary>
                  <div class="grp-in">
                    <label style="display:flex;align-items:center;gap:7px;margin:0 0 8px;cursor:pointer;font-size:11.5px">
                      <input type="checkbox" checked=${q.use} style="width:auto;margin:0;flex:none"
                             onchange=${e => setPair(n, 'use', e.target.checked)} /><span>이 Pair 로 묶기</span></label>
                    <div class="field">
                      <label>Category <small>카테고리</small></label>
                      <select aria-label=${'Pair ' + n + ' 카테고리'} value=${q.key}
                              onchange=${e => setPairKey(n, e.target.value)}>
                        ${catRows(gender).map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]} — ${r[2]}</option>`)}
                      </select>
                      ${q.key === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="카테고리 직접 입력"
                        value=${q.custom} oninput=${e => setPair(n, 'custom', e.target.value)} />` : null}
                      ${S.CAT_KO[q.key] ? html`<div class="param-note" style="margin-top:4px">${S.CAT_KO[q.key]}</div>` : null}
                    </div>
                    <div class="field" style="margin-top:9px">
                      <label>Example Menu <small>예시 메뉴</small></label>

                      </select>
                      ${q.exampleKey === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="예시 직접 입력"
                        value=${q.exampleCustom} oninput=${e => setPair(n, 'exampleCustom', e.target.value)} />` : null}
                      ${q.exampleKey && S.EX_NOTE[q.exampleKey]
                        ? html`<div class="param-note" style="margin-top:4px">${S.EX_NOTE[q.exampleKey]}</div>` : null}
                    </div>
                    <div class="param-grid" style="margin-top:9px">
                      <div class="field"><label>Expression <small>표정 · 이 Pair 공통</small></label>
                        <select value=${q.expr} onchange=${e => setPair(n, 'expr', e.target.value)}>

                        <select value=${q.orient} onchange=${e => setPair(n, 'orient', e.target.value)}>

                      <div class="field"><label>Pose <small>포즈</small></label>
                        <select value=${q.pose} onchange=${e => setPair(n, 'pose', e.target.value)}>
                          ${optRows(S.POSE_OPTIONS)}</select></div>

                    <details class="grp" style="margin-top:9px">
                      <summary><span>세부 강도<em class=${S.PAIR_ONLY.concat(S.LOCAL_AXES).filter(k => q.adv[k]).length ? 'on' : ''}>

                          ? '  ' + S.PAIR_ONLY.concat(S.LOCAL_AXES).filter(k => q.adv[k]).length + ' 지정' : ''}</em></span>
                        <i>비워두면 전역 설정을 따른다 — 값이 있으면 이 Pair 에서만 덮는다</i></summary>
                      <div class="grp-in">

                    </details>
                  </div>
                </details>`;
              })}
            </div>`
          : html`
            <div style="margin-top:10px">
              <div class="gender-tabs" style="flex-wrap:wrap">
                ${[1, 2, 3, 4, 5, 6].map(n => html`
                  <button type="button" key=${'t' + n} class=${'gt' + (st.panelTab === n ? ' on' : '')}
                          onclick=${() => set('panelTab', n)}>${n}</button>`)}
              </div>
              ${(() => {
                const n = st.panelTab, p = st.panels[n];

                <div class="grp-in" style="margin-top:9px">

                            onchange=${e => { setPanel(n, 'cat', e.target.value); setPanel(n, 'exampleKey', ''); }}>
                      ${catRows(gender).map(r => html`<option key=${r[0]} value=${r[0]}>${r[1]} — ${r[2]}</option>`)}
                    </select>
                    ${p.cat === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="카테고리 직접 입력"
                      value=${p.catCustom} oninput=${e => setPanel(n, 'catCustom', e.target.value)} />` : null}
                  </div>
                  <div class="field" style="margin-top:9px">
                    <label>Panel Example <small>개별 예시</small></label>
                    <select aria-label=${'Panel ' + n + ' 예시'} value=${p.exampleKey}
                            onchange=${e => setPanel(n, 'exampleKey', e.target.value)}>
                      <option value="">AUTO — Pair 예시 따름</option>
                      ${exGroups(p.cat || st.pairs[pairOf(n)].key, true)}
                    </select>
                    ${p.exampleKey === '__custom__' ? html`<input type="text" style="margin-top:6px" placeholder="개별 예시 직접 입력"
                      value=${p.exampleCustom} oninput=${e => setPanel(n, 'exampleCustom', e.target.value)} />` : null}
                  </div>

                        ${optRows(S.EXPRESSION_OPTIONS)}</select></div>
                    <div class="field"><label>Body Orientation <small>앞/옆/뒷태 방향</small></label>
                      <select value=${p.ov.orientation || ''} onchange=${e => setOv(n, 'orientation', e.target.value)}>

                    <div class="field"><label>Pose <small>포즈</small></label>
                      <select value=${p.ov.pose || ''} onchange=${e => setOv(n, 'pose', e.target.value)}>
                        ${optRows(S.POSE_OPTIONS)}</select></div>
                  </div>
                  ${OV_TEXTS.map(([k, en, ko]) => html`
                    <div class="field" key=${k} style="margin-top:7px">
                      <label>${en} <small>${ko}</small></label>
                      <input type="text" placeholder="AUTO" value=${p.ov[k] || ''}
                             oninput=${e => setOv(n, k, e.target.value)} /></div>`)}
                  <details class="grp" style="margin-top:9px">
                    <summary><span>세부 강도<em class=${S.LOCAL_AXES.filter(k => p.ov['adv_' + k]).length ? 'on' : ''}>
                      ${S.LOCAL_AXES.filter(k => p.ov['adv_' + k]).length
                        ? '  ' + S.LOCAL_AXES.filter(k => p.ov['adv_' + k]).length + ' 지정' : ''}</em></span>
                      <i>비워두면 전역 설정을 따른다 — 값이 있으면 이 패널에서만 덮는다</i></summary>
                    <div class="grp-in">
                      ${S.LOCAL_AXES.map(k => axisField(k, p.ov['adv_' + k], v => setOv(n, 'adv_' + k, v)))}
                    </div>
                  </details>

              })()}
            </div>`}

          <details class="grp" style="margin-top:10px">
            <summary><span>콜라주 고급 설정<em class=${advOn ? 'on' : ''}>${advOn ? '  ' + advOn + ' 지정' : ''}</em></span>
              <i>여섯 칸 전체에 걸리는 값</i></summary>
            <div class="grp-in">
              ${Object.keys(S.ADVANCED_OPTIONS).map(k => axisField(k, st.adv[k], v => setAdv(k, v)))}
              <div class="field" style="margin-top:9px"><label>Expression Mode <small>표정 모드</small></label>
                <select value=${st.globals.expressionMode}
                        onchange=${e => setGlobal('expressionMode', e.target.value)}>${optRows(CLG_EXPR_MODES)}</select></div>
              <div class="field" style="margin-top:7px"><label>Body Orientation Mix <small>앞/옆/뒷태 비율</small></label>
                <select value=${st.globals.orientationMix}
                        onchange=${e => setGlobal('orientationMix', e.target.value)}>${optRows(CLG_ORIENT_MIX)}</select></div>
