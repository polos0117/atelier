<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141d">
<title>건담 드래프트 — 격납고</title>
<link rel="manifest" href="index.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="건담">
<link rel="apple-touch-icon" href="icon-index-180.png">
<link rel="icon" href="icon-index-192.png">
<link rel="stylesheet" href="gundam/hangar.css?v=85bf4c41a6">
<script defer src="lib/img.js"></script>
<script defer src="lib/fresh.js"></script>
<script defer src="gundam/hangar.js?v=9c006dfcf4"></script>
<script defer src="lib/sprite-actor.js?v=2"></script>
<script defer src="gundam/hangar-dots.js?v=2"></script>
<link rel="stylesheet" href="lib/sprite-actor.css?v=1">
<style>
/* 격납고 바닥의 도트(gundam/hangar-dots.js) — 메인 메뉴 위 띠. 이동 스틱 자리는 비운다(휴대폰은 왼쪽, PC 는 오른쪽에 스틱) */
.hangar-dots{position:absolute;z-index:2;left:150px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));height:132px;pointer-events:none}
.hangar-dots[hidden]{display:none}
.hangar-dots .sprite-actor{pointer-events:auto}
@media(min-width:601px){.hangar-dots{left:24px;right:190px;bottom:calc(120px + env(safe-area-inset-bottom))}}
@media(min-width:1000px){.hangar-dots{left:40px;right:200px;bottom:calc(122px + env(safe-area-inset-bottom))}}
@media(max-width:600px) and (min-height:551px){.hangar-dots{bottom:calc(70px + env(safe-area-inset-bottom))}}
@media(max-height:550px){.hangar-dots{left:180px;right:18px;bottom:82px;height:110px}}
</style>
</head>
<body>
<main id="hangar" aria-label="건담 격납고">
  <canvas id="hangarCanvas" tabindex="0" aria-label="3D 격납고. WASD 또는 방향키로 이동, Shift와 함께 누르는 좌우 방향키로 돌아보기, 드래그로 둘러보기"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <header class="masthead">
    <div class="brand"><h1>건담 드래프트</h1></div>
    <button id="optionsButton" class="small-button" aria-expanded="false" aria-controls="options">설정</button>
  </header>
  <section id="options" class="options" hidden aria-label="격납고 설정">
    <label>화질<select id="quality"><option value="balanced">균형 · 30fps</option><option value="low">절전 · 30fps</option><option value="high">선명 · 60fps</option></select></label>
    <label>전시 초상<select id="gender"><option value="f">여성</option><option value="m">남성</option></select></label>
    <button id="changeExhibits">다음 기체 전시</button>
    <button id="resetView">입구로 돌아가기</button>
    <button id="pauseButton" aria-pressed="false">3D 일시정지</button>
    <p>왼쪽 스틱으로 이동 · 화면을 드래그해 둘러보기<br>PC: WASD / 방향키로 이동 · Shift + ←/→로 돌아보기 · E로 가까운 전시 열기</p>
    <a href="/sam-atelier/">삼국지 쟁탈전</a>
  </section>
  <div id="loading" role="status" class="loading"><b>격납고를 여는 중…</b><span>아래 메뉴는 바로 이용할 수 있습니다.</span></div>
  <div class="bay-caption"><span id="bayCode" class="eyebrow">ARCHIVE PROJECTION</span><h2 id="bayName">기체 홀로그램</h2><a id="inspect" href="dex.html">도감 열기</a></div>
  <div class="reticle" aria-hidden="true">+</div>
  <div class="movement" id="movement"><div id="stick" role="group" aria-label="이동 스틱"><div id="stickKnob"></div><span>이동</span></div></div>
  <div class="look-hint" id="lookHint" aria-hidden="true"><span>↔</span>드래그로 둘러보기<small class="key-hint">키보드는 Shift + ←/→</small></div>
  <p id="notice" class="notice" role="status"></p>
  <div class="hangar-dots" id="hangarDots" role="group" aria-label="격납고 바닥 — 도트 기체가 거닌다" hidden></div>
  <nav class="launchpad" aria-label="메인 메뉴">
    <a href="dex.html"><strong>도감</strong><span class="nav-sub">기체 컬렉션</span></a>
    <a href="prompt.html"><strong>프롬프트</strong><span class="nav-sub">캐릭터 만들기</span></a>
    <a href="play.html" class="launch"><strong>드래프트</strong><span class="nav-sub">출격 준비</span></a>
  </nav>
  <noscript><p class="loading">3D 이동에는 JavaScript가 필요합니다. 아래 메뉴로 이동할 수 있습니다.</p></noscript>
</main>
</body>
</html>
