<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--deck:#151A21;--panel:#1D242D;--rule:#2C3742;--ink:#E4E9EF;--dim:#8794A3;--plate:#C9D2DC}
*{box-sizing:border-box}
body{margin:0;background:var(--deck);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.5;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:460px;margin:0 auto}
h1{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:.22em}
.sub{color:var(--dim);font-size:12px;letter-spacing:.08em;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;margin-bottom:22px}
a.item{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--rule);border-left:4px solid var(--cc,#79849A);
  border-radius:6px;padding:13px 15px;margin-bottom:9px}
a.item:active{background:#232B36}
a.item b{display:block;font-size:16px;font-weight:700;margin-bottom:2px}
a.item span{color:var(--dim);font-size:12.5px}
.note{color:var(--dim);font-size:12px;margin-top:20px;line-height:1.65}
</style>
</head>
<body>
<div class="wrap">
  <h1>건담 드래프트</h1>
  <div class="sub">POLOS0117 · GUNDAM-IMG</div>

  <a class="item" href="dex.html" style="--cc:#3E6C9C">
    <b>도감</b><span>513장 열람 · 의인화 / 일상 / 특별 / 작업</span></a>
  <a class="item" href="play.html" style="--cc:#B0463A">
    <b>건담 드래프트</b><span>본편</span></a>
  <a class="item" href="prompt.html" style="--cc:#7A5FA8">
    <b>프롬프트 툴킷</b><span>기체별 프롬프트 생성 · 프리셋</span></a>
  <a class="item" href="sam.html" style="--cc:#8C6A3E">
    <b>삼국지 드래프트</b><span>이전 작업 · 단일 파일</span></a>

  <div class="note">
    잔여 현황과 프롬프트 복사는 도감의 <b>작업</b> 탭에 들어갔다.<br>
    갱신했는데 옛날 화면이 보이면 주소 뒤에 <b>?v=2</b> 처럼 붙여서 다시 열면 된다.<br>
    게임 기록과 체크 상태는 이 주소 기준으로 따로 저장된다.
  </div>
</div>
<script>
/* ══ 새 판 살피기 ══
   홈 화면 앱에는 주소창도 새로고침 단추도 없다. 그래서 스스로 살핀다.
   본문을 통째로 다시 받으면 데이터가 아까우니 머리(HEAD)만 물어 표를 견준다.
   판이 한창일 수 있으니 제멋대로 갈아타지 않고, 띠를 띄워 누를 때 갈아탄다 */
(function(){
  var TAG=null, busy=false, shown=false;
  function stamp(r){return r.headers.get("etag")||r.headers.get("last-modified")||null}
  function look(){
    if(busy||shown||!window.fetch)return; busy=true;
    fetch(location.pathname+"?_="+Date.now(),{method:"HEAD",cache:"no-store"})
      .then(function(r){ busy=false; if(!r.ok)return;
        var t=stamp(r); if(!t)return;
        if(TAG===null){TAG=t;return}
        if(t!==TAG)band();
      }).catch(function(){busy=false});
  }
  function band(){
    if(shown)return; shown=true;
    var d=document.createElement("div");
    d.setAttribute("role","status");
    d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));"+
      "z-index:99999;background:#1b1f27;color:#f0ead8;border:1px solid #C9A227;border-radius:10px;"+
      "padding:12px 14px;font:600 14px/1.5 -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;"+
      "box-shadow:0 6px 22px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center";
    d.innerHTML='<span style="flex:1">새 판이 나왔습니다. 하던 것을 마치고 눌러 주세요.</span>'+
      '<button type="button" style="flex:none;background:#C9A227;color:#17130F;border:0;border-radius:7px;'+
      'padding:8px 12px;font:700 14px/1 inherit">갈아타기</button>'+
      '<button type="button" aria-label="닫기" style="flex:none;background:none;color:#8b8578;border:0;'+
      'font:700 18px/1 inherit;padding:4px 6px">×</button>';
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){
      var u=location.pathname+location.search;
      location.replace(u+(location.search?"&":"?")+"_v="+Date.now());
    };
    b[1].onclick=function(){d.remove();shown=false;TAG=null};
    document.body.appendChild(d);
  }
  look();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)look()});
  window.addEventListener("focus",look);
})();
</script>
</body>
</html>
