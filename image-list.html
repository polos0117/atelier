<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카드 이미지 생성 목록</title>
<style>
:root{
  --void:#12151B; --hull:#1A1F28; --plate:#242B37;
  --lume:#C9D3E1; --dim:#79849A; --amber:#E8A13A; --ok:#5FA88C; --alert:#D2483C;
  --line:rgba(201,211,225,.13);
  --disp:"Gothic A1",'Apple SD Gothic Neo',sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--lume);
  font-family:var(--disp);font-size:14px;line-height:1.5;
  -webkit-text-size-adjust:100%}
a{color:var(--amber);text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(18,21,27,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{margin:0 0 6px;font-size:15px;letter-spacing:.02em}
.bar{height:6px;background:var(--plate);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.sub{font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;
  justify-content:space-between;gap:8px}
.tools{display:flex;gap:6px;margin-top:8px}
input[type=search]{flex:1;min-width:0;background:var(--hull);border:1px solid var(--line);
  color:var(--lume);border-radius:6px;padding:7px 9px;font-size:13px;font-family:var(--disp)}
button{background:var(--hull);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:7px 10px;font-size:12px;font-family:var(--disp);cursor:pointer;
  white-space:nowrap}
button.on{color:var(--amber);border-color:rgba(232,161,58,.5);background:rgba(232,161,58,.08)}
nav{padding:10px 12px;border-bottom:1px solid var(--line)}
nav b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--dim);margin-bottom:7px}
nav .chips{display:flex;flex-wrap:wrap;gap:5px}
nav .chips button{display:inline-block;background:var(--hull);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-size:12px;color:var(--lume);font-family:var(--disp)}
nav .chips button:active{border-color:var(--amber)}
nav .chips button span{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:4px}
nav .chips button.full span{color:var(--ok)}
main{padding:0 12px 60px}
section{padding-top:14px}
h2{scroll-margin-top:64px;margin:14px 0 2px;font-size:16px;
  border-left:3px solid var(--amber);padding-left:8px}
.meta{font-family:var(--mono);font-size:10px;color:var(--dim);
  padding-left:11px;margin-bottom:8px}
h3{margin:14px 0 6px;font-size:12px;font-family:var(--mono);letter-spacing:.1em;
  color:var(--dim);display:flex;align-items:center;gap:8px}
h3 i{flex:1;height:1px;background:var(--line);font-style:normal}
.row{border:1px solid var(--line);border-left:3px solid var(--plate);
  background:var(--hull);border-radius:5px;padding:8px 10px;margin-bottom:6px}
.row.done{border-left-color:var(--ok);opacity:.55}
.row.half{border-left-color:var(--amber)}
.rh{display:flex;align-items:center;gap:8px}
.rh b{flex:1;font-size:13.5px;font-weight:700;word-break:keep-all}
.mk{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.bg{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:2px;font-style:normal;font-size:10px;letter-spacing:.06em;vertical-align:2px}
.bx{color:#c8a24a;border:1px solid #6b5424}
.bc{color:#7ea6c8;border:1px solid #3c5a72}

.mk s{color:var(--ok);text-decoration:none}
.note{font-size:10.5px;color:var(--dim);margin-top:2px}
.pm{font-family:var(--mono);font-size:10.5px;color:#94A0B6;background:#10141A;
  border:1px solid var(--line);border-radius:4px;padding:6px 7px;margin-top:6px;
  word-break:break-all;cursor:pointer;line-height:1.45}
.pm:active{border-color:var(--amber)}
.up{position:fixed;right:12px;bottom:14px;z-index:30;background:rgba(26,31,40,.95);
  border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12px;
  color:var(--dim);font-family:var(--disp)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:40;
  background:var(--plate);border:1px solid var(--line);border-radius:6px;
  padding:7px 13px;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--dim);font-size:12px;padding:20px 0;text-align:center}
</style></head><body>

<header>
  <h1>카드 이미지 생성 목록</h1>
  <div class="bar"><i id="pbar"></i></div>
  <div class="sub"><span id="pnum"></span><span id="pser"></span></div>
  <div class="tools">
    <input type="search" id="q" placeholder="카드 이름 찾기" autocomplete="off">
    <button id="todo">남은 것만</button>
  </div>
</header>

<nav><b>목차</b><div class="chips" id="toc"></div></nav>
<main id="main"></main>
<button class="up" id="up">위로</button>
<div class="toast" id="toast">프롬프트 복사됨</div>

function esc(s){return s.replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function slug(s){return "s_"+s.replace(/[^0-9A-Za-z가-힣]/g,"")}

function jump(nm){
  var el=document.getElementById(slug(nm)); if(!el)return;
  var head=document.querySelector("header");
  var top=el.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop)
          -(head?head.offsetHeight:0)-6;
  try{window.scrollTo({top:top,behavior:"smooth"})}catch(e){window.scrollTo(0,top)}
}
var allRows=[],doneN=0,totN=0;
DATA.forEach(function(s){s.groups.forEach(function(g){g.rows.forEach(function(r){
  allRows.push(r); totN++; if(r.f&&r.m)doneN++;
})})});

function statOf(s){var t=0,d=0;
  s.groups.forEach(function(g){g.rows.forEach(function(r){t++;if(r.f&&r.m)d++})});
  return [d,t]}

/* 목차 */
var toc=document.getElementById("toc");
DATA.forEach(function(s){
  var st=statOf(s),a=document.createElement("button");
  a.className=(st[0]===st[1]?"full":"");
  a.innerHTML=esc(s.name)+'<span>'+st[0]+'/'+st[1]+'</span>';
  a.onclick=(function(nm){return function(){jump(nm)}})(s.name);
  toc.appendChild(a);
});

/* 본문 */
var main=document.getElementById("main");
DATA.forEach(function(s){
  var st=statOf(s);
  var sec=document.createElement("section");
  sec.dataset.name=s.name;
  var h='<h2 id="'+slug(s.name)+'">'+esc(s.name)+'</h2>'+
        '<div class="meta">'+st[0]+' / '+st[1]+' 장 완료</div>';
  s.groups.forEach(function(g){
    h+='<h3>'+esc(g.kind)+' '+g.rows.length+' <i></i> '+esc(g.dir)+'</h3>';
    g.rows.forEach(function(r){
      var cls=r.f&&r.m?"done":(r.f||r.m?"half":"");
      h+='<div class="row '+cls+'" data-n="'+esc(r.name)+'" data-d="'+(r.f&&r.m?1:0)+'">'+
         '<div class="rh"><b>'+esc(r.name)+'</b>'+
         '<span class="mk">'+(r.f?'<s>♀</s>':'♀')+' '+(r.m?'<s>♂</s>':'♂')+

    });

});
