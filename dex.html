<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151A21">
<title>건담 도감</title>
<!-- 홈 화면에 두면 브라우저가 저장 자리를 걷어가지 못한다 -->
<link rel="manifest" href="dex.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="도감">
<link rel="apple-touch-icon" href="icon-dex-180.png">
<!--
  Preact + htm 으로 다시 쓴 도감. 빌드가 없다 — CDN 에서 모듈을 받아
  모듈 스크립트 안에서 바로 쓴다. 커밋하면 Pages 에 그대로 올라간다.

  자료 계층은 화면 밖에 있다. lib/img.js(그림 URL·img.json·컷 구조),
  lib/toolkit.js(툴킷 기록), lib/fresh.js(새 판 감지),
  generation/loader.js(기체별 기록). 툴킷·드래프트도 같은 것을 쓴다.

  예전 판은 dex-legacy.html 에 남겨 두었다. 되돌릴 일이 생기면 그 파일을
  dex.html 로 되돌리면 된다.
-->
<!-- 밀도·테마는 아래 lib/workspace-theme.js 가 머리에서 먼저 정한다 (그려지기 전) -->
<script src="lib/img.js"></script>
<script src="lib/toolkit.js"></script>
<script src="lib/fresh.js"></script>
<!-- 기체별 기록(generation/m-<해시>/) 읽기. 툴킷 설정과 그림별 제출 프롬프트 경로가 여기 있다 -->
<script src="generation/loader.js"></script>
<!-- 움직임 — lib/scene-motion.*(네 공방이 글자 하나 다르지 않게 나눠 쓴다)와 카드마다 입자를 고르는 lib/dex-motion.js -->
<link rel="stylesheet" href="lib/scene-motion.css?v=1">
<script src="lib/scene-motion.js?v=1"></script>
<script src="lib/dex-motion.js?v=1"></script>
<!-- 즐겨찾기 — lib/favorites.js(네 공방과 공방 모음이 글자 하나 다르지 않게 나눠 쓴다). 담은 그림은 공방 모음의 /favorites.html 이 모아 보여 준다 -->
<script src="lib/favorites.js?v=1"></script>
<!-- 도트 — lib/sprite-actor.js(공방 모음의 공용 재생기) · data/sprites.json. 도트가 있는 기체는 목록 칸에 「도트」 표, 상세 시트에 작은 무대 한 줄 -->
<script src="lib/sprite-actor.js?v=1"></script>
<link rel="stylesheet" href="lib/sprite-actor.css?v=1">
<style>
/* 도트 — 상세 시트의 작은 무대(바닥 위를 거닌다, 누르면 반응), 목록 칸의 「도트」 표(「새」는 왼쪽 위라 오른쪽 아래) */
.dex-dot{margin:12px 0 4px}.dex-dot[hidden]{display:none}
.dex-dot-stage{position:relative;height:150px;overflow:hidden;border:1px solid var(--line);border-radius:5px;
  background:linear-gradient(180deg,var(--panel) 0,var(--panel) 74%,color-mix(in srgb,var(--line) 80%,var(--panel)) 74%,var(--panel) 100%)}
.dot-badge{position:absolute;right:6px;bottom:6px;padding:3px 6px;border-radius:3px;background:#0c1a26e0;color:#9fd2e4;font-size:10px;font-weight:700;line-height:1.2;pointer-events:none}
/* 색·밀도 토큰은 lib/workspace.css 한 곳에 있다 — 여기 또 적으면 뒤에 실리는
   그쪽이 이겨 아무 일도 안 일어난다. --cc 만 그쪽에 없어 여기 남긴다 */
:root{--cc:#79849A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* 목록만 굴린다. 예전에는 문서 전체가 굴러서, 위로 돌아가려면 내비·밀도·제목까지
   거슬러 올라가야 했다. 화면을 세로로 둘로 나눠 머리말은 제자리에 두고
   목록에만 굴림을 준다. 폰은 주소창이 들락거려 100vh 가 실제보다 크므로
   dvh 를 먼저 쓰고 안 되는 브라우저만 vh 로 물러난다.
   대신 목록을 내려도 주소창이 접히지 않는다 — 머리말이 안 움직이는 값이다. */
body{
  background:var(--deck);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
#app{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.workspace-nav{display:flex;gap:var(--ui-gap);margin:0 0 8px;align-items:center;flex-wrap:wrap}
.workspace-nav a{flex:1;min-height:var(--ui-height);display:flex;align-items:center;justify-content:center;
  border:1px solid currentColor;border-radius:10px;text-decoration:none;color:inherit;
  font:600 var(--ui-small)/1.3 system-ui;opacity:.7}
.workspace-nav a[aria-current="page"]{opacity:1;background:rgba(125,160,205,.15)}
.density-control{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin:0 0 8px;
  font:11px/1.4 system-ui;color:var(--dim)}
.density-control select{width:auto;min-width:0;min-height:30px;padding:4px 7px;
  border:1px solid #79849a66;border-radius:7px;background:transparent;color:var(--ink);font:12px system-ui}
.density-control option{background:var(--panel);color:var(--ink)}
.tab,.sw button,.ctl input,.ctl select,.search-row input,.view-tools button,.sheet .bar button{
  min-height:var(--ui-height);font-size:var(--ui-font)}
.cap,.row .nm{font-size:var(--ui-font)}
.ctl,.view-tools{gap:var(--ui-gap)}
/* 내비·밀도·제목은 굴림 안쪽에 둬서 올리면 치워진다.
   탭과 검색은 목록 위에 붙박이로 남는다 — 굴러가는 상자(main) 기준의 sticky 라
   목록만 지나가고 이 줄은 제자리를 지킨다. 좌우 여백은 main 것을 되돌려
   붙박이 줄의 바탕이 화면 끝까지 닿게 한다 */
.chrome{padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:30;background:var(--deck);
  border-bottom:1px solid var(--rule);
  margin:0 -12px;padding:0 12px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.22em}
.brand .n{font-size:11px;color:var(--dim);letter-spacing:.1em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;
  font-weight:700;letter-spacing:.05em;padding:9px 12px 10px;border-bottom:2px solid transparent;cursor:pointer}
.tab b{font-weight:500;font-size:11px;opacity:.65;margin-left:4px}
.tab.on{color:var(--ink);border-bottom-color:var(--plate)}
.ctl{display:flex;gap:6px;padding:7px 0 0;flex-wrap:wrap}
.ctl:last-of-type{padding-bottom:9px}
.ctl input,.ctl select,.search-row input{background:var(--panel);border:1px solid var(--rule);
  color:var(--ink);font:inherit;font-size:13px;border-radius:6px;padding:7px 9px;min-width:0}
.ctl input{flex:1 1 auto}
/* 검색창은 .ctl 밖에 있어 예전에는 위 규칙이 안 걸렸다 — 바탕이 흰색으로 튀었다 */
.search-row input{width:100%}
.search-row input::placeholder{color:var(--dim)}
.search-row input:focus,.ctl input:focus,.ctl select:focus{
  outline:2px solid var(--plate);outline-offset:-1px}
.ctl select{flex:0 1 40%}
.sw{display:flex;flex:0 0 auto;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.sw.grow{flex:1 1 auto}
.sw.grow button{flex:1 1 0;padding:7px 4px}
.sw button{background:var(--panel);border:0;color:var(--dim);font:inherit;font-size:12px;
  font-weight:700;padding:0 10px;cursor:pointer}
.sw button.on{background:var(--plate);color:var(--void)}
.sw button.none{opacity:.45}
main{padding:0 12px 12px;flex:1 1 auto;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
/* 카드 크기는 dex.html 과 같은 값, 같은 저장 키(atelier_dex_compact_v1)를 쓴다.
   두 페이지를 오가도 설정이 따라온다 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:var(--gap)}
body.dex-compact .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.view-tools{display:flex;align-items:center;gap:6px;margin:12px 0 10px;font-size:11.5px;color:var(--dim)}
.view-tools span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-tools button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);
  font:inherit;font-size:11.5px;border-radius:6px;padding:6px 9px;cursor:pointer;flex:0 0 auto}
.view-tools button[disabled]{opacity:.4;cursor:default}
.cell{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  cursor:pointer;position:relative;border-left:3px solid var(--cc)}
.cell:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
/* 카드 전체를 누르는 자리는 이름 단추 하나다. ::after 를 카드 위에 펼치고, 다음 그림 단추만 그 위로 올린다 */
.cell-open{all:unset;display:inline;cursor:pointer;overflow-wrap:anywhere}
.cell-open::after{content:'';position:absolute;inset:0;z-index:1}
.cell-open:focus-visible{outline:none}
.cell-open:focus-visible::after{outline:2px solid var(--accent,var(--plate));outline-offset:3px;border-radius:4px}
.cell .pg{z-index:2}
.face{display:block;position:relative;width:100%;aspect-ratio:2/3;background:#11161C;overflow:hidden}
.face img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);
  font-size:10px;letter-spacing:.1em}
.pg{position:absolute;bottom:4px;right:4px;background:rgba(15,19,24,.5);color:var(--plate);
  font-size:9.5px;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;border:0;
  cursor:pointer;letter-spacing:.02em}
.pg:active{background:var(--plate);color:var(--void)}
.cap{padding:6px 7px 7px;font-size:11.5px;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--dim);font-size:13px}
.prog{height:3px;background:var(--rule);border-radius:99px;overflow:hidden;margin:0 0 8px}
.prog i{display:block;height:100%;background:var(--plate);transition:width .2s}
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--cc);
  border-radius:7px;padding:9px 11px;cursor:pointer}
.row.done{opacity:.5}
.row .top{display:flex;align-items:center;gap:7px}
.row .nm{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:3px;
  border:1px solid var(--rule);color:var(--dim);flex:0 0 auto}
.tag.hit{border-color:var(--cc);color:var(--plate)}
.row-tk{color:#8FB4D9;font-size:11px;margin-top:5px;line-height:1.5;
  border-left:2px solid rgba(143,180,217,.45);padding-left:7px}
.lnk{margin-top:6px}
.lnk a{color:#8FB4D9;font-size:11px;text-decoration:none}
.row-pr{color:var(--dim);font-size:11.5px;margin-top:4px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-nt{color:#9AA7B6;font-size:11px;margin-top:3px;font-style:italic}
.cp{margin-top:8px;background:var(--deck);border:1px solid var(--rule);color:var(--ink);
  font:inherit;font-size:11.5px;border-radius:6px;padding:6px 10px;cursor:pointer}
.gal img.on{outline:2px solid var(--plate);outline-offset:-2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;
  background:var(--plate);color:var(--void);font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:999px;pointer-events:none;
  max-width:calc(100vw - 24px);text-align:center}
.foot{padding:14px 12px 24px;color:var(--dim);font-size:11.5px;text-align:center}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(8,10,13,.95);display:flex;
  align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:4px}
.zpg{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(15,19,24,.55);
  color:var(--plate);font-size:11px;font-weight:700;line-height:1;padding:5px 9px;
  border-radius:999px;pointer-events:none}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(8,10,13,.72);display:flex;
  align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;overflow-y:auto;background:var(--deck);
  border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  /* 내용이 짧은 카드는 시트가 화면 아래쪽에만 붙어 손이 닿는 데까지 내려가 있었다.
     바닥 기준은 그대로 두고 위로 더 올라오게 최소 높이를 준다.
     폰은 주소창이 들락거려 100vh 가 실제 보이는 높이보다 크므로 dvh 를 먼저 쓰고,
     안 되는 브라우저만 vh 로 물러난다 */
  min-height:74vh; min-height:74dvh;
  max-height:94vh; max-height:94dvh;
  overscroll-behavior:contain}
.sheet .bar{position:sticky;top:0;background:var(--deck);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:8px;padding:12px 14px}
.sheet .bar .t{font-size:15px;font-weight:800;flex:1 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bar button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);
  font:inherit;font-size:12px;border-radius:6px;padding:6px 10px;cursor:pointer}
.sheet .body{padding:14px}
.art{width:100%;max-width:300px;margin:0 auto 12px;display:block;border-radius:10px;
  overflow:hidden;background:#11161C;cursor:zoom-in}
.art img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:center top}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--rule);
  color:var(--dim);letter-spacing:.02em}
.chip.f{border-color:var(--cc);color:var(--plate)}
.chip.mono{letter-spacing:.04em;opacity:.75}
.terr{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:2px 0 12px}
.terr u{text-decoration:none;color:var(--dim);margin-right:5px;font-size:10px}
.filter-toggle{background:var(--panel);color:var(--ink);border:1px solid var(--rule);
  border-radius:8px;min-height:var(--ui-height);padding:6px 10px;font:600 12px system-ui;
  cursor:pointer;flex:0 0 auto}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:7px 0 0}
.dt{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin-bottom:12px}
.dt b{color:var(--ink);font-weight:700;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:7px 8px;text-align:center}
.stat i{display:block;font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.06em}
.stat b{font-size:15px}
/* 시리즈·화풍은 한 줄에 둘이 나란히, 남는 너비를 반씩 나눠 쓴다.
   화풍 이름이 길어서 40% 로 묶으면 잘린다 */
.ctl.filters{flex-wrap:nowrap}
.ctl.filters select{flex:1 1 0;width:100%;min-width:0;text-overflow:ellipsis}
.sec{font-size:11px;color:var(--dim);letter-spacing:.08em;margin:0 0 6px}
/* 시트 안에서는 화풍 이름이 길다 ("한국형 글로시 게임 일러스트"). 머리말 필터처럼
   40% 로 묶으면 잘리므로, 성별 전환을 뺀 남는 너비를 전부 준다 */
.sheet .ctl{flex-wrap:nowrap;align-items:stretch;padding-bottom:12px}
.sheet .ctl select{flex:1 1 auto;width:100%;min-width:0;text-overflow:ellipsis}
.tk{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;
  font-size:12px;line-height:1.55;margin-bottom:12px}
.tk-used{color:var(--dim);margin-top:4px}
.tk-used > summary{cursor:pointer}
.tk-used > div{margin-top:3px}
.tk details{margin-top:6px}
.tk summary{cursor:pointer;color:var(--dim)}
.tk pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11.5px;margin:6px 0 0}
/* 어두운 바탕에서 브라우저 기본 링크색(짙은 파랑)은 거의 안 보인다 */
.sheet a{color:#8FB4D9;text-decoration:underline;text-underline-offset:2px}
.sheet a:active{color:var(--plate)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.gal img{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:50% 18%;
  border-radius:6px;display:block;background:var(--panel);cursor:zoom-in}
/* 즐겨찾기 — 큰 그림 아래 움직임 단추 옆. 담긴 그림은 하트가 찬다 */
.art-motion{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.art-motion .fav-heart[aria-pressed="true"]{border-color:var(--plate);color:var(--plate)}
.art-motion .fav-heart span{font-size:15px;line-height:1;margin-right:4px}
.art-motion .fav-heart:focus-visible,.sheet .art-motion .fav-count:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.sheet .art-motion .fav-count{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;color:var(--dim);font-size:12px;text-decoration:none;border-radius:3px}
.sheet .art-motion .fav-count:hover{color:var(--ink)}
@media (min-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  body.dex-compact .grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}
  .cap{font-size:13px;line-height:1.45}
}
</style>

<body class="dex-page">
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useLayoutEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

/* ── 자료 ───────────────────────────────────────────────
   dex.html 은 게임 코드와 배열 꼴을 공유하느라 c[0], c[1] 처럼 자리번호로 읽는다.
   여기서는 json 을 그대로 쓴다. 그림 쪽은 전부 lib/img.js 가 맡는다. */
const KINDS = [
  { tab: '기체',   file: 'mech'  },
  { tab: '파일럿', file: 'pilot' },
  { tab: '지휘관', file: 'crew'  },
  { tab: '함',     file: 'ship'  },
];
const MODES = [['p', '의인화'], ['c', '일상'], ['x', '특별'], ['w', '작업']];
/* 지형 적성 — 게임 쪽은 판마다 전장을 하나 뽑아 이 값으로 점수를 깎는다 */
const TERRAIN = ['', '부적합', '보통', '적합'];

function getJSON(name) {
  return fetch('data/' + name + '.json', { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(name + ' — ' + r.status);
    return r.json();
  });
}

function useAtelierData() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    Promise.all(KINDS.map(k => getJSON(k.file))
      .concat([getJSON('series'), getJSON('style'), getJSON('prompt'),
               /* 캐시에 남은 예전 lib/img.js 에는 loadAll 이 없다 — 날짜 없이 연다 */
               AIMG.loadAll ? AIMG.loadAll() : AIMG.load().then(img => ({ img, added: {} })),
               ATK.load(), ATK.loadGeneration()]))
      .then(res => {
        const cards = {}, stats = {};
        KINDS.forEach((k, i) => { cards[k.tab] = res[i].cards; stats[k.tab] = res[i].stats || []; });
        const n = KINDS.length;
        /* 화풍 이름표는 data/style.json 이 정본이다. 도감(dex.html)은 이걸 코드에
           베껴 두고 있어서 화풍이 늘면 두 군데를 고쳐야 했다 */
        const styleName = { unknown: '화풍 미상' };
        (res[n + 1].styles || []).forEach(x => { styleName[x.key] = x.name; });
        /* 프롬프트 문구·비고는 예전에 도감 파일 안에 박혀 있었다. data/prompt.json 으로
           빼서 도감과 툴킷이 같은 것을 읽는다 (build-prompt-json.py 가 내보낸다) */
        setData({
          cards, stats, series: res[n], styleName,
          prompt: res[n + 2].prompt || {}, memo: res[n + 2].memo || {},
          img: res[n + 3].img, added: res[n + 3].added,
        });
      })
      .catch(setErr);
  }, []);
  return { data, err };
}

/* 그림이 실제로 든 몫을 고른다. 기본 몫이 비고 화풍 몫에만 있는 카드가 있어서,
   이름으로 고르지 않고 내용으로 고른다 (dex.html 의 bucketOf 와 같은 규칙) */
/* 화풍 고르개의 특별한 값 — 그림이 한 장도 없는 카드만 본다.
   무엇을 아직 안 뽑았는지 찾을 때 쓴다 (작업 모드는 초상 두 장 기준이라 다르다) */
const NOPIC = '__none__';

function bucketOf(entry, style) {
  if (!entry) return null;
  const bs = AIMG.styleMap(entry);
  if (style && style !== NOPIC) {
    /* 화풍 미상 = 화풍 토막 없이 기본 자리에 있는 그림 */
    if (style === 'unknown') return AIMG.hasPic(entry) ? entry : null;
    return AIMG.hasPic(bs[style]) ? bs[style] : null;
  }
  if (AIMG.hasPic(entry)) return entry;
  for (const k in bs) if (AIMG.hasPic(bs[k])) return bs[k];
  return null;
}
/* 이 카드가 실제로 가진 화풍들 */
function stylesOf(entry) {
  if (!entry) return [];
  const bs = AIMG.styleMap(entry), out = [];
  for (const k in bs) if (AIMG.hasPic(bs[k])) out.push(k);
  if (AIMG.hasPic(entry)) out.push('unknown');
  return out;
}
/* 그림이 한 장도 없는 카드인가 */
function hasNoPic(entry) { return !stylesOf(entry).length; }
function shotsOfBucket(b, mode, v) {
  if (!b) return [];
  if (mode === 'c') return AIMG.cuts(b, 'casual', v);
  if (mode === 'x') return AIMG.cuts(b, 'extra', v);
  const pic = b[v] || b[v === 'm' ? 'f' : 'm'];
  return pic ? [pic] : [];
}
function shotsFor(entry, mode, v, style) {
  return shotsOfBucket(bucketOf(entry, style), mode, v);
}

/* 작업 현황 — 초상 남녀가 다 있으면 완료로 친다. 일상·특별은 고른 성별만 센다 */
function statOf(entry, style, v) {
  const b = bucketOf(entry, style) || {};
  return {
    m: !!b.m, f: !!b.f,
    c: AIMG.cuts(b, 'casual', v).length,
    x: AIMG.cuts(b, 'extra', v).length,
    done: !!(b.m && b.f),
  };
}

/* 한 카드가 여러 시리즈에 걸칠 수 있어 series 는 배열이다 (예: ["Z","ZZ"]) */
function serOf(card) {
  const s = card && card.series;
  return Array.isArray(s) ? s : (s ? [s] : []);
}

/* ── 새 그림 ─────────────────────────────────────────────
   data/img.json 의 added 가 파일마다 등록한 날을 들고 있다 (register-images.py).
   날짜를 모르는 파일은 거기 없으므로 최근 추가에도 「새」에도 걸리지 않는다.
   「새」는 이 브라우저가 지난번에 보고 간 뒤로 들어온 그림이다. 날짜가 하루 단위라
   본 것 가운데 가장 늦은 날짜와 그날 파일 목록을 같이 남긴다 — 같은 날 뒤에
   들어온 것도 놓치지 않는다. 처음 오면 아무것도 새로 치지 않는다(전부 새 그림이면
   표시가 뜻이 없다). 남기는 때는 화면을 떠날 때다 — 보는 동안에는 표시가 그대로 있다 */
const RECENT_DAYS = 7, RECENT_MAX = 24;
const SEEN_KEY = 'atelier_dex_seen_v1';
function readSeen() {
  try {
    const j = JSON.parse(localStorage.getItem(SEEN_KEY) || 'null');
    return j && typeof j.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(j.d) && Array.isArray(j.f) ? j : null;
  } catch (e) { return null; }
}
/* 자료를 받기 전에 읽어 둔다 — 떠날 때 덮어쓰므로 이번 방문 동안은 이 값으로 센다 */
const SEEN0 = readSeen();
function seenMark(added) {
  let d = '';
  for (const f in added) if (added[f] > d) d = added[f];
  return d ? { d, f: Object.keys(added).filter(f => added[f] === d) } : null;
}
function isNewSince(prev, f, d) { return !!prev && (d > prev.d || (d === prev.d && prev.f.indexOf(f) < 0)); }
/* 이 기기의 날짜 (YYYY-MM-DD) */
function localDay(t) {
  const z = new Date(t);
  return z.getFullYear() + '-' + String(z.getMonth() + 1).padStart(2, '0') + '-' + String(z.getDate()).padStart(2, '0');
}
function dayLabel(d) {
  if (d === localDay(Date.now())) return '오늘';
  if (d === localDay(Date.now() - 864e5)) return '어제';
  return (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일';
}
/* 파일 → 어느 카드·화풍·성별 몫인지. 최근 추가에서 누르면 시트를 그 그림에 맞춰 연다 */
function shotIndex(img) {
  const out = {};
  const put = (card, bucket, style) => ['f', 'm'].forEach(g => AIMG.shotsOf(bucket, g).forEach((f, i) => {
    if (!out[f]) out[f] = { card, style, gender: g, i };
  }));
  for (const card in img) {
    const bs = AIMG.styleMap(img[card]);
    for (const k in bs) put(card, bs[k], k);
    put(card, img[card], 'unknown');
  }
  return out;
}

/* ── 타일 ─────────────────────────────────────────────── */
function Cell({ name, color, shots, onOpen, subtitle, fresh }) {
  const [page, setPage] = useState(0), sprites = useSprites();
  const touch = useRef({ x: 0, y: 0, swiped: false });
  const i = shots.length ? ((page % shots.length) + shots.length) % shots.length : 0;
  const pic = shots[i];
  const step = d => setPage(p => p + d);

  const onStart = e => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY, swiped: false }; };
  const onEnd = e => {
    if (shots.length < 2) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      step(dx < 0 ? 1 : -1);
      touch.current.swiped = true;
    }
  };
  /* 마우스·터치로 열어도 이름 단추에 초점을 둔다 — 시트를 닫으면 초점이 이 카드로 돌아온다
     (Safari 는 누른 단추에 초점을 주지 않고, 카드 바깥 목록이 대신 받는다) */
  const openBtn = useRef(null);
  const onClick = () => {
    if (touch.current.swiped) { touch.current.swiped = false; return; }
    if (openBtn.current && document.activeElement !== openBtn.current) openBtn.current.focus({ preventScroll: true });
    onOpen();
  };

  return html`
    <div class="cell" data-card=${name} style=${{ '--cc': color }}
         ontouchstart=${onStart} ontouchend=${onEnd} onclick=${onClick}>
      <span class="face">
        ${pic
          ? html`<img key=${pic} width="800" height="1200" decoding="async" loading="lazy" src=${AIMG.thumbURL(pic)} alt=""
                   onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(pic); }} />`
          : html`<span class="ph">그림 없음</span>`}
        ${fresh ? html`<span class="new-badge" aria-hidden="true">새</span>` : null}
        ${SP && sprites && SP.actorFor(sprites, name) ? html`<span class="dot-badge" title=${DOT_TEXT.label}>${DOT_TEXT.badge}</span>` : null}
        ${shots.length > 1 && html`
          <button class="pg mono" aria-label="다음 그림"
                  onclick=${e => { e.stopPropagation(); step(1); }}>
            ${i + 1}/${shots.length}
          </button>`}
      </span>
      <div class="cap"><span class="card-meta">${subtitle}</span><strong><button type="button" class="cell-open" ref=${openBtn}>${name}</button></strong><i>${shots.length ? shots.length+'장의 그림' : '그림을 기다리는 중'}${fresh ? ' · 새 그림 ' + fresh + '장' : ''}</i></div>
    </div>`;
}

/* ── 알림 ─────────────────────────────────────────────
   복사처럼 화면이 안 바뀌는 동작은 뭐라도 띄워 주지 않으면 먹었는지 알 수 없다 */
function useToast() {
  const [msg, setMsg] = useState('');
  const timer = useRef(0);
  const show = text => {
    setMsg(text);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setMsg(''), 1500);
  };
  /* 알림 자리는 늘 깔아 둔다 — 화면 읽기 프로그램은 새로 생긴 칸의 말을 놓치기 쉽다 */
  const node = html`<div class="toast-live" role="status" aria-live="polite">${msg ? html`<div class="toast">${msg}</div>` : null}</div>`;
  return [node, show];
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fail(e); }
    ta.remove();
  });
}

/* ── 작업 목록 ─────────────────────────────────────────
   무엇이 아직 안 채워졌는지 보는 화면이라 그림 대신 현황을 줄로 늘어놓는다.
   완료 기준은 초상 남녀 두 장이다 (일상·특별은 끝이 없으므로 기준에서 뺀다) */
function WorkRow({ card, color, st, tkText, promptText, memo, styleText, onOpen }) {
  return html`
    <div class=${'row' + (st.done ? ' done' : '')} role="button" tabindex="0" onKeyDown=${e=>{if(e.target===e.currentTarget && ['Enter',' '].includes(e.key)){e.preventDefault();onOpen();}}}
         style=${{ '--cc': color }} onclick=${onOpen}>
      <div class="top">
        <span class="nm">${card.name}</span>
        <span class=${'tag' + (st.m ? ' hit' : '')}>남</span>
        <span class=${'tag' + (st.f ? ' hit' : '')}>여</span>
        ${st.c ? html`<span class="tag hit mono">일상 ${st.c}</span>` : null}
        ${st.x ? html`<span class="tag hit mono">특별 ${st.x}</span>` : null}
      </div>
      ${promptText && html`<div class="row-pr">${promptText}</div>`}
      ${memo && html`<div class="row-nt">${memo}</div>`}
      ${tkText && html`<div class="row-tk">${tkText.split('\n').map(l => html`<div>${l}</div>`)}</div>`}
      <div class="row-tk" style="border-left-color:rgba(143,180,217,.25)">화풍 · ${styleText}</div>
      <div class="lnk">
        <a href=${'prompt.html?mech=' + encodeURIComponent(card.name)}
           onclick=${e => e.stopPropagation()}>툴킷에서 열기 →</a>
      </div>
    </div>`;
}

/* ── 툴킷 기록 ─────────────────────────────────────────
   prompt.html 이 남긴 설정을 읽어 보여 준다. 기체별 기록(generation/m-<해시>/)은
   늦게 도착하므로 도착하면 다시 그린다. 읽기만 하고 쓰지 않는다. */
function Toolkit({ name }) {
  const summary = ATK.summaryOf(name);
  const used = ATK.usedOf(name);
  const notes = ATK.notesOf(name);
  if (!summary && !used.length && !notes.length) return null;

  return html`
    <p class="sec">툴킷 설정</p>
    <div class="tk">
      ${summary
        ? summary.split('\n').map(line => html`<div>${line}</div>`)
        : html`<div>저장된 설정이 없다</div>`}
      ${/* 뽑아본 카테고리는 접어 둔다 — 랜덤 회피의 근거라 기록은 남기지만,
           의인화 설정과 달리 다시 쓸 일이 없어 늘 펴 둘 값어치는 없다 */''}
      ${used.length ? html`
        <details class="tk-used">
          <summary>뽑아본 것 ${used.length}가지</summary>
          <div>${used.join(', ')}</div>
        </details>` : null}
      ${notes.map(x => html`
        <details><summary>추가 지시 · ${x.label}</summary><pre>${x.text}</pre></details>`)}
    </div>`;
}
/* ── 상세 시트 ─────────────────────────────────────────
   타일을 누르면 열린다. 카드 정보 + 그 카드가 가진 화풍을 고르는 자리 +
   고른 화풍·성별의 그림 목록. 그림을 누르면 확대로 넘긴다. */
function Sheet({ card, entry, tab, styleName, statLabels, seriesName, initialGender, initialStyle, initialPick,
                promptText, memo, onCopy, onZoom, onClose, onToast }) {
  const layer=useRef(),liveClose=useRef();liveClose.current=onClose;
  useLayoutEffect(()=>modalFocus(layer.current,()=>liveClose.current(),'.grid .cell-open'),[]);
  const mine = stylesOf(entry);
  /* 최근 추가에서 열면 그 그림이 든 화풍·성별로 시작한다 */
  const [style, setStyle] = useState(initialStyle && mine.indexOf(initialStyle) >= 0 ? initialStyle : (mine[0] || ''));
  /* 시트 안 남/여는 시트에서만 쓴다. 뒤 목록의 성별까지 끌고 가면
     상세를 잠깐 들여다본 것만으로 목록이 통째로 바뀐다 (기존 도감도 따로 둔다).
     시트에는 key 가 붙어 있어 다른 카드를 열면 목록 성별에서 다시 시작한다 */
  const [gender, setGender] = useState(initialGender);
  const bucket = bucketOf(entry, style);
  const other = gender === 'm' ? 'f' : 'm';
  const own = bucket && bucket[gender];
  /* 고른 성별 초상이 없으면 반대 성별 것을 대신 띄운다. 그 사실을 적어 두지 않으면
     "위에는 그림이 있는데 아래 목록은 비었다"로 보여 스크롤이 막힌 줄 알게 된다 */
  const portrait = own || (bucket && bucket[other]);
  const casual = AIMG.cuts(bucket, 'casual', gender);
  const extra = AIMG.cuts(bucket, 'extra', gender);
  const all = (own ? [own] : []).concat(casual, extra);
  const countOf = g => AIMG.shotsOf(bucket, g).length;
  /* 갤러리에서 고른 그림을 위에 크게 띄운다 (기존 도감과 같은 동작).
     화풍·성별을 바꾸면 그 화풍의 초상으로 되돌린다 */
  const [pick, setPick] = useState(initialPick || null);
  /* 처음 그릴 때는 건너뛴다 — 안 그러면 최근 추가에서 고른 그림이 바로 지워진다 */
  const firstPick = useRef(true);
  useEffect(() => { if (firstPick.current) { firstPick.current = false; return; } setPick(null); }, [style, gender]);

  /* 기체별 기록(generation/m-<해시>/)은 카드를 열 때 따로 받아 온다.
     툴킷 설정과 그림별 제출 프롬프트 경로가 여기 들어 있어, 도착하면 시트를
     통째로 다시 그린다. 예전에는 툴킷 칸 안에서만 다시 그려서, 늦게 온 기록이
     "원문 기록 없음"을 못 걷어냈다 */
  const [recTick, setRecTick] = useState(0);
  useEffect(() => {
    let live = true;
    const PMR = window.PerMechRecords;
    if (!PMR) return undefined;
    PMR.load(card.name).then(data => {
      ATK.putCardRecords(card.name, data);
      if (live) setRecTick(n => n + 1);
    }).catch(() => {});
    return () => { live = false; };
  }, [card.name]);
  const shown = (pick && all.indexOf(pick) >= 0) ? pick : portrait;
  const shownIdx = Math.max(0, all.indexOf(shown));
  const promptPath = useMemo(
    () => (shown ? ATK.promptPathOf(shown) : null), [shown, recTick]);

  /* 움직임 — 큰 그림에 켄 번스(같은 그림은 늘 같은 쪽으로 흐른다). 초상 ↔ 특별 컷은 열리기(reveal)와
     이 카드의 입자(lib/dex-motion.js — 우주 별·지상 먼지·빔 불꽃), 그 밖의 그림 바꾸기는 넘기기(turn).
     Preact 는 같은 img 의 주소만 바꾸므로 나가는 그림은 정지 사본(ghost)으로 깐다 */
  const artRef = useRef(null), lastShown = useRef(null), kbImg = useRef(null);
  const [motion, setMotion] = useState(() => !!MOTION && MOTION.enabled());
  useEffect(() => MOTION ? MOTION.subscribe(setMotion) : undefined, []);
  const motionLocked = !MOTION || MOTION.reduced();
  const kind = DEXM ? DEXM.kindOf(card) : 'sparks';
  const cutOf = f => (f === portrait ? 'portrait' : extra.indexOf(f) >= 0 ? 'extra' : 'casual');
  useLayoutEffect(() => {
    const prev = lastShown.current, img = artRef.current && artRef.current.querySelector('img');
    const now = shown && img ? { file: shown, cut: cutOf(shown), at: all.indexOf(shown), list: style + '|' + gender } : null;
    lastShown.current = now;
    if (!MOTION || !now) return;
    kbImg.current = img;
    const kb = { el: img, seed: now.file };
    if (!prev) { MOTION.kenBurns(img, kb); return; }
    if (prev.file === now.file) return;
    MOTION.stop(img);
    const from = MOTION.ghost(img, AIMG.imgURL(prev.file), { fit: 'contain' });
    const climax = prev.list === now.list && [prev.cut, now.cut].sort().join() === 'extra,portrait';
    if (climax) MOTION.reveal(from, img, { kind, removeFrom: true, key: 'dex-sheet', seed: now.file, kenBurns: kb });
    else MOTION.turn(from, img, { direction: prev.list === now.list && now.at < prev.at ? 'previous' : 'next',
                                  removeFrom: true, key: 'dex-sheet', kenBurns: kb });
  }, [shown]);
  useEffect(() => () => { if (MOTION) { MOTION.cancel('dex-sheet'); MOTION.stop(kbImg.current); } }, []);

  /* 즐겨찾기 — 큰 그림에 떠 있는 바로 그 그림. 주소에는 ?mech=&pic= 를 적어 공방 모음에서 누르면 이 그림으로 다시 연다 */
  const favs = useFavorites();
  const faved = !!shown && favs.some(x => x.a === 'gundam' && x.file === shown);
  const toggleFav = () => {
    if (!FAV || !shown) return;
    const cut = cutOf(shown), n = cut === 'casual' ? casual.indexOf(shown) + 1 : cut === 'extra' ? extra.indexOf(shown) + 1 : 0;
    const q = new URLSearchParams();
    if (tab && tab !== '기체') q.set('tab', tab);
    q.set('mech', card.name); q.set('pic', shown);
    const on = FAV.toggle({ a: 'gundam', key: card.name, file: shown, title: card.name,
      sub: FAV_TEXT.cut[cut] + (n ? ' ' + n : ''), thumb: AIMG.thumbURL(shown), full: AIMG.imgURL(shown),
      link: new URL('dex.html', location.href).pathname + '?' + q.toString() });
    if (onToast) onToast(on ? FAV_TEXT.added : faved ? FAV_TEXT.removed : FAV_TEXT.blocked);
  };

  return html`
    <div class="sheet-bg" onclick=${onClose}>
      <div ref=${layer} class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" onclick=${e => e.stopPropagation()}>
        <div class="bar">
          <h2 class="t" id="sheet-title">${card.name}</h2>
          <button data-dialog-close onclick=${onClose}>목록으로</button>
        </div>
        <div class="body">
          ${!mine.length && html`
            <div class="tk">
              아직 그림이 없는 카드다. 참고용으로 외부에서 원본 디자인을 찾아볼 수 있다
              (이미지를 가져오지 않는다 — 검색 결과 페이지로 넘어갈 뿐이다).
              <div class="lnk">
                <a href=${'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(card.name) + '+건담'}
                   target="_blank" rel="noopener">구글 이미지에서 찾아보기 →</a>
              </div>
              <div class="lnk">
                <a href=${'https://www.google.com/search?q=site%3Agundam.fandom.com+' + encodeURIComponent(card.name) + '+건담'}
                   target="_blank" rel="noopener">건담 위키에서 찾아보기 →</a>
              </div>
            </div>`}

<div class="detail-spread"><section class="artwork-panel">          ${shown
            ? html`<button type="button" class="art" ref=${artRef} data-particles=${kind} aria-label="크게 감상하기" onclick=${() => onZoom(all.length ? all : [shown], shownIdx)}>
                     ${/* 여기는 300px 폭으로 크게 그린다. 썸네일(긴 변 512)을 쓰면
                          고해상도 화면에서 흐릿해 목록 타일보다 화질이 나빠 보인다.
                          한 장뿐이니 원본을 받는다 — 목록은 장수가 많아 썸네일 유지 */''}
                     <img width="800" height="1200" src=${AIMG.imgURL(shown)} alt=${card.name} />
                   </button>`
            : html`<div class="empty">이 화풍에는 그림이 없다</div>`}
          ${shown && html`
            <p class="sec" style="text-align:center">
              ${promptPath
                ? html`<a href=${promptPath} target="_blank" rel="noopener">이 그림의 실제 제출 프롬프트 열기 →</a>`
                : '이 그림의 제출 프롬프트 · 원문 기록 없음'}
            </p>
            <p class="art-motion">
              <button type="button" class="fav-heart" id="dex-fav" aria-pressed=${faved} title=${FAV_TEXT.note}
                      disabled=${!FAV} onclick=${toggleFav}><span aria-hidden="true">${faved ? '♥' : '♡'}</span>${FAV_TEXT.label}</button>
              ${favs.length ? html`<a class="fav-count" id="dex-fav-count" href=${FAV_HUB}>${FAV_TEXT.count(favs.length)}</a>` : null}
              <button type="button" id="dex-motion" disabled=${motionLocked}
                      title=${motionLocked ? MOTION_TEXT.reduced : MOTION_TEXT.note}
                      onclick=${() => MOTION.setEnabled(!motion)}>${motion ? MOTION_TEXT.off : MOTION_TEXT.on}</button>
            </p>`}
          <${DotRow} key=${card.name} card=${card} />
          ${portrait && !own && html`
            <p class="sec" style="text-align:center">
              ${gender === 'm' ? '남성' : '여성'} 그림이 없어 ${gender === 'm' ? '여성' : '남성'} 초상을 대신 띄웠다
            </p>`}

</section><section class="story-panel"><p class="editorial-kicker">${serOf(card).map(seriesName).join(' · ')}</p><p class="persona">${card.name}</p>          <div class="ctl">
            ${mine.length > 1 && html`
              <select aria-label="화풍 필터" value=${style} onchange=${e => setStyle(e.target.value)}>
                ${mine.map(k => html`<option value=${k}>${styleName[k] || k}</option>`)}
              </select>`}
            <div class="sw">
              ${[['m', '남'], ['f', '여']].map(([g, label]) => html`
                <button class=${(gender === g ? 'on' : '') + (countOf(g) ? '' : ' none')}
                        onclick=${() => setGender(g)}>${label} ${countOf(g)}</button>`)}
            </div>
          </div>

          ${all.length > 1 && html`
            <p class="sec">${gender === 'm' ? '남성' : '여성'} ${all.length}장 · 일상 ${casual.length} · 특별 ${extra.length}</p>
            <div class="gal">
              ${all.map(f => html`
                <button type="button" class="art-thumb" aria-label=${card.name+' · '+(all.indexOf(f)+1)} aria-pressed=${f===shown} onclick=${()=>setPick(f)}><img key=${f} width="800" height="1200" loading="lazy" src=${AIMG.thumbURL(f)} alt="" title=${f}
                     class=${f === shown ? 'on' : ''}

                     onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(f); }} /></button>`)}
            </div>`}

          <div class="chips">
            ${(card.factions || []).map(f => html`<span class="chip f">${f}</span>`)}
            ${serOf(card).map(k => html`<span class="chip">${seriesName(k)}</span>`)}
            ${card.temper && html`<span class="chip">${card.temper}</span>`}
            ${card.system && html`<span class="chip">${card.system}</span>`}
            ${card.psy && html`<span class="chip">${card.psy}</span>`}
            ${card.models && html`<span class="chip mono">${card.models}</span>`}
          </div>

          ${card.terrain && html`
            <p class="sec">지형</p>
            <div class="terr">
              ${Object.keys(card.terrain).map(k => html`
                <span><u>${k}</u>${TERRAIN[card.terrain[k]] || '—'}</span>`)}
            </div>`}

          ${card.stats && html`<div class="stats">
            ${card.stats.map((n, i) => html`
              <div class="stat"><i>${statLabels[i] || ''}</i><b>${n}</b></div>`)}
          </div>`}

</section></div><section class="reading-notes">          ${(promptText || memo) && html`
            <p class="sec">프롬프트</p>
            <div class="tk">
              ${promptText ? html`<div>${promptText}</div>` : html`<div>문구가 없다</div>`}
              ${memo && html`<div class="tk-used">비고 · ${memo}</div>`}
              ${promptText && html`
                <button class="cp" onclick=${() => onCopy(card.name, promptText)}>문구 복사</button>`}
            </div>`}

          <${Toolkit} name=${card.name} />

          <div class="lnk">
            <a href=${'prompt.html?mech=' + encodeURIComponent(card.name)}>툴킷에서 열기 →</a>
          </div>
</section>
        </div>
      </div>
    </div>`;
}

/* ── 확대 ─────────────────────────────────────────────── */
function Zoom({ list, start, onClose }) {
 const [i,setI]=useState(start),layer=useRef(),live=useRef();live.current=onClose;
 const touch=useRef(null),step=d=>setI(p=>(p+d+list.length)%list.length);
 /* 원본 크기 — 제 픽셀 크기로 펼쳐 이 칸 안에서 민다. 예전엔 그림 파일을 새 창으로 열었는데, 홈 화면 앱에서는
    같은 앱 창에 그림만 떠서 돌아올 길이 없었다(2026-10-20). 넘기면 다시 화면에 맞춘다 */
 const [actual,setActual]=useState(false);
 useEffect(()=>setActual(false),[i]);
 useLayoutEffect(()=>modalFocus(layer.current,()=>live.current(),'.sheet .art'),[]);
 useLayoutEffect(()=>{const key=e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();step(e.key==='ArrowRight'?1:-1);}};addEventListener('keydown',key);return()=>removeEventListener('keydown',key);},[list.length]);
 return html`<div ref=${layer} class="zoom-layer" role="dialog" aria-modal="true" aria-label="크게 감상하기"><div class="zoom-bar"><b>일러스트 감상</b><span aria-live="polite">${i+1} / ${list.length}</span><button type="button" class="zoom-open" aria-pressed=${actual} onClick=${()=>setActual(v=>!v)}>${actual?'화면에 맞추기':'원본 크기'}</button><button class="zoom-close" data-dialog-close onClick=${onClose} aria-label="감상 닫기">✕</button></div><div class=${'zoom-body'+(actual?' actual':'')} onPointerDown=${e=>{if(!actual&&!e.target.closest('button'))touch.current={x:e.clientX,y:e.clientY};}} onPointerUp=${e=>{if(!touch.current)return;const dx=e.clientX-touch.current.x,dy=e.clientY-touch.current.y;touch.current=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);}} onPointerCancel=${()=>{touch.current=null;}}><img width="800" height="1200" src=${AIMG.imgURL(list[i])} alt="선택한 일러스트" draggable="false"/><div class="zoom-nav"><button class="zoom-prev" disabled=${list.length<2} onClick=${()=>step(-1)} aria-label="이전 그림">‹</button><button class="zoom-next" disabled=${list.length<2} onClick=${()=>step(1)} aria-label="다음 그림">›</button></div></div><div class="zoom-footer"><span class="viewer-keyboard">← → 그림 넘기기 · Esc 닫기</span><span class="viewer-touch">좌우로 밀어 그림 넘기기</span></div></div>`;
}

/* ── 화면 ─────────────────────────────────────────────── */
/* ── 주소 ───────────────────────────────────────────────
   탭·모드·성별·검색·시리즈·화풍은 주소에 남긴다(replaceState) — 새로고침하거나 주소를
   건네도 같은 목록이 뜬다. 상세 시트는 ?mech= 로 열고 pushState 로 한 칸을 쌓아,
   뒤로 가기가 사이트를 떠나지 않고 시트를 닫는다. 격납고는 ?mech=&gender= 로 걸어 온다 */
const URL0 = new URLSearchParams(location.search);
const fromURL = (k, ok, d) => { const x = URL0.get(k); return x !== null && ok(x) ? x : d; };
function dexURL({ tab, mode, v, q, ser, style, open }) {
  const p = new URLSearchParams();
  if (tab !== '기체') p.set('tab', tab);
  if (mode !== 'p') p.set('mode', mode);
  if (v !== 'f') p.set('gender', v);
  if (q.trim()) p.set('q', q.trim());
  if (ser) p.set('series', ser);
  if (style) p.set('style', style);
  if (open) p.set('mech', open.name);
  const qs = p.toString();
  return location.pathname + (qs ? '?' + qs : '') + location.hash;
}
function writeURL(how, url, state) {
  if (url === location.pathname + location.search + location.hash) return;
  try { history[how](state, '', url); } catch (e) { /* 너무 잦은 갱신은 브라우저가 막는다 — 주소만 못 남긴다 */ }
}

function App() {
  const { data, err } = useAtelierData();
  const [tab, setTab] = useState(() => fromURL('tab', x => KINDS.some(k => k.tab === x), '기체'));
  const [mode, setMode] = useState(() => fromURL('mode', x => MODES.some(m => m[0] === x), 'p'));
  const [v, setV] = useState(() => fromURL('gender', x => x === 'm' || x === 'f', 'f'));
  const [q, setQ] = useState(() => fromURL('q', () => true, ''));
  const [ser, setSer] = useState(() => fromURL('series', () => true, ''));
  const [style, setStyle] = useState(() => fromURL('style', () => true, ''));
  const [open, setOpen] = useState(null);
  /* 최근 추가에서 연 그림 {f, style, gender} — 시트가 그 그림부터 띄운다 */
  const [openAt, setOpenAt] = useState(null);
  /* 자료가 오기 전에 주소를 고쳐 쓰면 ?mech= 가 시트를 열기도 전에 지워진다 */
  const [urlReady, setUrlReady] = useState(false);
  const cardOf = (t, name) => (name && data && data.cards[t] || []).find(c => c.name === name) || null;
  // A hangar projection (or a shared link) opens the detail sheet directly.
  useEffect(() => {
    if (!data || urlReady) return;
    const card = cardOf(tab, URL0.get('mech'));
    /* ?pic= — 즐겨찾기(공방 모음)에서 온 주소. 그 그림이 든 화풍·성별로 연다 */
    const pic = URL0.get('pic'), at = card && pic && shotIdx[pic];
    if (at && at.card === card.name) setOpenAt({ f: pic, ...at });
    if (card) setOpen(card);
    setUrlReady(true);
  }, [data]);
  /* 이 문서가 쌓은 시트 칸인지. 새로고침 뒤 남은 history.state 로 back() 하면 페이지를 다시 읽는다 */
  const pushed = useRef(false);
  const openCard = (card, at) => {
    setOpenAt(at || null);
    setOpen(card);
    writeURL('pushState', dexURL({ tab, mode, v, q, ser, style, open: card }), { dexSheet: card.name });
    pushed.current = true;
  };
  const closeSheet = () => {
    if (pushed.current && history.state && history.state.dexSheet) { history.back(); return; }
    setOpen(null); setOpenAt(null); setZoom(null);
    writeURL('replaceState', dexURL({ tab, mode, v, q, ser, style, open: null }), null);
  };
  useEffect(() => {
    if (!urlReady) return;
    writeURL('replaceState', dexURL({ tab, mode, v, q, ser, style, open }), history.state);
  }, [urlReady, tab, mode, v, q, ser, style, open]);
  useEffect(() => {
    if (!data) return;
    const onPop = () => {
      const p = new URLSearchParams(location.search);
      const t = KINDS.some(k => k.tab === p.get('tab')) ? p.get('tab') : '기체';
      const card = (data.cards[t] || []).find(c => c.name === p.get('mech')) || null;
      setZoom(null); setOpenAt(null);
      if (card && t !== tab) setTab(t);
      setOpen(card);
      if (!card) pushed.current = false;
    };
    addEventListener('popstate', onPop);
    return () => removeEventListener('popstate', onPop);
  }, [data, tab]);
  const [zoom, setZoom] = useState(null);
  const [scrolled, setScrolled] = useState(false);
  const collection = useRef(null);
  /* 작게 보기 여부. dex.html 과 같은 키라 두 페이지가 설정을 공유한다 */
  const [onlyLeft, setOnlyLeft] = useState(true);   /* 작업 모드: 남은 것만 볼지 */
  /* 폰에서는 머리말이 화면을 많이 먹는다. 탭·모드·검색만 남기고 나머지는 접는다.
     걸린 조건이 있으면 단추에 개수가 붙어 접혀 있어도 알 수 있다 */
  const [showFilters, setShowFilters] = useState(false);
  /* 지난번 다녀간 뒤로 새 그림이 든 카드만 */
  const [newOnly, setNewOnly] = useState(false);
  const [toast, showToast] = useToast();
  /* 새 판이 올라오면 띠를 띄운다. 지금 판이 언제 것인지도 머리말에 적는다 */
  const [stamp, setStamp] = useState('');
  useEffect(() => { setStamp(window.AtelierFresh.watch().stamp()); }, []);
  const [compact, setCompact] = useState(() => {
    try { return localStorage.getItem('atelier_dex_compact_v1') === '1'; } catch (e) { return false; }
  });
  useEffect(() => {
    document.body.classList.toggle('dex-compact', compact);
    try { localStorage.setItem('atelier_dex_compact_v1', compact ? '1' : '0'); } catch (e) {}
  }, [compact]);

  /* 선택지는 지금 조건에 실제로 걸리는 것만 남기고 개수를 같이 보여 준다.
     화풍을 셀 때는 시리즈까지, 시리즈를 셀 때는 화풍까지 반영한다 —
     자기 자신은 빼고 세야 고른 뒤에도 목록에서 사라지지 않는다 */
  const shotIdx = useMemo(() => (data ? shotIndex(data.img) : {}), [data]);
  /* 카드 → 지난번 뒤로 새로 든 그림 장수 */
  const fresh = useMemo(() => {
    const out = {};
    if (!data || !SEEN0) return out;
    for (const f in data.added) {
      const at = shotIdx[f];
      if (at && isNewSince(SEEN0, f, data.added[f])) out[at.card] = (out[at.card] || 0) + 1;
    }
    return out;
  }, [data, shotIdx]);
  useEffect(() => {
    const mark = data && seenMark(data.added);
    if (!mark) return undefined;   /* 날짜가 하나도 없으면 남기지 않는다 — 다음에 전부 새 그림이 된다 */
    const save = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(mark)); } catch (e) {} };
    const onHide = () => { if (document.visibilityState === 'hidden') save(); };
    addEventListener('pagehide', save);
    document.addEventListener('visibilitychange', onHide);
    return () => { removeEventListener('pagehide', save); document.removeEventListener('visibilitychange', onHide); };
  }, [data]);
  /* 최근 추가 — 지금 탭의 카드 그림 가운데 지난 RECENT_DAYS 일 안에 등록된 것, 새것부터 */
  const recentAll = useMemo(() => {
    if (!data) return [];
    const names = new Set(data.cards[tab].map(c => c.name));
    const from = localDay(Date.now() - (RECENT_DAYS - 1) * 864e5);
    return Object.keys(data.added)
      .filter(f => data.added[f] >= from && shotIdx[f] && names.has(shotIdx[f].card))
      .sort((a, b) => data.added[b].localeCompare(data.added[a])
        || shotIdx[a].card.localeCompare(shotIdx[b].card, 'ko') || shotIdx[a].i - shotIdx[b].i)
      .map(f => ({ f, d: data.added[f], ...shotIdx[f] }));
  }, [data, tab, shotIdx]);

  const base = useMemo(() => {
    if (!data) return [];
    const needle = q.trim().toLowerCase();
    return data.cards[tab]
      .filter(c => !needle || c.name.toLowerCase().includes(needle))
      .filter(c => !newOnly || fresh[c.name])
      /* 작업 모드와 "그림 없음" 은 아직 없는 것을 보는 쪽이라 그림 유무로 거르지 않는다 */
      .filter(c => mode === 'p' || mode === 'w' || style === NOPIC
        || shotsFor(data.img[c.name], mode, v).length);
  }, [data, tab, q, mode, v, style, newOnly, fresh]);

  const styleCount = useMemo(() => {
    const cnt = {};
    base.filter(c => !ser || serOf(c).indexOf(ser) >= 0).forEach(c => {
      const ks = stylesOf(data && data.img[c.name]);
      if (!ks.length) cnt[NOPIC] = (cnt[NOPIC] || 0) + 1;
      ks.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; });
    });
    return cnt;
  }, [base, ser]);

  const serCount = useMemo(() => {
    const cnt = {};
    base.filter(c => !style || (style === NOPIC
        ? hasNoPic(data && data.img[c.name])
        : stylesOf(data && data.img[c.name]).indexOf(style) >= 0))
      .forEach(c => serOf(c).forEach(k => { cnt[k] = (cnt[k] || 0) + 1; }));
    return cnt;
  }, [base, style]);

  /* 탭을 바꾸면 시리즈·화풍은 비운다. 다른 탭에 없는 조건이 남아 빈 목록이 뜨는 걸 막는다 */
  /* 작업 줄에 "지금 이 줄이 어느 화풍인지" — 여럿이면 +N 으로 알린다 */
  const styleTextOf = name => {
    const ks = stylesOf(data.img[name]);
    if (!ks.length) return '그림 없음';
    const cur = (style && ks.indexOf(style) >= 0) ? style : ks[0];
    return (data.styleName[cur] || cur) + (ks.length > 1 ? ' +' + (ks.length - 1) : '');
  };
  const copyPrompt = (name, text) => {
    copyText(text).then(() => showToast('복사했다 · ' + name),
                        () => showToast('복사 실패'));
  };
  const pickTab = t => {
    setTab(t); setSer(''); setStyle(''); setNewOnly(false);
    if (collection.current) collection.current.scrollTop = 0;
    setScrolled(false);
  };

  const rows = useMemo(() => {
    if (!data) return [];
    return base
      .filter(c => !ser || serOf(c).indexOf(ser) >= 0)
      .filter(c => !style || (style === NOPIC
        ? hasNoPic(data.img[c.name])
        : stylesOf(data.img[c.name]).indexOf(style) >= 0))
      .map(c => ({ card: c, shots: shotsFor(data.img[c.name], mode, v, style) }))
      .filter(r => mode === 'p' || mode === 'w' || style === NOPIC || r.shots.length);
  }, [data, base, mode, v, ser, style]);


  if (err) return html`<div class="empty">자료를 못 읽었다 — ${String(err.message || err)}</div>`;
  if (!data) return html`<div class="empty">읽는 중…</div>`;

  const colorOf = c => {
    const f = c.factions && c.factions[c.factions.length - 1];
    return (data.series.faction_color && data.series.faction_color[f]) || '#79849A';
  };
  const seriesList = Object.keys(data.series.name || {}).filter(k => serCount[k]);
  const seriesName = k => (data.series.name && data.series.name[k]) || k || '—';
  const shown = rows.reduce((n, r) => n + (r.shots.length ? 1 : 0), 0);
  /* 진척은 필터에 걸린 모집단 기준. 남은 것만 보기로 걸러도 분모는 그대로다 */
  const work = rows.map(r => ({ ...r, st: statOf(data.img[r.card.name], style, v) }));
  const doneCount = work.filter(r => r.st.done).length;
  const workRows = onlyLeft ? work.filter(r => !r.st.done) : work;
  const styleList = Object.keys(data.styleName).filter(k => styleCount[k]);
  const bits = [];
  if (q.trim()) bits.push('"' + q.trim() + '"');
  if (ser) bits.push(seriesName(ser));
  if (style) bits.push(style === NOPIC ? '그림 없음' : (data.styleName[style] || style));
  if (newOnly) bits.push('새 그림만');
  const activeCount = bits.length;
  const freshCards = data.cards[tab].filter(c => fresh[c.name]).length;
  const filterCount = (ser ? 1 : 0) + (style ? 1 : 0) + (newOnly ? 1 : 0);
  /* 찾는 중에는 목록과 상관없는 줄이 끼지 않게 접는다 */
  const recent = mode !== 'w' && !activeCount ? recentAll.slice(0, RECENT_MAX) : [];
  const filterSummary = bits.length ? bits.join(' · ') : '전체 보기';

  return html`
    <main class=${scrolled ? 'dex-scrolled' : ''}>
      <div class="chrome">
      <div class="workspace-nav-row"><nav class="workspace-nav" aria-label="Atelier 화면 이동">
        <a href="index.html">격납고</a>
        <a href="prompt.html">프롬프트</a>
        <a href="play.html">드래프트</a>
        <a href="dex.html" aria-current="page">도감</a>
      </nav>
      <${AppearanceControls} /></div>
      <${WorkspaceHeading} title="건담 도감"
        subtitle="한 장씩 쌓아가는, 나만의 기체 컬렉션." />
      </div>

      <header>
      <div class="tabs">
        ${KINDS.map(k => html`
          <button class=${'tab' + (tab === k.tab ? ' on' : '')} onclick=${() => pickTab(k.tab)}>
            ${k.tab}<b class="mono">${data.cards[k.tab].length}</b>
          </button>`)}
      </div>
      <div class="ctl">
        <div class="sw grow">
          ${MODES.map(([m, label]) => html`
            <button class=${mode === m ? 'on' : ''} onclick=${() => setMode(m)}>${label}</button>`)}
        </div>
        ${mode === 'w'
          ? html`<div class="sw">
              ${[[true, '남은 것'], [false, '전체']].map(([on, label]) => html`
                <button class=${onlyLeft === on ? 'on' : ''} onclick=${() => setOnlyLeft(on)}>${label}</button>`)}
            </div>`
          : html`<div class="sw">
              ${[['m', '남'], ['f', '여']].map(([g, label]) => html`
                <button class=${v === g ? 'on' : ''} onclick=${() => setV(g)}>${label}</button>`)}
            </div>`}
      </div>
      <div class="search-row">
        <input aria-label="기체 이름 검색" placeholder="기체 이름으로 검색" value=${q} oninput=${e => setQ(e.target.value)} />
        <button type="button" class="filter-toggle" aria-expanded=${String(showFilters)}
                onclick=${() => setShowFilters(x => !x)}>
          필터${filterCount ? ' ' + filterCount : ''}
        </button>
      </div>

      ${showFilters && html`<div class="ctl filters">
        <select aria-label="시리즈 필터" value=${ser} onchange=${e => setSer(e.target.value)}>
          <option value="">시리즈 전체</option>
          ${seriesList.map(k => html`
            <option value=${k}>${seriesName(k)} ${serCount[k]}</option>`)}
        </select>
        <select aria-label="화풍 필터" value=${style} onchange=${e => setStyle(e.target.value)}>
          <option value="">화풍 전체</option>
          ${styleCount[NOPIC] ? html`
            <option value=${NOPIC}>그림 없음 ${styleCount[NOPIC]}</option>` : null}
          ${styleList.map(k => html`
            <option value=${k}>${data.styleName[k]} ${styleCount[k]}</option>`)}
        </select>
      </div>`}
      ${showFilters && (freshCards || newOnly) ? html`<div class="ctl">
        <button type="button" class="filter-toggle" aria-pressed=${String(newOnly)}
                onclick=${() => setNewOnly(x => !x)}>새 그림만 ${freshCards}</button>
      </div>` : null}
      </header>

      <div class="view-tools">
        <span>${filterSummary}<b class="collection-count">${mode === 'w' ? workRows.length : rows.length}</b></span>
        <button disabled=${!activeCount}
                onclick=${() => { setQ(''); setSer(''); setStyle(''); setNewOnly(false); }}>
          조건 초기화${activeCount ? ' ' + activeCount : ''}
        </button>
        <button aria-pressed=${compact} onclick=${() => setCompact(c => !c)}>
          ${compact ? '크게 보기' : '작게 보기'}
        </button>
      </div>
      <section class="collection-scroll" aria-label="도감 목록" tabindex="0" ref=${collection}
               onscroll=${event => setScrolled(event.currentTarget.scrollTop > 28)}>
      <section class="gallery-intro"><div><h2>강철에 깃든 새로운 얼굴</h2></div><p>기체의 개성과 의인화, 일상의 장면을 한 장씩 만나보세요.</p></section>
      ${recent.length ? html`
        <section class="recent-strip" aria-labelledby="recent-title">
          <div class="recent-head">
            <h2 id="recent-title">최근 추가</h2>
            <span>지난 ${RECENT_DAYS}일 · ${recentAll.length > recent.length ? recentAll.length + '장 가운데 ' + recent.length + '장' : recent.length + '장'}</span>
          </div>
          <ul class="recent-list">
            ${recent.map(r => html`
              <li key=${r.f}>
                <button type="button" class="recent-shot" data-file=${r.f} data-date=${r.d}
                        onclick=${e => { e.currentTarget.focus({ preventScroll: true }); openCard(cardOf(tab, r.card), r); }}>
                  <span class="recent-face">
                    <img width="800" height="1200" decoding="async" loading="lazy" src=${AIMG.thumbURL(r.f)} alt=""
                         onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(r.f); }} />
                  </span>
                  <span class="recent-name">${r.card}</span>
                  <span class="recent-day">${dayLabel(r.d)}</span>
                </button>
              </li>`)}
          </ul>
        </section>` : null}
      ${mode === 'w' && html`
        <div class="prog"><i style=${{ width: (rows.length ? doneCount / rows.length * 100 : 0).toFixed(1) + '%' }}></i></div>`}

      ${mode === 'w'
        ? (workRows.length
            ? html`<div class="rows">
                ${workRows.map(r => html`
                  <${WorkRow} key=${r.card.name} card=${r.card} color=${colorOf(r.card)} st=${r.st}
                              tkText=${ATK.summaryOf(r.card.name)}
                              promptText=${data.prompt[r.card.name] || ''}
                              memo=${data.memo[r.card.name] || ''}
                              styleText=${styleTextOf(r.card.name)}
                              onOpen=${() => openCard(r.card)} />`)}
              </div>`
            : html`<div class="empty">${onlyLeft ? '이 범위는 초상이 전부 채워졌다' : '해당하는 카드가 없다'}</div>`)
        : (rows.length
            ? html`<div class="grid">
                ${rows.map(r => html`
                  <${Cell} key=${r.card.name} name=${r.card.name} color=${colorOf(r.card)}
                           subtitle=${serOf(r.card).map(seriesName).join(' · ')} shots=${r.shots}
                           fresh=${fresh[r.card.name] || 0} onOpen=${() => openCard(r.card)} />`)}
              </div>`
            : html`<div class="empty">해당하는 카드가 없다</div>`)}
      <div class="foot mono">
        <span class="build-stamp">${stamp}</span>
        ${mode === 'w'
          ? '완료 ' + doneCount + ' / ' + rows.length + (onlyLeft ? ' · 남은 ' + (rows.length - doneCount) : '')
          : mode === 'p' ? shown + ' / ' + rows.length
          : rows.length + '장 · 그림 ' + shown}
      </div>
      </section>
    </main>

    ${open && html`
      <${Sheet} key=${open.name + (openAt ? '|' + openAt.f : '')} card=${open} entry=${data.img[open.name]} tab=${tab} styleName=${data.styleName}
                statLabels=${data.stats[tab] || []} seriesName=${seriesName}
                initialGender=${openAt ? openAt.gender : v}
                initialStyle=${openAt ? openAt.style : ''} initialPick=${openAt ? openAt.f : null}
                promptText=${data.prompt[open.name] || ''} memo=${data.memo[open.name] || ''}
                onCopy=${copyPrompt} onToast=${showToast}
                onZoom=${(list, i) => setZoom({ list, i })} onClose=${closeSheet} />`}

    ${zoom && html`<${Zoom} list=${zoom.list} start=${zoom.i} onClose=${() => setZoom(null)} />`}
    ${toast}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
