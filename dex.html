<!-- 홈 화면에 두면 브라우저가 저장 자리를 걷어가지 못한다 -->
<link rel="manifest" href="dex.webmanifest">

<!--
  Preact + htm 으로 다시 쓴 도감. 빌드가 없다 — CDN 에서 모듈을 받아
  모듈 스크립트 안에서 바로 쓴다. 커밋하면 Pages 에 그대로 올라간다.

  자료 계층은 화면 밖에 있다. lib/img.js(그림 URL·img.json·컷 구조),
  lib/toolkit.js(툴킷 기록), lib/fresh.js(새 판 감지),
  generation/loader.js(기체별 기록). 툴킷·드래프트도 같은 것을 쓴다.

  예전 판은 dex-legacy.html 에 남겨 두었다. 되돌릴 일이 생기면 그 파일을
  dex.html 로 되돌리면 된다.
-->
<!-- 밀도·테마는 아래 lib/workspace-theme.js 가 머리에서 먼저 정한다 (그려지기 전) -->
<script src="lib/img.js"></script>
<script src="lib/toolkit.js"></script>
<script src="lib/fresh.js"></script>
<!-- 기체별 기록(generation/m-<해시>/) 읽기. 툴킷 설정과 그림별 제출 프롬프트 경로가 여기 있다 -->
<script src="generation/loader.js"></script>
<style>
/* 색·밀도 토큰은 lib/workspace.css 한 곳에 있다 — 여기 또 적으면 뒤에 실리는
   그쪽이 이겨 아무 일도 안 일어난다. --cc 만 그쪽에 없어 여기 남긴다 */
:root{--cc:#79849A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* 목록만 굴린다. 예전에는 문서 전체가 굴러서, 위로 돌아가려면 내비·밀도·제목까지
   거슬러 올라가야 했다. 화면을 세로로 둘로 나눠 머리말은 제자리에 두고
   목록에만 굴림을 준다. 폰은 주소창이 들락거려 100vh 가 실제보다 크므로
   dvh 를 먼저 쓰고 안 되는 브라우저만 vh 로 물러난다.
   대신 목록을 내려도 주소창이 접히지 않는다 — 머리말이 안 움직이는 값이다. */
body{
  background:var(--deck);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
#app{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.workspace-nav{display:flex;gap:var(--ui-gap);margin:0 0 8px;align-items:center;flex-wrap:wrap}
.workspace-nav a{flex:1;min-height:var(--ui-height);display:flex;align-items:center;justify-content:center;
  border:1px solid currentColor;border-radius:10px;text-decoration:none;color:inherit;
  font:600 var(--ui-small)/1.3 system-ui;opacity:.7}
.workspace-nav a[aria-current="page"]{opacity:1;background:rgba(125,160,205,.15)}
.density-control{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin:0 0 8px;
  font:11px/1.4 system-ui;color:var(--dim)}
.density-control select{width:auto;min-width:0;min-height:30px;padding:4px 7px;
  border:1px solid #79849a66;border-radius:7px;background:transparent;color:var(--ink);font:12px system-ui}
.density-control option{background:var(--panel);color:var(--ink)}
.tab,.sw button,.ctl input,.ctl select,.search-row input,.view-tools button,.sheet .bar button{
  min-height:var(--ui-height);font-size:var(--ui-font)}
.cap,.row .nm{font-size:var(--ui-font)}
.ctl,.view-tools{gap:var(--ui-gap)}
/* 내비·밀도·제목은 굴림 안쪽에 둬서 올리면 치워진다.
   탭과 검색은 목록 위에 붙박이로 남는다 — 굴러가는 상자(main) 기준의 sticky 라
   목록만 지나가고 이 줄은 제자리를 지킨다. 좌우 여백은 main 것을 되돌려
   붙박이 줄의 바탕이 화면 끝까지 닿게 한다 */
.chrome{padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:30;background:var(--deck);
  border-bottom:1px solid var(--rule);
  margin:0 -12px;padding:0 12px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.22em}
.brand .n{font-size:11px;color:var(--dim);letter-spacing:.1em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;

.tab.on{color:var(--ink);border-bottom-color:var(--plate)}

.ctl:last-of-type{padding-bottom:9px}
.ctl input,.ctl select,.search-row input{background:var(--panel);border:1px solid var(--rule);

.search-row input{width:100%}
.search-row input::placeholder{color:var(--dim)}
.search-row input:focus,.ctl input:focus,.ctl select:focus{

.sw{display:flex;flex:0 0 auto;border:1px solid var(--rule);border-radius:6px;overflow:hidden}

.view-tools button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);

.view-tools button[disabled]{opacity:.4;cursor:default}
.cell{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  cursor:pointer;position:relative;border-left:3px solid var(--cc)}
.cell:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.face{display:block;position:relative;width:100%;aspect-ratio:2/3;background:#11161C;overflow:hidden}

.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--cc);

.row.done{opacity:.5}

.row .nm{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.row-tk{color:#8FB4D9;font-size:11px;margin-top:5px;line-height:1.5;

.lnk{margin-top:6px}
.lnk a{color:#8FB4D9;font-size:11px;text-decoration:none}
.row-pr{color:var(--dim);font-size:11.5px;margin-top:4px;line-height:1.45;

.row-nt{color:#9AA7B6;font-size:11px;margin-top:3px;font-style:italic}
.cp{margin-top:8px;background:var(--deck);border:1px solid var(--rule);color:var(--ink);

.gal img.on{outline:2px solid var(--plate);outline-offset:-2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;

.foot{padding:14px 12px 24px;color:var(--dim);font-size:11.5px;text-align:center}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(8,10,13,.95);display:flex;

.ctl.filters{flex-wrap:nowrap}

}

<body class="dex-page">
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

import { AppearanceControls, WorkspaceHeading } from './lib/workspace-ui.js?v=35b82ca682';

const html = htm.bind(h);
const AIMG = window.AtelierImg;
const ATK = window.AtelierToolkit;

/* ── 자료 ───────────────────────────────────────────────
   dex.html 은 게임 코드와 배열 꼴을 공유하느라 c[0], c[1] 처럼 자리번호로 읽는다.
   여기서는 json 을 그대로 쓴다. 그림 쪽은 전부 lib/img.js 가 맡는다. */
const KINDS = [
  { tab: '기체',   file: 'mech'  },
  { tab: '파일럿', file: 'pilot' },
  { tab: '지휘관', file: 'crew'  },
  { tab: '함',     file: 'ship'  },
];
const MODES = [['p', '의인화'], ['c', '일상'], ['x', '특별'], ['w', '작업']];
/* 지형 적성 — 게임 쪽은 판마다 전장을 하나 뽑아 이 값으로 점수를 깎는다 */
const TERRAIN = ['', '부적합', '보통', '적합'];

function getJSON(name) {
  return fetch('data/' + name + '.json', { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(name + ' — ' + r.status);
    return r.json();
  });
}

function useAtelierData() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    Promise.all(KINDS.map(k => getJSON(k.file))
      .concat([getJSON('series'), getJSON('style'), getJSON('prompt'), AIMG.load(),
               ATK.load(), ATK.loadGeneration()]))
      .then(res => {
        const cards = {}, stats = {};
        KINDS.forEach((k, i) => { cards[k.tab] = res[i].cards; stats[k.tab] = res[i].stats || []; });
        const n = KINDS.length;
        /* 화풍 이름표는 data/style.json 이 정본이다. 도감(dex.html)은 이걸 코드에
           베껴 두고 있어서 화풍이 늘면 두 군데를 고쳐야 했다 */
        const styleName = { unknown: '화풍 미상' };
        (res[n + 1].styles || []).forEach(x => { styleName[x.key] = x.name; });
        /* 프롬프트 문구·비고는 예전에 도감 파일 안에 박혀 있었다. data/prompt.json 으로
           빼서 도감과 툴킷이 같은 것을 읽는다 (build-prompt-json.py 가 내보낸다) */
        setData({
          cards, stats, series: res[n], styleName,
          prompt: res[n + 2].prompt || {}, memo: res[n + 2].memo || {},
          img: res[n + 3],
        });
      })
      .catch(setErr);
  }, []);
  return { data, err };
}

/* 그림이 실제로 든 몫을 고른다. 기본 몫이 비고 화풍 몫에만 있는 카드가 있어서,
   이름으로 고르지 않고 내용으로 고른다 (dex.html 의 bucketOf 와 같은 규칙) */
/* 화풍 고르개의 특별한 값 — 그림이 한 장도 없는 카드만 본다.
   무엇을 아직 안 뽑았는지 찾을 때 쓴다 (작업 모드는 초상 두 장 기준이라 다르다) */
const NOPIC = '__none__';

function bucketOf(entry, style) {
  if (!entry) return null;
  const bs = AIMG.styleMap(entry);
  if (style && style !== NOPIC) {
    /* 화풍 미상 = 화풍 토막 없이 기본 자리에 있는 그림 */
    if (style === 'unknown') return AIMG.hasPic(entry) ? entry : null;
    return AIMG.hasPic(bs[style]) ? bs[style] : null;
  }
  if (AIMG.hasPic(entry)) return entry;
  for (const k in bs) if (AIMG.hasPic(bs[k])) return bs[k];
  return null;
}
/* 이 카드가 실제로 가진 화풍들 */
function stylesOf(entry) {
  if (!entry) return [];
  const bs = AIMG.styleMap(entry), out = [];
  for (const k in bs) if (AIMG.hasPic(bs[k])) out.push(k);
  if (AIMG.hasPic(entry)) out.push('unknown');
  return out;
}
/* 그림이 한 장도 없는 카드인가 */
function hasNoPic(entry) { return !stylesOf(entry).length; }
function shotsOfBucket(b, mode, v) {
  if (!b) return [];
  if (mode === 'c') return AIMG.cuts(b, 'casual', v);
  if (mode === 'x') return AIMG.cuts(b, 'extra', v);
  const pic = b[v] || b[v === 'm' ? 'f' : 'm'];
  return pic ? [pic] : [];
}
function shotsFor(entry, mode, v, style) {
  return shotsOfBucket(bucketOf(entry, style), mode, v);
}

/* 작업 현황 — 초상 남녀가 다 있으면 완료로 친다. 일상·특별은 고른 성별만 센다 */
function statOf(entry, style, v) {
  const b = bucketOf(entry, style) || {};
  return {
    m: !!b.m, f: !!b.f,
    c: AIMG.cuts(b, 'casual', v).length,
    x: AIMG.cuts(b, 'extra', v).length,
    done: !!(b.m && b.f),
  };
}

/* 한 카드가 여러 시리즈에 걸칠 수 있어 series 는 배열이다 (예: ["Z","ZZ"]) */
function serOf(card) {
  const s = card && card.series;
  return Array.isArray(s) ? s : (s ? [s] : []);
}

/* ── 타일 ─────────────────────────────────────────────── */
function Cell({ name, color, shots, onOpen }) {
  const [page, setPage] = useState(0);
  const touch = useRef({ x: 0, y: 0, swiped: false });
  const i = shots.length ? ((page % shots.length) + shots.length) % shots.length : 0;
  const pic = shots[i];
  const step = d => setPage(p => p + d);

  const onStart = e => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY, swiped: false }; };
  const onEnd = e => {
    if (shots.length < 2) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      step(dx < 0 ? 1 : -1);
      touch.current.swiped = true;
    }
  };
  const onClick = () => {
    if (touch.current.swiped) { touch.current.swiped = false; return; }
    onOpen();
  };

  return html`
    <div class="cell" tabindex="0" style=${{ '--cc': color }}
         ontouchstart=${onStart} ontouchend=${onEnd} onclick=${onClick}>
      <span class="face">
        ${pic
          ? html`<img loading="lazy" src=${AIMG.thumbURL(pic)} alt=""
                   onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(pic); }} />`
          : html`<span class="ph">그림 없음</span>`}
        ${shots.length > 1 && html`
          <button class="pg mono" aria-label="다음 그림"
                  onclick=${e => { e.stopPropagation(); step(1); }}>
            ${i + 1}/${shots.length}
          </button>`}
      </span>
      <div class="cap">${name}</div>
    </div>`;
}

/* ── 알림 ─────────────────────────────────────────────
   복사처럼 화면이 안 바뀌는 동작은 뭐라도 띄워 주지 않으면 먹었는지 알 수 없다 */
function useToast() {
  const [msg, setMsg] = useState('');
  const timer = useRef(0);
  const show = text => {
    setMsg(text);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setMsg(''), 1500);
  };
  const node = msg ? html`<div class="toast">${msg}</div>` : null;
  return [node, show];
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fail(e); }
    ta.remove();
  });
}

/* ── 작업 목록 ─────────────────────────────────────────
   무엇이 아직 안 채워졌는지 보는 화면이라 그림 대신 현황을 줄로 늘어놓는다.
   완료 기준은 초상 남녀 두 장이다 (일상·특별은 끝이 없으므로 기준에서 뺀다) */
function WorkRow({ card, color, st, tkText, promptText, memo, styleText, onOpen }) {
  return html`
    <div class=${'row' + (st.done ? ' done' : '')} tabindex="0"
         style=${{ '--cc': color }} onclick=${onOpen}>
      <div class="top">
        <span class="nm">${card.name}</span>
        <span class=${'tag' + (st.m ? ' hit' : '')}>남</span>
        <span class=${'tag' + (st.f ? ' hit' : '')}>여</span>
        ${st.c ? html`<span class="tag hit mono">일상 ${st.c}</span>` : null}
        ${st.x ? html`<span class="tag hit mono">특별 ${st.x}</span>` : null}
      </div>
      ${promptText && html`<div class="row-pr">${promptText}</div>`}
      ${memo && html`<div class="row-nt">${memo}</div>`}
      ${tkText && html`<div class="row-tk">${tkText.split('\n').map(l => html`<div>${l}</div>`)}</div>`}
      <div class="row-tk" style="border-left-color:rgba(143,180,217,.25)">화풍 · ${styleText}</div>
      <div class="lnk">
        <a href=${'prompt.html?mech=' + encodeURIComponent(card.name)}
           onclick=${e => e.stopPropagation()}>툴킷에서 열기 →</a>
      </div>
    </div>`;
}

/* ── 툴킷 기록 ─────────────────────────────────────────
   prompt.html 이 남긴 설정을 읽어 보여 준다. 기체별 기록(generation/m-<해시>/)은
   늦게 도착하므로 도착하면 다시 그린다. 읽기만 하고 쓰지 않는다. */
function Toolkit({ name }) {
  const summary = ATK.summaryOf(name);
  const used = ATK.usedOf(name);
  const notes = ATK.notesOf(name);
  if (!summary && !used.length && !notes.length) return null;

  return html`
    <p class="sec">툴킷 설정</p>
    <div class="tk">
      ${summary
        ? summary.split('\n').map(line => html`<div>${line}</div>`)
        : html`<div>저장된 설정이 없다</div>`}
      ${/* 뽑아본 카테고리는 접어 둔다 — 랜덤 회피의 근거라 기록은 남기지만,
           의인화 설정과 달리 다시 쓸 일이 없어 늘 펴 둘 값어치는 없다 */''}
      ${used.length ? html`
        <details class="tk-used">
          <summary>뽑아본 것 ${used.length}가지</summary>
          <div>${used.join(', ')}</div>
        </details>` : null}
      ${notes.map(x => html`
        <details><summary>추가 지시 · ${x.label}</summary><pre>${x.text}</pre></details>`)}
    </div>`;
}
/* ── 상세 시트 ─────────────────────────────────────────
   타일을 누르면 열린다. 카드 정보 + 그 카드가 가진 화풍을 고르는 자리 +
   고른 화풍·성별의 그림 목록. 그림을 누르면 확대로 넘긴다. */
function Sheet({ card, entry, styleName, statLabels, seriesName, initialGender,
                promptText, memo, onCopy, onZoom, onClose }) {
  const mine = stylesOf(entry);
  const [style, setStyle] = useState(mine[0] || '');
  /* 시트 안 남/여는 시트에서만 쓴다. 뒤 목록의 성별까지 끌고 가면
     상세를 잠깐 들여다본 것만으로 목록이 통째로 바뀐다 (기존 도감도 따로 둔다).
     시트에는 key 가 붙어 있어 다른 카드를 열면 목록 성별에서 다시 시작한다 */
  const [gender, setGender] = useState(initialGender);
  const bucket = bucketOf(entry, style);
  const other = gender === 'm' ? 'f' : 'm';
  const own = bucket && bucket[gender];
  /* 고른 성별 초상이 없으면 반대 성별 것을 대신 띄운다. 그 사실을 적어 두지 않으면
     "위에는 그림이 있는데 아래 목록은 비었다"로 보여 스크롤이 막힌 줄 알게 된다 */
  const portrait = own || (bucket && bucket[other]);
  const casual = AIMG.cuts(bucket, 'casual', gender);
  const extra = AIMG.cuts(bucket, 'extra', gender);
  const all = (own ? [own] : []).concat(casual, extra);
  const countOf = g => AIMG.shotsOf(bucket, g).length;
  /* 갤러리에서 고른 그림을 위에 크게 띄운다 (기존 도감과 같은 동작).
     화풍·성별을 바꾸면 그 화풍의 초상으로 되돌린다 */
  const [pick, setPick] = useState(null);
  useEffect(() => { setPick(null); }, [style, gender]);

  /* 기체별 기록(generation/m-<해시>/)은 카드를 열 때 따로 받아 온다.
     툴킷 설정과 그림별 제출 프롬프트 경로가 여기 들어 있어, 도착하면 시트를
     통째로 다시 그린다. 예전에는 툴킷 칸 안에서만 다시 그려서, 늦게 온 기록이
     "원문 기록 없음"을 못 걷어냈다 */
  const [recTick, setRecTick] = useState(0);
  useEffect(() => {
    let live = true;
    const PMR = window.PerMechRecords;
    if (!PMR) return undefined;
    PMR.load(card.name).then(data => {
      ATK.putCardRecords(card.name, data);
      if (live) setRecTick(n => n + 1);
    }).catch(() => {});
    return () => { live = false; };
  }, [card.name]);
  const shown = (pick && all.indexOf(pick) >= 0) ? pick : portrait;
  const shownIdx = Math.max(0, all.indexOf(shown));
  const promptPath = useMemo(
    () => (shown ? ATK.promptPathOf(shown) : null), [shown, recTick]);

  return html`
    <div class="sheet-bg" onclick=${onClose}>
      <div class="sheet" onclick=${e => e.stopPropagation()}>
        <div class="bar">
          <div class="t">${card.name}</div>
          <button onclick=${onClose}>닫기</button>
        </div>
        <div class="body">
          ${!mine.length && html`
            <div class="tk">
              아직 그림이 없는 카드다. 참고용으로 외부에서 원본 디자인을 찾아볼 수 있다
              (이미지를 가져오지 않는다 — 검색 결과 페이지로 넘어갈 뿐이다).
              <div class="lnk">
                <a href=${'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(card.name) + '+건담'}
                   target="_blank" rel="noopener">구글 이미지에서 찾아보기 →</a>
              </div>
              <div class="lnk">
                <a href=${'https://www.google.com/search?q=site%3Agundam.fandom.com+' + encodeURIComponent(card.name) + '+건담'}
                   target="_blank" rel="noopener">건담 위키에서 찾아보기 →</a>
              </div>
            </div>`}

          ${shown
            ? html`<div class="art" onclick=${() => onZoom(all.length ? all : [shown], shownIdx)}>
                     ${/* 여기는 300px 폭으로 크게 그린다. 썸네일(긴 변 512)을 쓰면
                          고해상도 화면에서 흐릿해 목록 타일보다 화질이 나빠 보인다.
                          한 장뿐이니 원본을 받는다 — 목록은 장수가 많아 썸네일 유지 */''}
                     <img src=${AIMG.imgURL(shown)} alt="" />
                   </div>`
            : html`<div class="empty">이 화풍에는 그림이 없다</div>`}
          ${shown && html`
            <p class="sec" style="text-align:center">
              ${promptPath
                ? html`<a href=${promptPath} target="_blank" rel="noopener">이 그림의 실제 제출 프롬프트 열기 →</a>`
                : '이 그림의 제출 프롬프트 · 원문 기록 없음'}
            </p>`}
          ${portrait && !own && html`
            <p class="sec" style="text-align:center">
              ${gender === 'm' ? '남성' : '여성'} 그림이 없어 ${gender === 'm' ? '여성' : '남성'} 초상을 대신 띄웠다
            </p>`}

          <div class="chips">
            ${(card.factions || []).map(f => html`<span class="chip f">${f}</span>`)}
            ${serOf(card).map(k => html`<span class="chip">${seriesName(k)}</span>`)}
            ${card.temper && html`<span class="chip">${card.temper}</span>`}
            ${card.system && html`<span class="chip">${card.system}</span>`}
            ${card.psy && html`<span class="chip">${card.psy}</span>`}
            ${card.models && html`<span class="chip mono">${card.models}</span>`}
          </div>

          ${card.terrain && html`
            <p class="sec">지형</p>
            <div class="terr">
              ${Object.keys(card.terrain).map(k => html`
                <span><u>${k}</u>${TERRAIN[card.terrain[k]] || '—'}</span>`)}
            </div>`}

          ${card.stats && html`<div class="stats">
            ${card.stats.map((n, i) => html`
              <div class="stat"><i>${statLabels[i] || ''}</i><b>${n}</b></div>`)}
          </div>`}

          <div class="ctl">
            ${mine.length > 1 && html`
              <select aria-label="화풍 필터" value=${style} onchange=${e => setStyle(e.target.value)}>
                ${mine.map(k => html`<option value=${k}>${styleName[k] || k}</option>`)}
              </select>`}
            <div class="sw">
              ${[['m', '남'], ['f', '여']].map(([g, label]) => html`
                <button class=${(gender === g ? 'on' : '') + (countOf(g) ? '' : ' none')}
                        onclick=${() => setGender(g)}>${label} ${countOf(g)}</button>`)}
            </div>
          </div>

          ${all.length > 1 && html`
            <p class="sec">${gender === 'm' ? '남성' : '여성'} ${all.length}장 · 일상 ${casual.length} · 특별 ${extra.length}</p>
            <div class="gal">
              ${all.map(f => html`
                <img key=${f} loading="lazy" src=${AIMG.thumbURL(f)} alt="" title=${f}
                     class=${f === shown ? 'on' : ''}
                     onclick=${() => setPick(f)}
                     onerror=${e => { e.target.onerror = null; e.target.src = AIMG.imgURL(f); }} />`)}
            </div>`}

          ${(promptText || memo) && html`
            <p class="sec">프롬프트</p>
            <div class="tk">
              ${promptText ? html`<div>${promptText}</div>` : html`<div>문구가 없다</div>`}
              ${memo && html`<div class="tk-used">비고 · ${memo}</div>`}
              ${promptText && html`
                <button class="cp" onclick=${() => onCopy(card.name, promptText)}>문구 복사</button>`}
            </div>`}

          <${Toolkit} name=${card.name} />

          <div class="lnk">
            <a href=${'prompt.html?mech=' + encodeURIComponent(card.name)}>툴킷에서 열기 →</a>
          </div>

        </div>
      </div>
    </div>`;
}

/* ── 확대 ─────────────────────────────────────────────── */
function Zoom({ list, start, onClose }) {
  const [i, setI] = useState(start);
  const touch = useRef({ x: 0, y: 0, swiped: false });
  const step = d => setI(p => ((p + d) % list.length + list.length) % list.length);

  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, [list.length]);

  const onStart = e => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY, swiped: false }; };
  const onEnd = e => {
    if (list.length < 2) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy) * 1.4) { step(dx < 0 ? 1 : -1); touch.current.swiped = true; }
  };

  return html`
    <div class="zoom" ontouchstart=${onStart} ontouchend=${onEnd}
         onclick=${() => { if (touch.current.swiped) { touch.current.swiped = false; return; } onClose(); }}>
      <img src=${AIMG.imgURL(list[i])} alt="" />
      ${list.length > 1 && html`<div class="zpg mono">${i + 1}/${list.length}</div>`}
    </div>`;
}

/* ── 화면 ─────────────────────────────────────────────── */
function App() {
  const { data, err } = useAtelierData();
  const [tab, setTab] = useState('기체');
  const [mode, setMode] = useState('p');
  const [v, setV] = useState('f');
  const [q, setQ] = useState('');
  const [ser, setSer] = useState('');
  const [style, setStyle] = useState('');
  const [open, setOpen] = useState(null);
  const [zoom, setZoom] = useState(null);
  const [scrolled, setScrolled] = useState(false);
  const collection = useRef(null);
  /* 작게 보기 여부. dex.html 과 같은 키라 두 페이지가 설정을 공유한다 */
  const [onlyLeft, setOnlyLeft] = useState(true);   /* 작업 모드: 남은 것만 볼지 */
  /* 폰에서는 머리말이 화면을 많이 먹는다. 탭·모드·검색만 남기고 나머지는 접는다.
     걸린 조건이 있으면 단추에 개수가 붙어 접혀 있어도 알 수 있다 */
  const [showFilters, setShowFilters] = useState(false);
  const [toast, showToast] = useToast();
  /* 새 판이 올라오면 띠를 띄운다. 지금 판이 언제 것인지도 머리말에 적는다 */
  const [stamp, setStamp] = useState('');
  useEffect(() => { setStamp(window.AtelierFresh.watch().stamp()); }, []);
  const [compact, setCompact] = useState(() => {
    try { return localStorage.getItem('atelier_dex_compact_v1') === '1'; } catch (e) { return false; }
  });
  useEffect(() => {
    document.body.classList.toggle('dex-compact', compact);
    try { localStorage.setItem('atelier_dex_compact_v1', compact ? '1' : '0'); } catch (e) {}
  }, [compact]);

  /* 선택지는 지금 조건에 실제로 걸리는 것만 남기고 개수를 같이 보여 준다.
     화풍을 셀 때는 시리즈까지, 시리즈를 셀 때는 화풍까지 반영한다 —
     자기 자신은 빼고 세야 고른 뒤에도 목록에서 사라지지 않는다 */
  const base = useMemo(() => {
    if (!data) return [];
    const needle = q.trim().toLowerCase();
    return data.cards[tab]
      .filter(c => !needle || c.name.toLowerCase().includes(needle))
      /* 작업 모드와 "그림 없음" 은 아직 없는 것을 보는 쪽이라 그림 유무로 거르지 않는다 */
      .filter(c => mode === 'p' || mode === 'w' || style === NOPIC
        || shotsFor(data.img[c.name], mode, v).length);
  }, [data, tab, q, mode, v, style]);

  const styleCount = useMemo(() => {
    const cnt = {};
    base.filter(c => !ser || serOf(c).indexOf(ser) >= 0).forEach(c => {
      const ks = stylesOf(data && data.img[c.name]);
      if (!ks.length) cnt[NOPIC] = (cnt[NOPIC] || 0) + 1;
      ks.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; });
    });
    return cnt;
  }, [base, ser]);

  const serCount = useMemo(() => {
    const cnt = {};
    base.filter(c => !style || (style === NOPIC
        ? hasNoPic(data && data.img[c.name])
        : stylesOf(data && data.img[c.name]).indexOf(style) >= 0))
      .forEach(c => serOf(c).forEach(k => { cnt[k] = (cnt[k] || 0) + 1; }));
    return cnt;
  }, [base, style]);

  /* 탭을 바꾸면 시리즈·화풍은 비운다. 다른 탭에 없는 조건이 남아 빈 목록이 뜨는 걸 막는다 */
  /* 작업 줄에 "지금 이 줄이 어느 화풍인지" — 여럿이면 +N 으로 알린다 */
  const styleTextOf = name => {
    const ks = stylesOf(data.img[name]);
    if (!ks.length) return '그림 없음';
    const cur = (style && ks.indexOf(style) >= 0) ? style : ks[0];
    return (data.styleName[cur] || cur) + (ks.length > 1 ? ' +' + (ks.length - 1) : '');
  };
  const copyPrompt = (name, text) => {
    copyText(text).then(() => showToast('복사했다 · ' + name),
                        () => showToast('복사 실패'));
  };
  const pickTab = t => {
    setTab(t); setSer(''); setStyle('');
    if (collection.current) collection.current.scrollTop = 0;
    setScrolled(false);
  };

  const rows = useMemo(() => {
    if (!data) return [];
    return base
      .filter(c => !ser || serOf(c).indexOf(ser) >= 0)
      .filter(c => !style || (style === NOPIC
        ? hasNoPic(data.img[c.name])
        : stylesOf(data.img[c.name]).indexOf(style) >= 0))
      .map(c => ({ card: c, shots: shotsFor(data.img[c.name], mode, v, style) }))
      .filter(r => mode === 'p' || mode === 'w' || style === NOPIC || r.shots.length);
  }, [data, base, mode, v, ser, style]);


  if (err) return html`<div class="empty">자료를 못 읽었다 — ${String(err.message || err)}</div>`;
  if (!data) return html`<div class="empty">읽는 중…</div>`;

  const colorOf = c => {
    const f = c.factions && c.factions[c.factions.length - 1];
    return (data.series.faction_color && data.series.faction_color[f]) || '#79849A';
  };
  const seriesList = Object.keys(data.series.name || {}).filter(k => serCount[k]);
  const seriesName = k => (data.series.name && data.series.name[k]) || k || '—';
  const shown = rows.reduce((n, r) => n + (r.shots.length ? 1 : 0), 0);
  /* 진척은 필터에 걸린 모집단 기준. 남은 것만 보기로 걸러도 분모는 그대로다 */
  const work = rows.map(r => ({ ...r, st: statOf(data.img[r.card.name], style, v) }));
  const doneCount = work.filter(r => r.st.done).length;
  const workRows = onlyLeft ? work.filter(r => !r.st.done) : work;
  const styleList = Object.keys(data.styleName).filter(k => styleCount[k]);
  const bits = [];
  if (q.trim()) bits.push('"' + q.trim() + '"');
  if (ser) bits.push(seriesName(ser));
  if (style) bits.push(style === NOPIC ? '그림 없음' : (data.styleName[style] || style));
  const activeCount = bits.length;
  const filterSummary = bits.length ? bits.join(' · ') : '전체 보기';

  return html`
    <main class=${scrolled ? 'dex-scrolled' : ''}>
      <div class="chrome">
      <nav class="workspace-nav" aria-label="Atelier 화면 이동">
        <a href="prompt.html">프롬프트</a>
        <a href="play.html">드래프트</a>
        <a href="dex.html" aria-current="page">도감</a>
      </nav>
      <${AppearanceControls} />
      <${WorkspaceHeading} title="건담 도감" code="MOBILE SUIT ARCHIVE"
        subtitle="한 장씩 쌓아가는, 나만의 기체 컬렉션." />
      </div>

      <header>
      <div class="tabs">
        ${KINDS.map(k => html`
          <button class=${'tab' + (tab === k.tab ? ' on' : '')} onclick=${() => pickTab(k.tab)}>
            ${k.tab}<b class="mono">${data.cards[k.tab].length}</b>
          </button>`)}
      </div>
      <div class="ctl">
        <div class="sw grow">
          ${MODES.map(([m, label]) => html`
            <button class=${mode === m ? 'on' : ''} onclick=${() => setMode(m)}>${label}</button>`)}
        </div>
        ${mode === 'w'
          ? html`<div class="sw">
              ${[[true, '남은 것'], [false, '전체']].map(([on, label]) => html`
                <button class=${onlyLeft === on ? 'on' : ''} onclick=${() => setOnlyLeft(on)}>${label}</button>`)}
            </div>`
          : html`<div class="sw">
              ${[['m', '남'], ['f', '여']].map(([g, label]) => html`
                <button class=${v === g ? 'on' : ''} onclick=${() => setV(g)}>${label}</button>`)}
            </div>`}
      </div>
      <div class="search-row">
        <input aria-label="기체 이름 검색" placeholder="기체 이름으로 검색" value=${q} oninput=${e => setQ(e.target.value)} />
        <button type="button" class="filter-toggle" aria-expanded=${String(showFilters)}
                onclick=${() => setShowFilters(x => !x)}>
          필터${(ser ? 1 : 0) + (style ? 1 : 0) ? ' ' + ((ser ? 1 : 0) + (style ? 1 : 0)) : ''}
        </button>
      </div>

      ${showFilters && html`<div class="ctl filters">
        <select aria-label="시리즈 필터" value=${ser} onchange=${e => setSer(e.target.value)}>
          <option value="">시리즈 전체</option>
          ${seriesList.map(k => html`
            <option value=${k}>${seriesName(k)} ${serCount[k]}</option>`)}
        </select>
        <select aria-label="화풍 필터" value=${style} onchange=${e => setStyle(e.target.value)}>
          <option value="">화풍 전체</option>
          ${styleCount[NOPIC] ? html`
            <option value=${NOPIC}>그림 없음 ${styleCount[NOPIC]}</option>` : null}
          ${styleList.map(k => html`
            <option value=${k}>${data.styleName[k]} ${styleCount[k]}</option>`)}
        </select>
      </div>`}
      </header>

      <div class="view-tools">
        <span>${filterSummary}<b class="collection-count">${mode === 'w' ? workRows.length : rows.length}</b></span>
        <button disabled=${!activeCount}
                onclick=${() => { setQ(''); setSer(''); setStyle(''); }}>
          조건 초기화${activeCount ? ' ' + activeCount : ''}
        </button>
        <button aria-pressed=${compact} onclick=${() => setCompact(c => !c)}>
          ${compact ? '크게 보기' : '작게 보기'}
        </button>
      </div>
      <section class="collection-scroll" aria-label="도감 목록" tabindex="0" ref=${collection}
               onscroll=${event => setScrolled(event.currentTarget.scrollTop > 28)}>
      ${mode === 'w' && html`
        <div class="prog"><i style=${{ width: (rows.length ? doneCount / rows.length * 100 : 0).toFixed(1) + '%' }}></i></div>`}

      ${mode === 'w'
        ? (workRows.length
            ? html`<div class="rows">
                ${workRows.map(r => html`
                  <${WorkRow} key=${r.card.name} card=${r.card} color=${colorOf(r.card)} st=${r.st}
                              tkText=${ATK.summaryOf(r.card.name)}
                              promptText=${data.prompt[r.card.name] || ''}
                              memo=${data.memo[r.card.name] || ''}
                              styleText=${styleTextOf(r.card.name)}
                              onOpen=${() => setOpen(r.card)} />`)}
              </div>`
            : html`<div class="empty">${onlyLeft ? '이 범위는 초상이 전부 채워졌다' : '해당하는 카드가 없다'}</div>`)
        : (rows.length
            ? html`<div class="grid">
                ${rows.map(r => html`
                  <${Cell} key=${r.card.name} name=${r.card.name} color=${colorOf(r.card)}
                           shots=${r.shots} onOpen=${() => setOpen(r.card)} />`)}
              </div>`
            : html`<div class="empty">해당하는 카드가 없다</div>`)}
      <div class="foot mono">
        <span class="build-stamp">${stamp}</span>
        ${mode === 'w'
          ? '완료 ' + doneCount + ' / ' + rows.length + (onlyLeft ? ' · 남은 ' + (rows.length - doneCount) : '')
          : mode === 'p' ? shown + ' / ' + rows.length
          : rows.length + '장 · 그림 ' + shown}
      </div>
      </section>
    </main>

    ${open && html`
      <${Sheet} key=${open.name} card=${open} entry=${data.img[open.name]} styleName=${data.styleName}
                statLabels=${data.stats[tab] || []} seriesName=${seriesName}
                initialGender=${v}
                promptText=${data.prompt[open.name] || ''} memo=${data.memo[open.name] || ''}
                onCopy=${copyPrompt}
                onZoom=${(list, i) => setZoom({ list, i })} onClose=${() => setOpen(null)} />`}

    ${zoom && html`<${Zoom} list=${zoom.list} start=${zoom.i} onClose=${() => setZoom(null)} />`}
    ${toast}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
