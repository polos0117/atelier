<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>기동전사 드래프트 — DOCK</title>
<meta name="theme-color" content="#10141A">
<!-- 홈 화면에 두면 브라우저가 저장 자리를 걷어가지 못한다 -->
<link rel="manifest" href="play.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DOCK">
<link rel="apple-touch-icon" href="icon-play-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Read before paint; unavailable storage falls back to the compact default.
(function(){var v='compact';try{if(localStorage.getItem('atelier_density_v1')==='relaxed')v='relaxed'}catch(e){}document.documentElement.dataset.density=v})();
</script>
<link rel="stylesheet" href="gundam/play.css?v=082f0a4e92">
</head>
<body>
<div class="wrap">
<nav class="workspace-nav" aria-label="Atelier 화면 이동"><a href="prompt.html">프롬프트</a><a href="play.html" aria-current="page">드래프트</a><a href="dex.html">도감</a></nav>
<label class="density-control">화면 밀도 <select data-density-picker aria-label="화면 밀도"><option value="compact">촘촘하게</option><option value="relaxed">여유롭게</option></select></label>
  <div class="top">
    <div class="tt"><small>MOBILE SUIT DRAFT</small>기동전사 드래프트</div>
    <div class="gauge" id="gauge"></div>
  </div>

  <div class="rd">
    <div>
      <div class="rdl" id="rdl">ROUND 01 / 16</div>
      <div class="rdt" id="rdt">모함 <em>선정</em></div>
    </div>
    <button class="dexbtn" id="viewMode" type="button" aria-pressed="true">일반 보기</button>
    <button class="dexbtn" id="dexbtn">도감</button>
    <div class="turn" id="turn">대기</div>
  </div>

  <div id="missionBanner" class="mission-banner" hidden></div>
  <section id="tacticalArea" aria-label="드래프트 상황판"></section>
  <div class="play-tools"><span>카드를 편한 크기로 보세요</span><button type="button" id="playCardSize" aria-pressed="false">카드 크게</button></div>
  <div class="battle-layout">
  <div id="packArea"></div>
  <div id="dockArea"></div>
  <div id="boardArea"></div>
  <div id="endArea"></div>
  </div>
  <div id="ovlArea"></div>
  <div class="toastwrap" id="toastArea"></div>
</div>

<nav class="play-nav" aria-label="게임 화면 바로가기"><button type="button" data-jump="packArea">카드</button><button type="button" data-jump="dockArea" disabled>내 편성</button><button type="button" data-jump="boardArea" disabled>전황</button></nav>
<dialog id="tacticalDialog" aria-label="드래프트 상세"></dialog>
<script src="gundam/insights.js?v=2c5ff1a2d8"></script>
<script src="gundam/gallery.js?v=cbabbff011"></script>
<script src="gundam/game.js?v=58de744f73"></script>
<script src="gundam/page.js?v=20a1358816"></script>


</body>
</html>
