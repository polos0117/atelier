<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>기동전사 드래프트 — DOCK</title>
<meta name="theme-color" content="#10141A">
<!-- 홈 화면에 두면 브라우저가 저장 자리를 걷어가지 못한다 -->
<link rel="manifest" href="play.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DOCK">
<link rel="apple-touch-icon" href="icon-play-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#12151B; --hull:#1A1F28; --plate:#242B37; --plate2:#2E3746;
  --lume:#C9D3E1; --dim:#79849A; --amber:#E8A13A; --alert:#D2483C; --ok:#5FA88C;
  --line:rgba(201,211,225,.13);
  --disp:"Gothic A1",'Apple SD Gothic Neo',sans-serif;
  --body:"IBM Plex Sans KR",'Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    radial-gradient(130% 70% at 50% -8%,#1E2530 0%,#12151B 60%);
  color:var(--lume); font-family:var(--body);
  min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 13px 48px}

/* ── 머리 ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.tt{font-family:var(--disp);font-weight:900;font-size:23px;letter-spacing:-.01em;line-height:1}
.tt small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.34em;
  color:var(--amber);font-weight:400;margin-bottom:6px}
.gauge{display:flex;gap:3px;align-items:flex-end;height:22px}
.gauge i{width:5px;height:8px;background:var(--plate2);display:block;transition:.3s;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.gauge i.done{background:var(--dim);height:14px}
.gauge i.now{background:var(--amber);height:22px;box-shadow:0 0 9px rgba(232,161,58,.55)}

/* ── 라운드 표시 ── */
.rd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:13px 0 9px}
.rd>div:first-child{flex:1;min-width:0}
.rdl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
/* 전장 — 이 판의 지형. 기체 적성이 여기서 점수로 바뀐다 */
.rdl .fld{margin-left:7px;padding:1px 6px;font-weight:700;letter-spacing:.1em;
  color:var(--amber);border:1px solid rgba(232,161,58,.35)}
.rdt{font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.02em}
.rdt em{font-style:normal;color:var(--amber)}
.turn{font-family:var(--mono);font-size:10px;padding:3px 8px;border:1px solid var(--line);
  color:var(--dim);letter-spacing:.1em}
.turn.mine{color:var(--amber);border-color:rgba(232,161,58,.45)}

/* ── 카드 ── */
.pack{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;
  align-items:stretch;gap:6px;margin-bottom:14px}
.card{position:relative;text-align:left;padding:0 0 7px;border:1px solid var(--line);
  border-left:3px solid var(--fc,var(--dim));background:linear-gradient(180deg,#1D232D,#171C24);
  color:var(--lume);font-family:var(--body);cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .12s,border-color .2s}
.card>.av{flex:none}
.card>.pd{padding:0 6px;flex:0 0 auto;display:flex;flex-direction:column}
.card>.dlt{flex:none;margin-top:auto}
.card>.pd{padding-bottom:2px}
.card:active{transform:scale(.975)}
.card:disabled{opacity:.4;cursor:default}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 초상 프레임 — 기체·파일럿은 전신 1:2 */
.av{position:relative;width:100%;background:#10141A;overflow:hidden;
  border-bottom:2px solid var(--fc,var(--line))}
.av.pilot,.av.mech{aspect-ratio:2/3}
.av.crew{aspect-ratio:3/4}
.av.ship{aspect-ratio:3/2}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:100%;height:100%;display:block}
.av .scrim{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;
  background:linear-gradient(180deg,rgba(16,20,26,0) 0%,rgba(16,20,26,.9) 58%,rgba(16,20,26,.97) 100%)}
.av .scrim b{display:block;font-family:var(--disp);font-weight:700;font-size:12.5px;
  line-height:1.15;word-break:keep-all;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.av .scrim b.ln{font-size:11px}
.av .scrim b.ln2{font-size:10px;line-height:1.1}
.av .scrim b.ln3{font-size:9px;line-height:1.08;letter-spacing:-.02em}
.bdg{position:absolute;top:3px;left:4px;display:flex;gap:3px;align-items:center}
.vx{font-family:var(--mono);font-size:8px;
  padding:0 2px;background:rgba(16,20,26,.72);color:var(--dim);border:1px solid var(--line)}
.sb{font-family:var(--mono);font-size:8px;letter-spacing:.04em;padding:0 3px;
  background:rgba(16,20,26,.72);color:var(--lume);opacity:.92;border:1px solid var(--line)}
.ty{position:absolute;top:0;right:0;font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;
  padding:1px 4px;background:rgba(16,20,26,.82);color:var(--dim);border-left:1px solid var(--line)}
.fx{font-family:var(--mono);font-size:8.5px;color:#94A0B6;line-height:1.4;
  margin:4px 0 3px;word-break:break-all;min-height:22px}
.stats{display:grid;grid-template-columns:1fr;gap:2px}
.st{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:8px}
.st span{color:var(--dim);width:18px;flex:none}
.st u{flex:1;height:3px;background:var(--plate);text-decoration:none;display:block}
.st u i{display:block;height:100%;background:var(--fc,var(--dim))}
.st b{width:15px;text-align:right;font-weight:600;font-size:8.5px}
.tag{display:inline-block;font-family:var(--mono);font-size:7.5px;padding:0 3px;
  border:1px solid var(--line);color:var(--dim);margin-right:2px}
.tag.nt{color:var(--amber);border-color:rgba(232,161,58,.4)}
.tag.psy{color:#9C7ACF;border-color:rgba(156,122,207,.4)}
.dlt{margin-top:5px;padding-top:4px;border-top:1px dashed var(--line);
  font-family:var(--mono);font-size:8px;color:var(--ok)}
.dlt.dn{color:var(--alert)}
.dlt em{font-style:normal;color:var(--dim);display:block;font-size:7.5px;margin-top:1px}
.dlt em.fi{color:var(--amber)}
.dlt em.nr{color:#8A9AB0}
.fx b{color:var(--fc,var(--lume));font-weight:600}
.fx s{text-decoration:none;opacity:.55}
.sr{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--amber);opacity:.8}

/* ── 도크(서명 요소) ── */
.dock{border:1px solid var(--line);background:rgba(26,31,40,.75);margin-bottom:11px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px;background:var(--plate);border-bottom:1px solid var(--line)}
.dh b{font-family:var(--disp);font-weight:900;font-size:12px;letter-spacing:.04em}
.dh span{font-family:var(--mono);font-size:10px;color:var(--dim)}
.dh span.hi{color:var(--amber)}
.db{padding:9px 10px}
.ship{display:flex;align-items:center;gap:9px;padding:7px 9px;margin-bottom:9px;
  border-left:3px solid var(--fc,var(--dim));background:rgba(36,43,55,.55)}
.ship b{font-family:var(--disp);font-weight:700;font-size:14px}
.ship span{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto;flex:none}
.ship.empty{border-left-color:var(--plate2);color:var(--dim);font-family:var(--mono);font-size:11px}

.unit{display:flex;align-items:stretch;gap:0;margin-bottom:6px}
.uh{flex:1;min-width:0;padding:6px 8px;background:rgba(36,43,55,.5);
  border-left:2px solid var(--mc,var(--dim));display:flex;align-items:center;gap:8px}
.uh.p{border-left-color:var(--pc,var(--dim))}
.uh .tx{min-width:0;flex:1}
.uh b{display:block;font-family:var(--disp);font-weight:700;font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uh i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px}
.th{flex:none;width:44px;height:44px;background:#10141A;overflow:hidden;
  border:1px solid var(--line);cursor:pointer;position:relative}
.th .fcp{position:absolute;inset:0;background-repeat:no-repeat}
.th svg{width:100%;height:100%;display:block}

/* ── 도감 ── */
.dexbtn{flex:none;padding:4px 9px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;cursor:pointer}
.dexbtn:active{color:var(--amber);border-color:rgba(232,161,58,.45)}
.ovl{position:fixed;inset:0;z-index:60;background:rgba(10,13,17,.94);
  overflow-y:auto;-webkit-overflow-scrolling:touch;animation:rise .2s ease-out}
.ovlw{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 13px
  calc(28px + env(safe-area-inset-bottom))}
.ovlh{display:flex;align-items:center;gap:10px;padding-bottom:9px;
  border-bottom:1px solid var(--line);margin-bottom:11px}
.ovlh b{font-family:var(--disp);font-weight:900;font-size:17px;flex:1;
  min-width:0;word-break:keep-all;line-height:1.15}
.xbtn{flex:none;width:32px;height:32px;border:1px solid var(--line);background:transparent;
  color:var(--lume);font-family:var(--mono);font-size:15px;cursor:pointer;line-height:1}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:11px}
.tab{padding:7px 2px;border:1px solid var(--line);background:transparent;color:var(--dim);
  font-family:var(--disp);font-weight:700;font-size:11.5px;cursor:pointer}
.tab.on{border-color:var(--amber);color:var(--amber);background:rgba(232,161,58,.07)}
.dexg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dexi{border:1px solid var(--line);background:rgba(26,31,40,.6);cursor:pointer;
  padding:0 0 4px;overflow:hidden;text-align:center;color:var(--lume);font-family:var(--body)}
.dexi .fw{position:relative;width:100%;background:#10141A;overflow:hidden;
  border-bottom:2px solid var(--cc,var(--dim))}
.dexi .fcp{position:absolute;inset:0;background-repeat:no-repeat}
.dexi img{width:100%;height:100%;object-fit:cover;display:block}
.dexi svg{width:100%;height:100%;display:block}
.dexi span{display:block;font-size:8.5px;line-height:1.2;padding:3px 3px 0;
  word-break:keep-all;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:20px}
.dexi em{display:block;font-style:normal;font-family:var(--mono);font-size:7.5px;color:var(--dim)}

.dexvar{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.dexvar span{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
  margin-right:3px}
.dexvar .obtn{flex:1;padding:5px 2px;font-size:11px}

/* ── 상세 ── */
.big{position:relative;width:100%;max-width:none;margin:0 auto 12px;background:#10141A;
  border:1px solid var(--line);overflow:hidden}
.big.tall{aspect-ratio:2/3}
.big.wide{aspect-ratio:16/9}
.big.sq{aspect-ratio:3/4}
.big img{width:100%;height:100%;object-fit:contain;display:block}
.big svg{width:100%;height:100%;display:block}
.vtog{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.vtog button{padding:5px 16px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer}
.vtog button.on{border-color:var(--amber);color:var(--amber)}
.dinfo{border:1px solid var(--line);margin-bottom:11px}
.dinfo .r{display:flex;gap:10px;padding:7px 10px;border-bottom:1px dashed rgba(201,211,225,.07);
  font-size:11.5px;align-items:flex-start}
.dinfo .r:last-child{border-bottom:0}
.dinfo .r u{text-decoration:none;font-family:var(--mono);font-size:9px;color:var(--dim);
  width:52px;flex:none;padding-top:2px}
.dinfo .r div{flex:1;min-width:0}
/* 형식번호는 영문·숫자라 등폭이 읽기 낫다 */
.dinfo .r div.mono{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.dinfo .r div.terr{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:10.5px;color:var(--dim)}
.dbar{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;padding:2px 0}
.dbar span{color:var(--dim);width:26px;flex:none}
.dbar u{flex:1;height:5px;background:var(--plate);text-decoration:none;display:block}
.dbar u i{display:block;height:100%;background:var(--cc,var(--dim))}
.dbar b{width:22px;text-align:right;font-weight:600}
/* 도킹 클램프 */
.clamp{flex:none;width:46px;position:relative;display:flex;align-items:center;justify-content:center}
.clamp::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--plate2)}
.clamp em{position:relative;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:2px 4px;background:var(--hull);border:1px solid var(--cc,var(--plate2));color:var(--cc,var(--dim))}
.unit.solo .uh{opacity:.5}
.unit.solo .clamp em{border-style:dashed;color:var(--dim)}
.crew{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.pledge{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:7px;
  border-top:1px solid var(--line)}
.pg{font-family:var(--body);font-size:10.5px;padding:2px 7px;
  border:1px solid rgba(232,161,58,.35);color:var(--amber);background:rgba(232,161,58,.06)}
.pg b{font-family:var(--mono);font-size:9.5px;font-weight:600;margin-left:5px;opacity:.85}
.pg.kin{border-color:rgba(95,168,140,.4);color:var(--ok);background:rgba(95,168,140,.06)}
.pg.bad{border-color:rgba(210,72,60,.4);color:var(--alert);background:rgba(210,72,60,.06)}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px solid var(--cc,var(--line));
  color:var(--cc,var(--dim))}
.chip.ph{border-style:dashed;opacity:.45}

/* ── 픽 로그 ── */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:rgba(232,161,58,.16)}100%{background:transparent}}
.feed{border:1px solid var(--line);margin-bottom:11px;background:rgba(26,31,40,.55)}
.feed .fh{padding:6px 10px;background:var(--plate);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim)}
.lg{display:flex;align-items:center;gap:7px;padding:5px 10px;
  border-bottom:1px dashed rgba(201,211,225,.07);animation:rise .22s ease-out}
.lg:last-child{border-bottom:0}
.lg u{text-decoration:none;font-family:var(--mono);font-size:8.5px;color:var(--dim);
  width:26px;flex:none}
.lg i{font-style:normal;font-family:var(--disp);font-weight:700;font-size:10.5px;
  width:78px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg i.me{color:var(--amber)}
.lg b{font-family:var(--body);font-weight:600;font-size:11.5px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-left:2px solid var(--cc,var(--dim));padding-left:6px}
.lg s{text-decoration:none;font-family:var(--mono);font-size:8px;color:var(--dim);flex:none}
.lg.new{animation:rise .22s ease-out,flash .9s ease-out}
.lg.rr b{border-left-color:var(--plate2);color:var(--dim);font-weight:400;font-style:italic}
.lg.rr s{color:var(--amber);opacity:.75}

/* ── 적 함대 ── */
.foes{display:grid;gap:7px;margin-bottom:12px}
.foe{border:1px solid var(--line);background:rgba(26,31,40,.5);overflow:hidden}
.foe.act{border-color:rgba(232,161,58,.45)}
.fhd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(36,43,55,.5);
  cursor:pointer;width:100%;border:0;color:var(--lume);text-align:left;font-family:var(--body)}
.fhd b{font-family:var(--disp);font-weight:900;font-size:11.5px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhd em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--dim)}
.fhd u{text-decoration:none;font-family:var(--mono);font-size:9px;color:var(--dim);
  transition:transform .2s;display:inline-block}
.foe.open .fhd u{transform:rotate(90deg)}
.fbd{display:none;padding:7px 10px 9px}
.foe.open .fbd{display:block;animation:rise .2s ease-out}
.frow{display:flex;gap:6px;align-items:flex-start;padding:3px 0;font-size:10.5px}
.frow u{text-decoration:none;font-family:var(--mono);font-size:8.5px;color:var(--dim);
  width:30px;flex:none;padding-top:2px}
.frow div{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.pill{font-family:var(--body);font-size:10.5px;padding:1px 6px;
  border-left:2px solid var(--cc,var(--dim));background:rgba(36,43,55,.6)}
.pill.dim{opacity:.4;font-family:var(--mono);font-size:9px;border-left-style:dashed}

/* ── 버튼 ── */
.row{display:flex;gap:7px;margin-bottom:11px}
.btn{flex:1;padding:10px;border:1px solid var(--line);background:var(--plate);color:var(--lume);
  font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.03em;cursor:pointer}
.btn:active{background:var(--plate2)}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{font-size:11px;padding:7px}

/* ── 결과 ── */
.res{border:1px solid var(--line);margin-bottom:11px}
.rh{padding:9px 10px;background:var(--plate);display:flex;justify-content:space-between;align-items:baseline}
.rh b{font-family:var(--disp);font-weight:900;font-size:13px}
.rh span{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--amber)}
.rl2{padding:4px 10px 9px}
.rl2 div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
  font-family:var(--mono);font-size:10px;border-bottom:1px dashed rgba(201,211,225,.07)}
.rl2 div:last-child{border:0}
.rl2 k{color:var(--dim);font-style:normal}
.rl2 v{font-weight:600}
.rl2 v.dn{color:var(--alert)}
.rank{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);
  margin-bottom:6px;background:rgba(26,31,40,.6)}
.rank b{font-family:var(--disp);font-weight:900;font-size:13px;flex:1}
.rank em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--dim)}
.rank span{font-family:var(--mono);font-size:15px;font-weight:600}
.rank.win{border-color:var(--amber)}
.rank.win span{color:var(--amber)}

.note{font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.7;
  padding:9px 10px;border:1px solid var(--line);margin-bottom:11px}
.note b{color:var(--lume);font-weight:600}

/* ── 시작 설정 ── */
.setupbox{border:1px solid var(--line);background:rgba(26,31,40,.6);padding:12px;margin-bottom:12px}
.optrow{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px dashed rgba(201,211,225,.08)}
.optlab{flex:1;min-width:0}
.optlab b{display:block;font-family:var(--disp);font-weight:700;font-size:13px}
.optlab span{display:block;font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:2px}
.optbtns{flex:none;display:flex;gap:4px}
.obtn{padding:6px 11px;border:1px solid var(--line);background:transparent;color:var(--dim);
  font-family:var(--disp);font-weight:700;font-size:11.5px;cursor:pointer}
.obtn.on{border-color:var(--amber);color:var(--amber);background:rgba(232,161,58,.08)}
.btn.big{padding:14px;font-size:15px;letter-spacing:.1em;margin-top:12px}


/* ── 기록 · 통계 ── */
.statbar{display:flex;gap:6px;margin-bottom:4px}
.statbar div{flex:1;border:1px solid var(--line);background:rgba(26,31,40,.6);
  padding:9px 6px;text-align:center}
.statbar u{display:block;text-decoration:none;font-family:var(--mono);font-size:17px;
  font-weight:600;color:var(--amber)}
.statbar span{display:block;font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:3px}
.medals{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.medal{border:1px solid var(--line);background:rgba(26,31,40,.5);padding:7px 9px;opacity:.45}
.medal.on{opacity:1;border-color:rgba(232,161,58,.4);background:rgba(232,161,58,.06)}
.medal b{display:block;font-family:var(--disp);font-weight:900;font-size:12px}
.medal.on b{color:var(--amber)}
.medal span{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);
  margin-top:3px;line-height:1.4}
.stamps{display:flex;flex-wrap:wrap;gap:4px}
.stamp{font-family:var(--body);font-size:11px;padding:3px 8px;
  border:1px solid rgba(232,161,58,.35);color:var(--amber);background:rgba(232,161,58,.06)}
.stamp b{font-family:var(--mono);font-size:9.5px;opacity:.8}
.stamp.kin{border-color:rgba(95,168,140,.4);color:var(--ok);background:rgba(95,168,140,.06)}
.stamp.yet{border-color:var(--line);color:var(--dim);background:transparent;
  border-style:dashed;font-family:var(--mono);font-size:10px}
.lore{font-family:var(--body);font-size:11.5px;color:var(--lume);line-height:1.6;
  padding:9px 10px;border-left:2px solid var(--amber);background:rgba(232,161,58,.05);
  margin-bottom:11px}

/* ── 이미 지명된 카드 ── */
.card.taken{cursor:default;opacity:.9}
.card.taken .av{filter:grayscale(.75) brightness(.5)}
.tkv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:rgba(16,20,26,.45)}
.tkv u{text-decoration:none;font-family:var(--disp);font-weight:900;font-size:11px;
  color:var(--lume);text-shadow:0 1px 4px #000;white-space:nowrap;
  max-width:92%;overflow:hidden;text-overflow:ellipsis}
.tkv b{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--dim)}

/* ── 맨 위 · 맨 아래 ── */
.jump{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:5;display:flex;flex-direction:column;gap:5px}
.jb{width:38px;height:38px;border:1px solid var(--line);background:rgba(16,20,26,.9);
  color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;line-height:1;
  backdrop-filter:blur(2px)}
.jb:active{color:var(--amber);border-color:rgba(232,161,58,.45)}

/* ── 시리즈 고르개 ── */
.serrow{display:flex;gap:5px;margin-bottom:10px}
.selser{flex:1;min-width:0;padding:8px 26px 8px 9px;border:1px solid var(--line);
  background-color:rgba(26,31,40,.75);color:var(--lume);
  font-family:var(--body);font-size:12px;cursor:pointer;
  -webkit-appearance:none;appearance:none;border-radius:0;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.selser:focus{outline:none;border-color:rgba(232,161,58,.5)}
.selser option{background:#1A1F28;color:var(--lume)}
.serclr{flex:none;padding:8px 12px;border:1px solid rgba(232,161,58,.4);
  background:rgba(232,161,58,.07);color:var(--amber);
  font-family:var(--mono);font-size:10.5px;cursor:pointer}

/* ── 도감 이동 ── */
.dexnav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.navb{flex:1;padding:9px 4px;border:1px solid var(--line);background:rgba(26,31,40,.6);
  color:var(--lume);font-family:var(--disp);font-weight:700;font-size:12.5px;cursor:pointer}
.navb:active{background:var(--plate2);border-color:rgba(232,161,58,.45);color:var(--amber)}
.navc{flex:none;min-width:64px;text-align:center;font-family:var(--mono);font-size:10px;
  color:var(--dim);letter-spacing:.06em}
@keyframes slL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.ovlw.slideL{animation:slL .2s ease-out}
.ovlw.slideR{animation:slR .2s ease-out}

/* ── 갤러리 ── */
.gal{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.gal .gh{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
  margin-bottom:8px;display:flex;align-items:center;gap:8px}
.gal .gh span{flex:1;height:1px;background:var(--line)}
.gal .gi{display:block;width:100%;margin-bottom:8px;border:1px solid var(--line);
  background:#10141A;cursor:zoom-in}
.gal .gi img{width:100%;display:block}
.zoom{position:fixed;inset:0;z-index:80;background:rgba(8,10,14,.96);
  display:flex;align-items:center;justify-content:center;padding:12px;
  animation:rise .2s ease-out;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom .zx{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;
  padding:8px 16px;font:inherit;font-size:13px;letter-spacing:.08em;
  color:var(--amber);background:rgba(16,20,26,.92);border:1px solid var(--amber);
  cursor:pointer}

/* ── 인연 발동 알림 ── */
.toastwrap{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));
  z-index:70;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:8px 16px;
  border:1px solid var(--tc,var(--amber));background:rgba(16,20,26,.93);
  box-shadow:0 0 24px rgba(0,0,0,.7),0 0 12px var(--tg,rgba(232,161,58,.35));
  animation:tin .28s cubic-bezier(.2,.9,.3,1.3), tout .35s ease-in 1.5s forwards}
.toast u{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.24em;
  color:var(--tc,var(--amber))}
.toast b{font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.01em;
  color:var(--lume);white-space:nowrap}
.toast em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--tc,var(--amber))}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scaleX(.86)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.pg.fresh{animation:pgpop .7s ease-out}
@keyframes pgpop{0%{transform:scale(.8);box-shadow:0 0 0 0 currentColor}
  40%{transform:scale(1.06)}100%{transform:none;box-shadow:0 0 0 6px rgba(0,0,0,0)}}

/* ── 훈장 ── */
.feats{border:1px solid rgba(232,161,58,.4);margin-bottom:11px;background:rgba(232,161,58,.05)}
.feats .fh{padding:6px 10px;background:rgba(232,161,58,.14);color:var(--amber);
  font-family:var(--mono);font-size:9px;letter-spacing:.2em}
.ft{padding:7px 10px;border-bottom:1px dashed rgba(232,161,58,.15);animation:rise .3s ease-out}
.ft:last-child{border-bottom:0}
.ft b{font-family:var(--disp);font-weight:900;font-size:12.5px;color:var(--amber)}
.ft span{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px}
h3{font-family:var(--disp);font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--dim);
  margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="tt"><small>MOBILE SUIT DRAFT</small>기동전사 드래프트</div>

  </div>

  <div class="rd">

      <div class="rdl" id="rdl">ROUND 01 / 16</div>

<script>
"use strict";

/* ═══════ 데이터 ═══════ */
/* 기체: 이름, 소속이력, 출력,화력,장갑,기동, 기질, 계열, 시리즈 */
/* ═══════ 데이터 ═══════
   카드 자료는 이 파일이 아니라 data/*.json 에 있다.

   예전에는 여기 배열로 박아 두었는데, 카드 하나의 정보가 MECH·WEIGHT·LORE·
   TAG_COLOR·TAG_ROLE·GUNDAM_EXTRA 여섯 군데로 흩어져 이름으로만 이어져 있었다.
   그래서 표기가 한 글자 갈리면 같은 기체가 두 장이 됐다 — 그렇게 생긴 열 장을
   걷어냈다. 지금은 카드 하나가 레코드 하나이고, 형식번호(models)가 붙어 있어
   이름이 갈려도 같은 기체인지 대조할 수 있다.

   아래 변수들은 그 레코드를 예전 배열 꼴로 되돌린 것이다. 규칙 쪽 코드가
   자리번호로 읽기 때문에(m[7] 은 계열, p[9] 는 감응 계통) 그쪽은 건드리지 않았다.
   기체 배열만 끝에 형식번호가 한 칸 늘었다. serAll 이 뒤에서부터 배열을 찾으므로
   문자열인 형식번호는 시리즈 자리를 가리지 않는다. */
var MECH=[], PILOT=[], SHIP=[], CREW=[];
var SER_NAME={}, FRANCHISE={}, SER_TAG={}, FAC={};
var LORE={}, BOND={}, IMG={}, COMBO=[];
/* 카드 종류 — 화면 이름과 자료 파일을 잇는 한 자리.
   탭 목록·능력치 이름표가 여기서 갈라져 나온다 */
var KIND=[["함","ship"],["기체","mech"],["파일럿","pilot"],["지휘관","crew"]];
function kindNames(){return KIND.map(function(k){return k[0]})}
/* 능력치 이름표는 data/*.json 머리말이 이미 갖고 있다. 여기 또 적으면 둘이 갈린다 */
var STAT_LABEL={};
/* 화풍 key → 한글 이름. 차례는 data/style.json 이 정한다 */
var ART_NAME={}, ART_ORDER=[];
var WEIGHT={}, TAG_COLOR={}, TAG_ROLE={};
/* 카드가 참으로 적어 둔 칸들. tag.json 의 flag 가 여기서 찾는다 */
var FLAG={};
/* 이름 → G 제네레이션 이터널 유닛·인물 id. 게임 규칙에는 쓰지 않고
   도감에서 보여 주기와 바깥 자료 대조에만 쓴다 */
var GGE={};

/* 시험용 — ?set=이름 을 붙이면 data-이름/ 에서 읽는다. 붙이지 않으면 data/ 다 */
var DATA_DIR=(function(){
  var m=/[?&]set=([A-Za-z0-9_-]+)/.exec(location.search);
  return m?"data-"+m[1]+"/":"data/";
})();
function fetchJSON(n){
  /* 도감·툴킷과 같은 조건으로 받는다. Pages 의 10분 캐시에 걸리면
     새로 올린 화풍 몫이 한동안 안 보인다 */
  return fetch(DATA_DIR+n,{cache:"no-cache"}).then(function(r){
    if(!r.ok)throw new Error(n+" — "+r.status);
    return r.json();
  });
}
/* 배열을 갈아 끼우지 않고 안을 채운다. DEX_POOL 처럼 선언 시점에
   배열을 붙잡아 두는 곳이 있어서, 참조가 바뀌면 그쪽이 빈 채로 남는다 */
function fill(dst,src){ dst.length=0; dst.push.apply(dst,src); return dst }
function fillMap(dst,src){ for(var k in src)dst[k]=src[k]; return dst }

function absorb(cards,row){
  var out=[],i,c;
  for(i=0;i<cards.length;i++){
    c=cards[i];
    out.push(row(c));
    if(c.weight!==undefined&&c.weight!==1)WEIGHT[c.name]=c.weight;
    if(c.lore)LORE[c.name]=c.lore;
    if(c.color)TAG_COLOR[c.name]=c.color;
    if(c.role)TAG_ROLE[c.name]=c.role;
    for(var fk in c)if(c[fk]===true)(FLAG[fk]=FLAG[fk]||{})[c.name]=1;
    if(c.gge)GGE[c.name]=c.gge;
  }
  return out;
}
function mechRow(c){
  return [c.name,c.factions,c.stats[0],c.stats[1],c.stats[2],c.stats[3],
          c.temper,c.system,c.series,c.models||"",c.terrain||null];
}
function pilotRow(c){
  return [c.name,c.factions,c.stats[0],c.stats[1],c.stats[2],c.stats[3],
          c.temper,c.psy,c.series,c.line||""];
}
function plainRow(c){
  return [c.name,c.factions,c.stats[0],c.stats[1],c.stats[2],c.stats[3],c.series];
}

/* ═══════ 자료 검사 ═══════
   받아 오기에 실패한 것은 boot() 이 잡지만, 잘 받아 온 자료가 서로 어긋나는 것은
   여태 아무도 보지 않았다. 그러면 판이 한창일 때 엉뚱한 자리에서 터지거나,
   더 나쁘게는 조용히 이상한 점수가 나온다.

   판을 열기 전에 한 번 훑는다. 판을 못 세우는 것은 막고(fatal), 판은 서지만
   무언가 빠진 것은 일러둔다(warning). 주제를 새로 만들 때 어디가 어긋났는지
   화면에서 바로 보라고 두는 것이다. */
var DATA_VER=1;
function validateData(by){
  var F=[],W=[],i,j,k;
  var kinds=KIND.map(function(x){return x[0]}),        /* 함·기체·… */
      keys=KIND.map(function(x){return x[1]});          /* ship·mech·… */

  /* 1. 판(version) — 모르는 판이면 읽는 법이 달라졌을 수 있다 */
  for(k in by)if(by[k]&&by[k].version!==undefined&&by[k].version!==DATA_VER)
    W.push(k+".json 의 판이 "+by[k].version+" 이다. 이 화면은 "+DATA_VER+" 을 안다");

  /* 2. 카드 넷의 뼈대 */
  var seen={},dupIn=[],dupAcross=[];
  for(i=0;i<keys.length;i++){
    var f=by[keys[i]],nm=kinds[i]+"("+keys[i]+".json)";
    if(!f||!f.cards||!f.cards.length){F.push(nm+" 에 카드가 없다");continue}
    if(!f.stats||f.stats.length!==4)
      F.push(nm+" 의 stats 가 넷이 아니다 — 카드는 늘 넷을 읽는다");
    if(f.count!==undefined&&f.count!==f.cards.length)
      W.push(nm+" 의 count 는 "+f.count+" 인데 실제는 "+f.cards.length+" 장이다");
    var here={};
    for(j=0;j<f.cards.length;j++){
      var c=f.cards[j];
      if(!c.name){F.push(nm+" 의 "+(j+1)+"번째 카드에 이름이 없다");continue}
      if(!c.stats||c.stats.length!==4)
        F.push(nm+" · "+c.name+" 의 능력치가 넷이 아니다");
      else for(k=0;k<4;k++)if(typeof c.stats[k]!=="number")
        F.push(nm+" · "+c.name+" 의 "+(k+1)+"번째 능력치가 숫자가 아니다");
      if(c.weight!==undefined&&!(c.weight>0))
        W.push(nm+" · "+c.name+" 의 나올 비율이 "+c.weight+" 다 — 0 이하면 영영 안 나온다");
      if(here[c.name])dupIn.push(nm+" · "+c.name);
      here[c.name]=1;
      if(seen[c.name]&&seen[c.name]!==kinds[i])dupAcross.push(c.name+" ("+seen[c.name]+" · "+kinds[i]+")");
      seen[c.name]=kinds[i];
    }
  }
  if(dupIn.length)W.push("같은 종류 안에 이름이 겹친다 — "+dupIn.slice(0,6).join(", ")+
    (dupIn.length>6?" 외 "+(dupIn.length-6):""));
  if(dupAcross.length)W.push("종류를 건너 이름이 겹친다 — "+dupAcross.slice(0,6).join(", ")+
    (dupAcross.length>6?" 외 "+(dupAcross.length-6):""));

  /* 3. 라운드표 */
  var R=by.rule;
  if(!R||!R.schedule||!R.schedule.length)F.push("rule.json 에 라운드표가 없다");
  else{
    var bad=R.schedule.filter(function(t){return kinds.indexOf(t)<0});
    if(bad.length)F.push("rule.json 의 라운드표에 모르는 종류가 있다 — "+
      bad.filter(function(v,ix,a){return a.indexOf(v)===ix}).join(", "));
  }
  if(!R||!(R.pack>0))F.push("rule.json 의 pack 이 "+(R&&R.pack)+" 이다");
  if(R&&R.cap_from&&kinds.indexOf(R.cap_from)<0)
    W.push("rule.json 의 cap_from 이 '"+R.cap_from+"' 인데 그런 종류가 없다");

  /* 4. 카드가 세 편을 대기에 넉넉한가 — 고를 수 있는 가장 큰 규모로 본다 */
  var sc=(R&&R.scale)||{}, maxN=0;
  if(sc.options&&sc.options.length)for(j=0;j<sc.options.length;j++)if(sc.options[j]>maxN)maxN=sc.options[j];
  if(R&&R.schedule)for(i=0;i<kinds.length;i++){
    var need=0;
    for(j=0;j<R.schedule.length;j++)if(R.schedule[j]===kinds[i])need++;
    if(maxN&&sc.kinds&&sc.kinds.indexOf(kinds[i])>=0)need=maxN;
    need*=3;
    var have=(by[keys[i]]&&by[keys[i]].cards)?by[keys[i]].cards.length:0;
    if(have<need)W.push(kinds[i]+" 가 "+have+" 장인데 세 편이 "+need+" 장을 집는다 — 버림패가 되돌아온다");
  }

  /* 5. 전장과 지형 */
  var FD=by.field;
  if(!FD||!FD.fields||!FD.fields.length)F.push("field.json 에 전장이 없다");
  else{
    var wsum=0;
    for(i=0;i<FD.fields.length;i++){
      var fd=FD.fields[i];
      if(!fd.name)F.push("field.json 의 "+(i+1)+"번째 전장에 이름이 없다");
      if(!(fd.weight>0))F.push("field.json · "+fd.name+" 의 뽑힐 비율이 "+fd.weight+" 다");
      else wsum+=fd.weight;
    }
    if(wsum>0&&Math.abs(wsum-1)>0.01)W.push("전장이 뽑힐 비율의 합이 "+wsum.toFixed(3)+" 다 — 1 이 아니면 마지막 전장이 몫을 더 갖거나 잃는다");

var GAME_SEED=0, rngState=1, seedPinned=null;

function ntBonus(p,m){

/* 지형은 상한 뒤에 얹는다.
   예전에는 지형까지 한데 더한 뒤 [.70, 1.45] 로 잘랐다. 그러면 다른 보정만으로
   이미 상한을 넘는 전용기 짝은 지형이 아무리 나빠도 결과가 같아, 최강 조합에는
   전장 규칙이 걸리지 않았다.

   이백 판 삼천육백 짝을 재어 보니 상한에 닿은 짝이 8.0%, 지형 감점이 걸린 짝이
   29.3% 였고, 그 가운데 5.4% 는 감점이 통째로 사라졌다. 의도한 감점 96.1 중
   89.5 만 실제로 깎여, 6.9% 가 상한에 먹히고 있었다.

function sync(m,p){

function pledges(t){

/* 태그로 걸리는 연대 — 이름이 아니라 태그 수를 센다. 표는 data/tag.json 에 있다 */
function tagPledges(t){

/* ═══════ 조 배정 ═══════

   파일럿이 먼저 서로를 차지해 버려, 남은 것들이 형편없이 붙는 일이 생긴다.

   기체와 파일럿이 여섯씩이면 배정하는 경우가 720 뿐이다. 전부 세어 보는 편이
   빠르고 확실하다. 다만 주제가 커져 자리가 늘 수도 있으므로, 경우가 너무
   많아지면 탐욕에서 시작해 두 짝씩 바꿔 보며 더 나아지지 않을 때까지 다듬는다.

   정원 초과까지 함께 본다 — 넘친 조는 60% 라, 짝 점수 총합만 높인다고
   최종 점수가 높아지지 않는다. */
var SEARCH_CAP=5040;          /* 이보다 경우가 많으면 완전탐색을 접는다 */

   짝은 점수 내림차순으로 정원까지 100%, 넘으면 60%. 남은 것은 0.35 */

  var v=vals.slice().sort(function(a,b){return b-a}),t=0,i;
  for(i=0;i<v.length;i++)t+=(i<cap?v[i]:v[i]*.60);

  for(i=0;i<unP.length;i++)t+=pp(unP[i])*.35;

/* 기체마다 파일럿을 하나씩. 짝은 될 수 있는 대로 많이 짓는다 */
function matchExact(S,M,P,cap){

  for(i=0;i<np;i++)used.push(false);

  var rowMax=[];
  for(i=0;i<nm;i++){var mx=0,j;for(j=0;j<np;j++)if(S[i][j]>mx)mx=S[i][j];rowMax[i]=mx}

  for(i=nm-1;i>=0;i--)suffix[i]=suffix[i+1]+rowMax[i];
  /* 가지를 자를 때 쓰는 한계값에는 대기 점수도 얹어야 한다. 짝 점수만으로 재면
     대기가 많은 가지를 실제보다 낮게 보고 잘라 버린다 */
  var soloMax=0;
  for(i=0;i<nm;i++)soloMax+=mp(M[i])*.35;
  for(i=0;i<np;i++)soloMax+=pp(P[i])*.35;
  function rec(mi,made,sum){
    if(made+(nm-mi)<k)return;                 /* 짝을 다 못 채우면 버린다 */
    if(bestPick&&sum+suffix[mi]+soloMax<bestV-1e-9)return;

      for(a=0;a<nm;a++){if(pick[a]<0)unM.push(M[a]);else vals.push(S[a][pick[a]])}
      for(b=0;b<np;b++)if(!used[b])unP.push(P[b]);

      if(v>bestV){bestV=v;bestPick=pick.slice()}

  var nm=M.length,np=P.length,i,j;
  var cand=[];
  for(i=0;i<nm;i++)for(j=0;j<np;j++)cand.push([S[i][j],i,j]);
  cand.sort(function(a,b){return b[0]-a[0]});
  var pick=[],um={},up={};
  for(i=0;i<nm;i++)pick[i]=-1;
  for(i=0;i<cand.length;i++){
    var mi=cand[i][1],pi=cand[i][2];
    if(um[mi]||up[pi])continue;
    um[mi]=up[pi]=1;pick[mi]=pi;
  }
  function worthOf(pk){
    var vals=[],unM=[],unP=[],taken={},a,b;
    for(a=0;a<nm;a++){if(pk[a]<0)unM.push(M[a]);else{vals.push(S[a][pk[a]]);taken[pk[a]]=1}}
    for(b=0;b<np;b++)if(!taken[b])unP.push(P[b]);
    return crewWorth(vals,unM,unP,cap);
  }
  var cur=worthOf(pick),moved=true,guard=0;
  while(moved&&guard++<40){
    moved=false;
    for(i=0;i<nm;i++)for(j=i+1;j<nm;j++){
      var t=pick[i];pick[i]=pick[j];pick[j]=t;
      var v=worthOf(pick);
      if(v>cur+1e-9){cur=v;moved=true}else{t=pick[i];pick[i]=pick[j];pick[j]=t}
    }
  }
  return pick;
}
function assign(t){
  var M=t.기체,P=t.파일럿,nm=M.length,np=P.length,out=[],i,j;
  if(!nm||!np){
    for(i=0;i<nm;i++)out.push({s:mp(M[i])*.35,m:M[i],p:null});
    for(i=0;i<np;i++)out.push({s:pp(P[i])*.35,m:null,p:P[i]});
    return out;
  }
  var S=[];                                   /* 짝 점수는 한 번만 잰다 */
  for(i=0;i<nm;i++){S[i]=[];for(j=0;j<np;j++)S[i][j]=pairScore(M[i],P[j])}
  var cap=capOf(t);
  var big=Math.max(nm,np),small=Math.min(nm,np),ways=1;
  for(i=0;i<small;i++)ways*=(big-i);
  var pick=(ways<=SEARCH_CAP)?matchExact(S,M,P,cap):matchLocal(S,M,P,cap);
  var taken={};
  for(i=0;i<nm;i++)if(pick[i]>=0){out.push({s:S[i][pick[i]],m:M[i],p:P[pick[i]]});taken[pick[i]]=1}
  out.sort(function(a,b){return b.s-a.s});    /* 정원 초과는 낮은 조부터 — evaluate 가 순서대로 센다 */
  for(i=0;i<nm;i++)if(pick[i]<0)out.push({s:mp(M[i])*.35,m:M[i],p:null});
  for(j=0;j<np;j++)if(!taken[j])out.push({s:pp(P[j])*.35,m:null,p:P[j]});
  return out;
}

/* ═══════ 적장의 눈 ═══════
   인연을 얼마나 셈하는지가 난이도를 가르는 손잡이다. 예전에는 보거나 못 보거나
   둘뿐이었고, 신참과 숙련이 함께 눈을 감았다. 그러면 힌트로 인연을 보고 두는
   사람과 셈하는 것이 아예 달라진다.

   그렇다고 숙련에게 온전히 보여 주면 에이스와 구별이 없어진다. 실제로 재어
   보니 아군 승률이 60.7% 에서 36.0% 로 떨어져 에이스(31.3%)와 붙어 버렸다.
   그래서 보는 정도를 단계로 두었다 — 신참은 못 보고, 숙련은 어렴풋이,
   에이스는 온전히.

   가중치를 반으로 줄여 보았으나 소용이 없었다. 어느 카드를 집을지는 순위로
   정해지므로, 인연 점수를 반으로 깎아도 순위가 거의 그대로였다(32.7%).

   그래서 무게가 아니라 종류로 갈랐다. 이름으로 맺힌 인연 — 아무로와 뉴 건담,
   샤아와 사잔비 같은 것 — 은 연의를 아는 사람이면 누구나 안다. 반면 태그를
   쌓아 만드는 인연 — 건담 여섯, 붉은 기체 넷 — 은 판을 세어 봐야 보인다.
   숙련은 앞의 것만, 에이스는 둘 다 본다.

   0 = 아무것도, 1 = 이름으로 맺힌 것만, 2 = 모두 */
var PLEDGE_SEE=[0,1,2];
function evaluate(t,see){
  if(see===undefined)see=2;   /* 판정과 화면은 늘 온전히 센다 */
  var rows=[],total=0,i,units=assign(t),cap=capOf(t),over=0;
  var paired=units.filter(function(u){return u.m&&u.p});
  for(i=0;i<paired.length;i++){
    var v=paired[i].s;
    if(i>=cap){v*=.60;over++}
    total+=v;
  }
  rows.push(["출격 "+paired.length+"조"+(over?" (정원초과 "+over+"조 60%)":""),Math.round(total)]);
  var solo=units.filter(function(u){return !(u.m&&u.p)});
  if(solo.length){
    var sv=0;for(i=0;i<solo.length;i++)sv+=solo[i].s;
    rows.push(["미편성 "+solo.length+"기 · 대기",Math.round(sv)]);total+=sv;
  }
  if(t.함.length){
    var s=t.함[0],v2=sp(s)*.55;
    rows.push(["모함 "+s[0]+" · 정원 "+(s[5]+CAP_BONUS),Math.round(v2)]);total+=v2;
  }else{rows.push(["모함 부재",-60]);total-=60}
  for(i=0;i<t.지휘관.length;i++){
    var c=t.지휘관[i],v3=cp(c)*.42;
    rows.push(["지휘관 "+c[0],Math.round(v3)]);total+=v3;
  }
  var sy=synergy(t);
  for(i=0;i<sy.rows.length;i++)
    rows.push(["결속 · "+sy.rows[i][0]+" "+sy.rows[i][1],Math.round(sy.rows[i][2]*.35)]);
  total+=sy.total*.35;
  if(see>0){
    var pg=pledges(t);
    if(see<2)pg=pg.filter(function(g){return !g.tag});   /* 태그로 쌓는 것은 못 본다 */
    for(i=0;i<pg.length;i++){
      var pv=Math.round(pg[i].v*PLEDGE_MUL);
      var nm=pg[i].n.replace(/^(혈연|악연) · /,"");
    rows.push([(pg[i].v<0?"악연 · ":pg[i].kin?"혈연 · ":"연대 · ")+nm,pv]);
      total+=pv;
    }
  }
  return {rows:rows,total:Math.round(total)};
}

/* ═══════ 진행 ═══════ */
var SCHEDULE=[];   /* 라운드마다 무엇을 뽑는지 — data/rule.json 에서 채운다 */
/* ═══════ 편성 규모 ═══════
   카드가 765 기까지 늘어 여섯 조는 좁아졌다. 몇 조를 꾸릴지 사람이 고르게 한다.
   무엇이 늘어나는지는 rule.json 의 scale.kinds 가 정한다 — 함과 지휘관은 그대로다.

   자리를 늘려도 정원이 빡빡해지지는 않는다. 웃돈이 자리 수에서 cap_base 를 뺀
   값이라 자리를 따라 함께 커지기 때문이다. 정원을 살리려면 cap_base 를 올려야
   하고, 그것은 별개의 손잡이다. */
var BASE_SCHEDULE=[], SCALE_KINDS=[], SCALE_OPTS=[], SCALE=0, CAP_FROM="", CAP_BASE=4;
function buildSchedule(n){
  var out=[],i=0;
  while(i<BASE_SCHEDULE.length){
    var t=BASE_SCHEDULE[i],c=0;
    while(i<BASE_SCHEDULE.length&&BASE_SCHEDULE[i]===t){c++;i++}
    var k=(SCALE_KINDS.indexOf(t)>=0)?n:c;
    for(var j=0;j<k;j++)out.push(t);
  }
  return out;
}
/* 규모가 바뀌면 라운드표와 정원 웃돈을 함께 다시 짠다 */
function applyScale(n){
  if(SCALE_OPTS.length&&SCALE_OPTS.indexOf(n)<0)n=SCALE_OPTS[0];
  SCALE=n;
  fill(SCHEDULE,buildSchedule(n));
  CAP_BONUS=Math.max(0,slotsOf(CAP_FROM)-CAP_BASE);
}
/* 편성 규모에 맞춰 정원을 넉넉히 잡는다 — 기체 수에서 함 평균 정원을 뺀 만큼 */
function slotsOf(type){var n=0,i;for(i=0;i<SCHEDULE.length;i++)if(SCHEDULE[i]===type)n++;return n}
var CAP_BONUS=0;   /* 자료를 받은 뒤 정한다 */
function capOf(t){return t.함.length?t.함[0][5]+CAP_BONUS:0}
/* ═══════ 정원의 앞일 ═══════
   모함은 첫 라운드에 고른다. 그때는 기체도 파일럿도 없어 정원이 점수에 잡히지
   않고, sp() 에도 정원이 들어가지 않는다. 그래서 적장은 정원이 모자라 뒷날 한
   조가 60% 로 싸우게 될 것을 첫 수에서 보지 못한다.

   재어 보니 정원을 빡빡하게 만들어도(cap_base 5) 고르는 배의 정원이 4.64 로
   꿈쩍하지 않았다. 앞일을 못 보니 당연한 일이다.

   모자랄 조 하나에 한 조 값의 40% 를 매긴다 — 정원을 넘긴 조는 60% 만 받으므로
   잃는 것이 꼭 그만큼이다. 한 조 값은 로스터에서 한 번만 어림한다. */
var EXP_PAIR=95;
function calcExpPair(){
  if(!MECH.length||!PILOT.length)return;
  var m=MECH.map(mp).sort(function(a,b){return a-b}),
      p=PILOT.map(pp).sort(function(a,b){return a-b});
  EXP_PAIR=(m[m.length>>1]/100)*(p[p.length>>1]/100)*100;
}
function futurePairs(){return Math.min(slotsOf("기체"),slotsOf("파일럿"))}
/* 이 모함을 골랐을 때 뒷날 잃을 값 (음수) */
function capForesight(ship){
  var need=futurePairs(), have=ship[5]+CAP_BONUS;
  var miss=Math.max(0,need-have);
  return miss?-miss*EXP_PAIR*0.40:0;
}

   주제마다 따로 쌓는다. 예전에는 자리가 하나뿐이라 ?set= 으로 다른 주제를 열어도

function migrateNames(){
  if(REC.ren>=18)return;
  var k,i,keys=["seen","picks"];
  for(i=0;i<keys.length;i++){
    var src=REC[keys[i]]||{},dst={};
    for(k in src){
      var nk=RENAME_MAP[k]||k;
      dst[nk]=(dst[nk]||0)+(typeof src[k]==="number"?src[k]:1);
    }
    REC[keys[i]]=dst;
  }
  REC.ren=18;
  recSave();
}

var CFG_KEY="gundam_draft_cfg_v1";
function cfgSave(){
  try{localStorage.setItem(CFG_KEY,JSON.stringify({
    lv:AI_LV, fog:fogOn, hint:hintOn, ex:exhaustOn,
    rr:REROLL_MAX, shared:sharedPack, vp:VIEW_P, vm:VIEW_M, dv:dexVar, sc:SCALE
  }))}catch(e){}
}
function cfgLoad(){
  try{
    var c=JSON.parse(localStorage.getItem(CFG_KEY));
    if(!c)return;
    if(typeof c.lv==="number"&&c.lv>=0&&c.lv<=2)AI_LV=c.lv;
    if(typeof c.fog==="boolean")fogOn=c.fog;
    if(typeof c.hint==="boolean")hintOn=c.hint;
    if(typeof c.ex==="boolean")exhaustOn=c.ex;
    if(RR_OPT.indexOf(c.rr)>=0)REROLL_MAX=c.rr;
    if(typeof c.shared==="boolean")sharedPack=c.shared;
    if("mfr".indexOf(c.vp)>=0&&c.vp)VIEW_P=c.vp;
    if("mfrx".indexOf(c.vm)>=0&&c.vm)VIEW_M=c.vm;
    if("mfr".indexOf(c.dv)>=0&&c.dv)dexVar=c.dv;
    /* 주제마다 고를 수 있는 규모가 다르다. 없는 값이면 그 주제의 기본을 지킨다 */

function checkFeats(rank,ev,gaps){
  var got=[],t=teams[0],i;
  function give(id){if(!REC.feats[id]){REC.feats[id]=1;got.push(id)}}
  var pg=pledges(t),kin=pg.filter(function(x){return x.kin}).length;
  var feud=pg.filter(function(x){return x.v<0}).length;
  var units=assign(t).filter(function(u){return u.m&&u.p});
  var cap=capOf(t);
  var hi=units.filter(function(u){return sync(u.m,u.p)>=1.40}).length;
  var bond=units.filter(function(u){return BOND[u.p[0]+"|"+u.m[0]]}).length;
  var ser=null,cross=0;
  for(i=0;i<units.length;i++){
    var common=serAll(units[i].m).filter(function(x){return serAll(units[i].p).indexOf(x)>=0});
    if(!common.length)cross++;
    var us=serAll(units[i].m).filter(function(x){return serAll(units[i].p).indexOf(x)>=0});
    ser = ser===null ? us.slice()
        : ser.filter(function(x){return us.indexOf(x)>=0});
  }
  ser = ser||[];
  if(rank===0){
    give("first_win");
    if(AI_LV===2)give("ace_win");
    if(fogOn)give("fog_win");
    if(gaps>=200)give("big_win");
    if(!feud)give("no_feud");
    if(cap&&units.length>=cap)give("full_cap");
    if(ser.length)give("one_series");
    if(cross===units.length&&units.length>=3)give("cross_win");
    if(rerolls===REROLL_MAX)give("no_reroll");
  }
  if(pg.length>=5)give("pledge5");
  if(kin>=2)give("kin2");
  if(hi>=1)give("sync140");
  if(bond>=3)give("bond3");
  for(i=0;i<pg.length;i++)if(pg[i].v>0)REC.stamps[pg[i].n]=1;
  var all=[].concat(t.함,t.기체,t.파일럿,t.지휘관);
  if(!REC.picks)REC.picks={};
  for(i=0;i<all.length;i++){REC.seen[all[i][0]]=1;
    REC.picks[all[i][0]]=(REC.picks[all[i][0]]||0)+1}
  if(REC.games>=10)give("vet10");
  if(Object.keys(REC.stamps).length>=30)give("stamp30");
  if(Object.keys(REC.seen).length>=60)give("dex60");
  return got;
}

  teams=[newTeam(),newTeam(),newTeam()];
  round=0;seq=order();si=0;busy=false;log=[];openFoe={};
  rerolls=REROLL_MAX;aiRR=[0,REROLL_MAX,REROLL_MAX];curPack=null;packArr=[];packType=null;discard={함:[],기체:[],파일럿:[],지휘관:[]};shown={};
  rollVariants();
  rollArt();

function order(){
  var o=[0,1,2],i,j,t;
  for(i=o.length-1;i>0;i--){j=rngInt(i+1);t=o[i];o[i]=o[j];o[j]=t}
  return o;
}
function turnSeq(){return round%2===0?seq:seq.slice().reverse()}
function drawPack(type){
  var src=pools[type],out=[],i;
  if(src.length<PACKN+2){src=pools[type]=src.concat(discard[type]);discard[type]=[];shown={}}
  var idx=[];for(i=0;i<src.length;i++)if(!(exhaustOn&&shown[src[i][0]]))idx.push(i);
  if(idx.length<PACKN){idx=[];for(i=0;i<src.length;i++)idx.push(i)}
  var key={};for(i=0;i<idx.length;i++)key[idx[i]]=Math.pow(rng(),1/wOf(src[idx[i]]));
  idx.sort(function(a,b){return key[b]-key[a]});
  for(i=0;i<Math.min(PACKN,idx.length);i++){out.push(src[idx[i]]);if(exhaustOn)shown[src[idx[i]][0]]=1}
  return out;
}
function take(type,card,ti){
  /* 카드가 동나면 팩이 비어 온다. 예전에는 그 빈 자리가 편성과 기록에 그대로
     들어가 화면을 그릴 때 터졌다. 판이 못 채워지는 것은 자료가 모자란다는 뜻이지
     터질 일은 아니라, 조용히 건너뛰고 한 번만 일러 둔다 */
  if(!card){
    if(!take.warned){take.warned=1;
      console.warn("["+type+"] 카드가 동났다. "+SCHEDULE.length+
        " 라운드를 세 편이 채우려면 종류마다 "+(slotsOf(type)*3)+" 장이 필요한데 "+
        (pools[type].length+discard[type].length)+" 장뿐이다");}
    return;
  }
  teams[ti][type].push(card);
  var k=pools[type].indexOf(card);
  if(k>=0)pools[type].splice(k,1);
  log.unshift({r:round+1,ti:ti,type:type,c:card,fresh:true});
}
/* 버림패로 보낸다. pools 에서 빼는 것이 핵심이다 —
   drawPack 은 뽑을 때 pools 에서 빼지 않으므로, 안 뺀 채 discard 에만 넣으면
   같은 카드가 양쪽에 남는다. 순환이 끝나 pools 에 합류하는 순간 둘이 된다.
   본편은 카드가 많아 합류 자체가 일어나지 않아 여태 드러나지 않았다. */
function toDiscard(type,card){
  var k=pools[type].indexOf(card);
  if(k>=0)pools[type].splice(k,1);
  discard[type].push(card);
}
function tossPack(type,pack,keep){
  for(var i=0;i<pack.length;i++)if(pack[i]!==keep)toDiscard(type,pack[i]);
}
function aiPick(type,pack,ti,wantGain){
  /* 신참은 가끔 헛발질하고, 에이스는 인연을 내다보며 팩을 물릴 줄 안다 */
  /* 눈을 감는 것은 신참뿐이다. 숙련이 인연이라는 점수축을 통째로 무시하면
     힌트를 보는 사람과 셈하는 것이 달라진다 */
  var see=PLEDGE_SEE[AI_LV], base=evaluate(teams[ti],see).total;
  if(AI_LV===0&&rng()<.35){
    var rc=pack[rngInt(pack.length)];
    return wantGain?{c:rc,gain:0}:rc;
  }
  var best=null,bs=-1e9,i;
  for(i=0;i<pack.length;i++){
    teams[ti][type].push(pack[i]);
    var s=evaluate(teams[ti],see).total;
    if(AI_LV>0&&type==="함")s+=capForesight(pack[i]);   /* 신참은 앞일을 못 본다 */
    if(AI_LV===2)s+=nearBonus(teams[ti],pack[i]);
    teams[ti][type].pop();
    if(s>bs){bs=s;best=pack[i]}
  }
  return wantGain?{c:best,gain:bs-base}:best;
}
/* 이 라운드에서 통상 기대할 만한 이득 — 이보다 못하면 물린다 */
var RR_BAR={"함":105,"기체":32,"파일럿":66,"지휘관":35};   // 타입별 통상 이득
function aiDraw(type,ti){
  if(sharedPack){
    ensurePack(type);
    var open=openSlots();
    if(!open.length){dealPack(type);open=openSlots()}
    var cards=open.map(function(i){return packArr[i].c}),
        res=aiPick(type,cards,ti,true),g=RR_K[AI_LV],guard2=0;
    /* 마지막 라운드가 아니고 팩이 시원치 않으면 남은 자리만 새로 뽑는다 */
    while(g>0&&aiRR[ti]>0&&round<SCHEDULE.length-1&&
          res.gain<RR_BAR[type]*g&&guard2++<3){
      aiRR[ti]--;
      log.unshift({r:round+1,ti:ti,type:type,rr:true,
        say:RR_SAY[Math.floor(Math.random()*RR_SAY.length)],fresh:true});
      var keep=packArr.filter(function(x){return x.by!==null}),n=packArr.length-keep.length,j;
      for(j=0;j<packArr.length;j++)if(packArr[j].by===null)toDiscard(type,packArr[j].c);
      packArr=keep.concat(drawPack(type).slice(0,n).map(function(c){return {c:c,by:null}}));
      open=openSlots();cards=open.map(function(i2){return packArr[i2].c});
      res=aiPick(type,cards,ti,true);
    }
    if(!res.c){dealPack(type);res=aiPick(type,openSlots().map(function(i3){return packArr[i3].c}),ti,true)}
    for(var q=0;q<packArr.length;q++)if(packArr[q].c===res.c&&packArr[q].by===null){packArr[q].by=ti;break}
    return res.c;
  }
  var pack=drawPack(type),r=aiPick(type,pack,ti,true),guard=0,k=RR_K[AI_LV];
  /* 마지막 라운드에서는 아무도 물리지 않는다 */
  while(k>0&&aiRR[ti]>0&&round<SCHEDULE.length-1&&
        r.gain<RR_BAR[type]*k&&guard++<3){
    aiRR[ti]--;
    log.unshift({r:round+1,ti:ti,type:type,rr:true,
      say:RR_SAY[Math.floor(Math.random()*RR_SAY.length)],fresh:true});
    tossPack(type,pack,null);
    pack=drawPack(type);r=aiPick(type,pack,ti,true);
  }
  tossPack(type,pack,r.c);
  return r.c;
}
function nearBonus(t,c){
  var names={},all=[].concat(t.함,t.기체,t.파일럿,t.지휘관),i,j,b=0;
  for(i=0;i<all.length;i++)names[all[i][0]]=1;
  for(i=0;i<COMBO.length;i++){
    var cb=COMBO[i];if(cb.m.indexOf(c[0])<0)continue;
    var hit=0;for(j=0;j<cb.m.length;j++)if(names[cb.m[j]])hit++;
    for(var k in cb.t)if(+k===hit+1&&cb.t[k]>0)b+=cb.t[k]*.12;
  }

    dealPack(type);

  packArr=[];packType=null;

function delta(c,type){
  var t=teams[0],before=evaluate(t).total,pg0=pledges(t);
  var had={};for(var q=0;q<pg0.length;q++)had[pg0[q].n]=pg0[q].v;
  t[type].push(c);
  var after=evaluate(t).total,u=assign(t),pg1=pledges(t);
  var fired=[],near=[];
  for(q=0;q<pg1.length;q++)if(had[pg1[q].n]===undefined||had[pg1[q].n]!==pg1[q].v)
    fired.push({n:pg1[q].n.replace(/^(혈연|악연) · /,""),v:pg1[q].v,kin:pg1[q].kin});
  /* 한 명만 더 모으면 터지는 인연 */
  var names={},all=[].concat(t.함,t.기체,t.파일럿,t.지휘관),z;
  for(z=0;z<all.length;z++)names[all[z][0]]=1;
  for(z=0;z<COMBO.length;z++){
    var cb=COMBO[z];if(cb.m.indexOf(c[0])<0)continue;
    var hit=0,miss=[];
    for(q=0;q<cb.m.length;q++)names[cb.m[q]]?hit++:miss.push(cb.m[q]);
    var nk=null;for(var kk in cb.t)if(+kk===hit+1&&cb.t[kk]>0)nk=+kk;
    if(nk&&miss.length)near.push(cb.n+"(+"+miss.length+")");
  }
  t[type].pop();
  var why="";
  if(type==="기체"||type==="파일럿"){
    for(var i=0;i<u.length;i++){
      var uu=u[i];
      if(uu.m&&uu.p&&((type==="기체"&&uu.m[0]===c[0])||(type==="파일럿"&&uu.p[0]===c[0]))){
        var sp2=syncParts(uu.m,uu.p),bits=[];
        if(sp2.b)bits.push("전용기");
        if(sp2.t>0)bits.push("기질");else if(sp2.t<0)bits.push("기질충돌");
        if(sp2.n>0)bits.push(sp2.xline?"타계통 절반":LINE[uu.m[7]]);
        else if(sp2.n<0)bits.push("감응 부재");
        if(sp2.s)bits.push("동시리즈");
        if(sp2.o)bits.push("옛소속");
        if(sp2.g<0)bits.push(FIELD+" "+terrainWord(uu.m));
        why=(type==="기체"?uu.p[0]:uu.m[0])+" 조 · 싱크 "+sync(uu.m,uu.p).toFixed(2)+
            (bits.length?" ("+bits.join("·")+")":"");
        break;
      }
    }
  }
  return {v:after-before,why:why,fired:fired,near:near};
}

function pick(c){
  if(busy)return;
  var type=SCHEDULE[round],before={},pg0=pledges(teams[0]),i;
  for(i=0;i<pg0.length;i++)before[pg0[i].n]=pg0[i].v;
  if(sharedPack){
    for(i=0;i<packArr.length;i++)if(packArr[i].c===c&&packArr[i].by===null){packArr[i].by=0;break}
  }else{tossPack(type,curPack,c);curPack=null}
  take(type,c,0);
  var pg1=pledges(teams[0]),fresh=[];
  for(i=0;i<pg1.length;i++)
    if(before[pg1[i].n]===undefined||before[pg1[i].n]!==pg1[i].v)fresh.push(pg1[i]);
  justFired=fresh.map(function(g){return g.n});
  announce(fresh);
  advance();
  setTimeout(function(){justFired=[]},900);
}

  var type=SCHEDULE[round],who=turnSeq()[si];
  take(type,aiDraw(type,who),who);
  si++;
  if(si>=3){if(sharedPack)tossRest(SCHEDULE[round]);si=0;round++;busy=false;render();return}
  renderHead();renderBoard();renderPack();
  if(turnSeq()[si]!==0){schedStep();return}
  busy=false;renderPack();renderDock();
}
function advance(){
  si++;
  if(si>=3){if(sharedPack)tossRest(SCHEDULE[round]);si=0;round++}
  render();
}

var DEX_POOL={"함":SHIP,"기체":MECH,"파일럿":PILOT,"지휘관":CREW};
var dexTab="기체", dexView=null, dexScroll=0, ovlEl=null;
var dexVar="r";   /* 도감에서 볼 초상 — "m" · "f" · "r"(무작위) */
var dexSlide=0;   /* 넘어간 방향 — 밀림 효과에 쓴다 */
var dexSer="";    /* 시리즈 걸러보기 — 빈 값이면 전부 */
/* 지금 탭에서 걸러진 목록 — 격자와 앞뒤 이동이 같은 목록을 본다 */
function dexList(tab){
  var arr=DEX_POOL[tab]||[];
  if(!dexSer)return arr;
  return arr.filter(function(c){return serAll(c).indexOf(dexSer)>=0});
}
/* 그 탭에 실제로 있는 시리즈만 골라 센다 */
function serCounts(tab){
  var arr=DEX_POOL[tab]||[],cnt={},i,j;
  for(i=0;i<arr.length;i++){
    var sl=serAll(arr[i]);
    for(j=0;j<sl.length;j++)cnt[sl[j]]=(cnt[sl[j]]||0)+1;
  }
  return cnt;
}
/* 상세에서 같은 탭의 이웃 카드로. 끝에서는 반대편으로 돈다 */
function dexStep(dir){
  if(!dexView)return;
  var arr=dexList(dexView.t);if(!arr.length)return;
  var i=arr.indexOf(dexView.c);
  if(i<0){arr=DEX_POOL[dexView.t];i=arr.indexOf(dexView.c);if(i<0)return}
  var n=(i+dir+arr.length)%arr.length;
  dexSlide=dir;
  dexView={c:arr[n],t:dexView.t,v:dexView.v};   /* 성별 선택은 이어간다 */
  drawOvl();
}

function bondsOf(card,type){
  var out=[],k;
  for(k in BOND){
    var pr=k.split("|");

    if(type==="기체"&&pr[1]===card[0])out.push(pr[0]);
  }
  return out;
}

    var srcx=IMG[c[0]];
    function drawGal(list,label){
      if(!list||!list.length)return;
      var g=el("div","gal");
      g.appendChild(el("div","gh",label+" "+list.length+"<span></span>"));
      for(var gi=0;gi<list.length;gi++){
        (function(url){
          var box=el("div","gi");
          box.innerHTML='<img src="'+imgURL(url)+'" alt="" loading="lazy" decoding="async" onerror="this.parentNode.style.display=\'none\'">';
          box.onclick=function(){openZoom(url)};
          g.appendChild(box);
        })(list[gi]);
      }
      w.appendChild(g);
    }
    if(srcx){
      /* 지금 판에서 고른 화풍만 크게 뜨지만, 갖고 있는 그림은 화풍별로 다 보여준다 */
      var bks=artBuckets(c[0]),bi;
      for(bi=0;bi<bks.length;bi++){
        var tail=bks[bi].k?" · "+(ART_NAME[bks[bi].k]||bks[bi].k):"";
        ["f","m"].forEach(function(g){
          var gl=g==="f"?"여":"남";
          drawGal(cutsOf(bks[bi].b,"extra",g),"다른 그림"+tail+
            (cutsOf(bks[bi].b,"extra",flip(g)).length?" · "+gl:""));
          drawGal(cutsOf(bks[bi].b,"casual",g),"일상"+tail+
            (cutsOf(bks[bi].b,"casual",flip(g)).length?" · "+gl:""));
        });
      }
    }
    if(!srcx)w.appendChild(el("div","note",
      '이 카드에는 아직 그림이 없다. <b>IMG["'+c[0]+'"]</b>에 남성체(m)·여성체(f)를 넣으면 여기에 뜬다.'
      +'<br>갤러리용 그림은 <b>extra[]</b>, 일상 버전은 <b>casual[]</b> 에 넣는다.'));
  }else{
    var tabs=el("div","tabs");
    kindNames().concat(["공적","통계"]).forEach(function(t){
      var b3=el("button","tab"+(dexTab===t?" on":""),
        DEX_POOL[t]?t+" "+DEX_POOL[t].length:t);
      b3.onclick=function(){dexTab=t;dexScroll=0;drawOvl()};
      tabs.appendChild(b3);
    });
    w.appendChild(tabs);
    if(DEX_POOL[dexTab]){
      var vr=el("div","dexvar");
      vr.appendChild(el("span",null,"초상"));
      [["남","m"],["여","f"],["무작위","r"]].forEach(function(o){
        var vb=el("button","obtn"+(dexVar===o[1]?" on":""),o[0]);
        vb.onclick=function(){dexVar=o[1];cfgSave();drawOvl()};
        vr.appendChild(vb);
      });
      w.appendChild(vr);
      var cnt2=serCounts(dexTab),order=Object.keys(SER_NAME),k2,opts="";
      opts+='<option value="">전체 '+DEX_POOL[dexTab].length+'</option>';
      for(k2=0;k2<order.length;k2++){
        var code=order[k2];
        if(!cnt2[code])continue;
        opts+='<option value="'+code+'"'+(dexSer===code?" selected":"")+'>'+
          SER_NAME[code]+' '+cnt2[code]+'</option>';
      }
      var fr=el("div","serrow");
      var sel=el("select","selser");
      sel.innerHTML=opts;
      sel.value=dexSer;
      sel.onchange=function(){dexSer=this.value;dexScroll=0;drawOvl()};
      fr.appendChild(sel);
      if(dexSer){
        var cl2=el("button","serclr","전체");
        cl2.onclick=function(){dexSer="";dexScroll=0;drawOvl()};
        fr.appendChild(cl2);
      }
      w.appendChild(fr);
    }
    if(dexTab==="공적"){drawRecord(w);finishOvl(ov,w,a,dexScroll);return}
    if(dexTab==="통계"){drawStats(w);finishOvl(ov,w,a,dexScroll);return}
    var g=el("div","dexg"),arr=dexList(dexTab),i,
        ratio=1/(ASPECT[dexTab]||1.5);   /* ASPECT는 높이÷폭, CSS는 폭÷높이 */
    for(i=0;i<arr.length;i++){
      var c2=arr[i],b4=el("button","dexi");
      b4.style.setProperty("--cc",fc(c2[1][c2[1].length-1]));
      b4.innerHTML='<span class="fw" style="aspect-ratio:'+ratio.toFixed(4)+'">'+
        avHTML(c2,dexTab,null,dexVar==='r'?null:dexVar)+'</span><span>'+c2[0]+'</span>'+
        '<em>'+serLabel(c2)+'</em>';
      (function(n,t){b4.onclick=function(){
        if(ovlEl)dexScroll=ovlEl.scrollTop;
        openDetail(n,t);
      }})(c2[0],dexTab);
      g.appendChild(b4);
    }
    if(!arr.length)w.appendChild(el("div","note","이 시리즈에는 해당하는 카드가 없다."));
    w.appendChild(g);
  }
  /* 상세에서는 좌우로 밀어 이웃 카드로 — 세로 스크롤과 겹치지 않게 판정한다 */
  if(dexView){
    var sx=0,sy=0,st=0,moved=false;
    ov.addEventListener("touchstart",function(e){
      var t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();moved=false;
    },{passive:true});
    ov.addEventListener("touchend",function(e){
      if(moved)return;
      var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Date.now()-st>700)return;
      if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy)*1.5)return;
      moved=true;
      dexStep(dx<0?1:-1);
    },{passive:true});
  }
  /* 목록으로 돌아오면 보던 자리로 */
  finishOvl(ov,w,a,dexView?0:dexScroll);
}
document.getElementById("dexbtn").onclick=function(){openDex()};
/* 도크의 썸네일을 누르면 그 카드의 상세로 */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest(".th"):null;
  if(t&&t.dataset&&t.dataset.n){e.stopPropagation();openDetail(t.dataset.n,t.dataset.t)}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeOvl();
  else if(dexView&&e.key==="ArrowLeft")dexStep(-1);
  else if(dexView&&e.key==="ArrowRight")dexStep(1);
});

/* ═══════ 시작 화면 ═══════ */
function setup(){
  ["packArea","dockArea","boardArea","endArea"].forEach(function(id){
    document.getElementById(id).innerHTML="";});
  document.getElementById("gauge").innerHTML="";
  document.getElementById("rdl").textContent="OPERATION SETUP";
  document.getElementById("rdt").innerHTML="출격 <em>준비</em>";
  var tn=document.getElementById("turn");tn.textContent="설정";tn.className="turn";
  var a=document.getElementById("packArea"),box=el("div","setupbox");

  /* 다른 주제로 열었으면 어느 자리에 쌓이는지 밝혀 둔다 — 건담 전적과 섞이지 않는다 */
  if(SET_NAME!=="gundam"){
    var sb=el("div","note");
    sb.style.cssText="margin:0 0 12px;border:1px solid #2f4a5c;border-radius:8px;"+
      "background:#16222b;color:#9fc4d8;font-size:12px;line-height:1.7;padding:9px 11px";
    sb.innerHTML='주제 <b>'+SET_NAME+'</b> 로 열었다. 전적은 건담과 따로 쌓인다 '+
      '(지금 '+REC.games+'판).';
    a.appendChild(sb);
  }else if(REC_MOVED>=0){
    var mb=el("div","note");
    mb.style.cssText="margin:0 0 12px;border:1px solid #3f5a3a;border-radius:8px;"+
      "background:#18231a;color:#a9cba1;font-size:12px;line-height:1.7;padding:9px 11px";
    mb.innerHTML='주제마다 전적을 따로 쌓게 되어, 여태 쌓인 <b>'+REC_MOVED+
      '판</b>을 건담 자리로 옮겼다. 옛 자리도 그대로 두었다.';
    a.appendChild(mb);
  }
  /* 자료가 어긋난 것이 있으면 설정 화면 위에 접어 둔다. 판은 서지만 알고는 있어야 한다 */
  if(DATA_WARN.length){
    var wb=el("details");
    wb.style.cssText="margin:0 0 12px;border:1px solid #6b5a1f;border-radius:8px;"+
      "background:#241f12;color:#d9c98a;font-size:12px;line-height:1.7;padding:9px 11px";
    wb.innerHTML='<summary style="cursor:pointer;font-weight:700">자료에 일러둘 것 '+
      DATA_WARN.length+'건</summary><ul style="margin:8px 0 0;padding-left:1.1em">'+
      DATA_WARN.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
    a.appendChild(wb);
  }

  function optRow(label,desc,btns){
    var r=el("div","optrow");
    r.appendChild(el("div","optlab","<b>"+label+"</b><span>"+desc+"</span>"));
    var bs=el("div","optbtns");
    btns.forEach(function(b){bs.appendChild(b)});
    r.appendChild(bs);return r;
  }
  var lvBtns=AI_NAME.map(function(n,i){
    var b=el("button","obtn"+(AI_LV===i?" on":""),n);
    b.onclick=function(){AI_LV=i;cfgSave();setup()};return b;
  });
  box.appendChild(optRow("적 함대","신참은 실수하고 에이스는 인연까지 노린다",lvBtns));
  /* 카드가 765 기까지 늘어 여섯 조는 좁아졌다. 몇 조를 꾸릴지 고르게 한다 */
  if(SCALE_OPTS.length>1){
    var scBtns=SCALE_OPTS.map(function(n){
      var b=el("button","obtn"+(SCALE===n?" on":""),n+"조");
      b.onclick=function(){applyScale(n);cfgSave();setup()};return b;
    });
    box.appendChild(optRow("편성 규모",
      "한 편이 몇 조를 꾸릴지 — 지금 "+SCHEDULE.length+"라운드, 셋이 "+
      (slotsOf(CAP_FROM)*3)+"기를 집는다",scBtns));
  }
  function toggle(get,set){
    var b=el("button","obtn"+(get()?" on":""),get()?"켬":"끔");
    b.onclick=function(){set(!get());cfgSave();setup()};return [b];
  }
  function viewRow(label,desc,get,set,opts){
    var bs=opts.map(function(o){
      var b=el("button","obtn"+(get()===o[1]?" on":""),o[0]);
      b.onclick=function(){set(o[1]);cfgSave();setup()};return b;
    });
    return optRow(label,desc,bs);
  }
  box.appendChild(viewRow("파일럿 초상","파일럿 카드를 어느 쪽으로 볼지",
    function(){return VIEW_P},function(v){VIEW_P=v},
    [["남",'m'],["여",'f'],["무작위",'r']]));
  box.appendChild(viewRow("기체 초상","기체 카드를 어느 쪽으로 볼지",
    function(){return VIEW_M},function(v){VIEW_M=v},
    [["남",'m'],["여",'f'],["무작위",'r'],["반대",'x']]));
  var spBtns=[["공유",true],["개별",false]].map(function(o){
    var b=el("button","obtn"+(sharedPack===o[1]?" on":""),o[0]);
    b.onclick=function(){sharedPack=o[1];cfgSave();setup()};return b;
  });
  box.appendChild(optRow("보급 방식","한 팩을 나눠 집을지, 각자 받을지",spBtns));
  var rrBtns=RR_OPT.map(function(n){
    var b=el("button","obtn"+(REROLL_MAX===n?" on":""),n===0?"없음":n+"회");
    b.onclick=function(){REROLL_MAX=n;cfgSave();setup()};return b;
  });
  box.appendChild(optRow("보급 요청","팩을 다시 펼치는 횟수 — 적 함대도 같이 쓴다",rrBtns));
  box.appendChild(optRow("증감 힌트","카드마다 점수 변화와 인연을 미리 본다",
    toggle(function(){return hintOn},function(v){hintOn=v})));
  box.appendChild(optRow("관제 두절","적 함대의 편성을 판정 때까지 가린다",
    toggle(function(){return fogOn},function(v){fogOn=v})));
  box.appendChild(optRow("보급 제한","한 번 나온 카드는 한동안 다시 오지 않는다",
    toggle(function(){return exhaustOn},function(v){exhaustOn=v})));
  var go=el("button","btn big","출격");
  go.onclick=function(){reset()};
  var r2=el("div","row");r2.appendChild(go);
  box.appendChild(r2);
  box.appendChild(el("div","note",
    "<b>전적</b>  "+REC.games+"판 · 수위 "+REC.first+" · 2위 "+REC.second+" · 3위 "+REC.third+
    (REC.best?"<br>최고 점수 "+REC.best:"")+
    "<br>교신 기록 "+Object.keys(REC.stamps).length+" · 훈장 "+Object.keys(REC.feats).length+"/"+FEATS.length));
  a.appendChild(box);
}
/* ═══════ 부팅 ═══════
   카드를 받아 와야 시작할 수 있다. 예전에는 자료가 이 파일 안에 있어
   읽어 들이는 즉시 setup() 을 불렀지만, 지금은 data/*.json 을 기다린다.
   file:// 로 열면 브라우저가 fetch 를 막는다 — 그때는 이유를 적어 준다 */
function boot(){
  loadData().then(function(by){
    if(!showDataReport(validateData(by)))return;
    normalizeAll();
    refreshImages();
    cfgLoad();
    setup();
  }).catch(function(e){
    var why=(location.protocol==="file:")
      ? "브라우저가 file:// 에서는 data/ 를 읽지 못한다.<br>"+
        "저장소 폴더에서 <code>python3 -m http.server</code> 를 띄우고 "+
        "<code>localhost:8000/play.html</code> 로 열어라."
      : "data/ 를 읽지 못했다. 파일이 함께 올라갔는지 확인해라.";
    document.body.innerHTML=
      '<div style="padding:2rem;font:14px/1.7 system-ui;color:#ddd;background:#14161c;'+
      'min-height:100vh"><h2 style="margin:0 0 .8rem">자료를 못 읽었다</h2>'+
      '<p>'+why+'</p><p style="color:#888">'+String(e&&e.message||e)+'</p></div>';
  });
}
boot();

</script>
<script>
/* ══ 새 판 살피기 ══
   홈 화면 앱에는 주소창도 새로고침 단추도 없다. 그래서 스스로 살핀다.
   본문을 통째로 다시 받으면 데이터가 아까우니 머리(HEAD)만 물어 표를 견준다.
   판이 한창일 수 있으니 제멋대로 갈아타지 않고, 띠를 띄워 누를 때 갈아탄다 */
(function(){
  var TAG=null, busy=false, shown=false;
  function stamp(r){return r.headers.get("etag")||r.headers.get("last-modified")||null}
  function look(){
    if(busy||shown||!window.fetch)return; busy=true;
    fetch(location.pathname+"?_="+Date.now(),{method:"HEAD",cache:"no-store"})
      .then(function(r){ busy=false; if(!r.ok)return;
        var t=stamp(r); if(!t)return;
        if(TAG===null){TAG=t;return}
        if(t!==TAG)band();
      }).catch(function(){busy=false});
  }
  function band(){
    if(shown)return; shown=true;
    var d=document.createElement("div");
    d.setAttribute("role","status");
    d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));"+
      "z-index:99999;background:#1b1f27;color:#f0ead8;border:1px solid #C9A227;border-radius:10px;"+
      "padding:12px 14px;font:600 14px/1.5 -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;"+
      "box-shadow:0 6px 22px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center";
    d.innerHTML='<span style="flex:1">새 판이 나왔습니다. 하던 것을 마치고 눌러 주세요.</span>'+
      '<button type="button" style="flex:none;background:#C9A227;color:#17130F;border:0;border-radius:7px;'+
      'padding:8px 12px;font:700 14px/1 inherit">갈아타기</button>'+
      '<button type="button" aria-label="닫기" style="flex:none;background:none;color:#8b8578;border:0;'+
      'font:700 18px/1 inherit;padding:4px 6px">×</button>';
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){
      var u=location.pathname+location.search;
      location.replace(u+(location.search?"&":"?")+"_v="+Date.now());
    };
    b[1].onclick=function(){d.remove();shown=false;TAG=null};
    document.body.appendChild(d);
  }
  look();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)look()});
  window.addEventListener("focus",look);
})();
</script>
